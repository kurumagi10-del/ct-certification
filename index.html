tegory":"副作用対応","question":"造影剤投与後に嗄声、喘鳴、呼吸困難が生じた場合の初期対応はどれか。","choices":{"a":"患者を一人にして画像処理を優先する","b":"応援要請し酸素投与と気道評価を行う","c":"飲水させ歩行で症状消失を確認する","d":"造影剤を追加し反応の再現性を調べる"},"answer":"b","explanation":"嗄声や呼吸困難は気道閉塞を示唆する重篤な症状であり、直ちに応援を呼び、酸素投与および気道確保を開始する。","tags":"副作用;アナフィラキシー;呼吸"},{"id":"TE-43","category":"撮影技術と造影法","subcategory":"副作用対応","question":"造影剤反応による低血圧に対する初期の支持療法はどれか。","choices":{"a":"坐位にして輸液を止め脈拍だけをみる","b":"立位にして酸素を止め血圧だけをみる","c":"下肢挙上し酸素、急速輸液を開始する","d":"腹臥位にして保温を止め体温だけをみる"},"answer":"c","explanation":"造影剤ショックによる低血圧に対し、患者を仰臥位とし下肢を挙上させ、酸素投与と急速輸液を行う。","tags":"副作用;ショック;低血圧"},{"id":"TE-44","category":"撮影技術と造影法","subcategory":"副作用対応","question":"ヨード造影剤による遅発性反応として典型的なのはどれか。","choices":{"a":"注入中の血管痛が数秒以内に現れる","b":"撮影中の熱感が数分以内に現れる","c":"観察中の迷走神経反応が直後に現れる","d":"斑状丘疹状皮疹が数時間後に現れる"},"answer":"d","explanation":"遅発性反応は、造影剤投与後数時間から数日後に現れることがあり、典型的な症状として斑状丘疹状の皮疹が挙げられる。","tags":"副作用;遅発性"},{"id":"TE-45","category":"撮影技術と造影法","subcategory":"副作用対応","question":"ヨード造影剤によるアレルギー様反応の再発リスクを最も強く示す病歴はどれか。","choices":{"a":"同種造影剤によるアレルギー様反応歴","b":"単純CTによる一過性の閉所不安歴","c":"超音波検査による軽い圧迫痛の既往","d":"胸部撮影による軽い立ちくらみの既往"},"answer":"a","explanation":"過去に造影剤でアレルギー様反応（アナフィラキシー含む）を起こしたことがある患者は、再発リスクが非常に高い。","tags":"副作用;アレルギー;病歴"},{"id":"TE-46","category":"撮影技術と造影法","subcategory":"副作用対応","question":"甲殻類アレルギー歴がある患者のヨード造影CTに対する考え方はどれか。","choices":{"a":"ヨード造影剤の絶対禁忌として扱う","b":"他の食物アレルギーと同様に評価する","c":"造影剤との交差反応が必ずあると扱う","d":"重篤反応の最重要予測因子として扱う"},"answer":"b","explanation":"甲殻類アレルギーとヨードアレルギーとの直接的な関連性や交差反応は医学的に証明されておらず、他の食物アレルギーと同様のリスク評価を行う。","tags":"副作用;アレルギー"},{"id":"TE-47","category":"撮影技術と造影法","subcategory":"副作用対応","question":"気管支喘息とヨード造影剤反応との関係はどれか。","choices":{"a":"重篤反応を必ず起こす絶対禁忌である","b":"腎障害を必ず起こす絶対禁忌である","c":"アレルギー様反応リスクをやや高める","d":"血管外漏出を必ず起こす絶対禁忌である"},"answer":"c","explanation":"気管支喘息は、造影剤によるアナフィラキシーなどのアレルギー様反応のリスクを高める要因の一つである。","tags":"副作用;アレルギー;喘息"},{"id":"TE-48","category":"撮影技術と造影法","subcategory":"腎機能","question":"造影剤関連急性腎障害の概念として適切なのはどれか。","choices":{"a":"造影剤が単独原因と病理学的に証明された慢性腎障害を指す","b":"造影剤と無関係な慢性腎障害だけを指す","c":"造影剤投与前に改善した急性腎障害を指す","d":"造影後に生じた原因未確定の急性腎障害を指す"},"answer":"d","explanation":"造影剤関連急性腎障害（CI-AKI）は、他の原因を除外した上で、造影剤投与後に生じた原因不明の腎機能悪化を指す。","tags":"腎機能;造影剤腎症"},{"id":"TE-49","category":"撮影技術と造影法","subcategory":"腎機能","question":"急性腎障害などを有する高リスク患者で検討される予防策はどれか。","choices":{"a":"等張性輸液による適切な容量補充を行う","b":"N-アセチルシステインを全例へ投与する","c":"ループ利尿薬を全例へ追加投与する","d":"造影直後に予防透析を全例へ実施する"},"answer":"a","explanation":"高リスク患者における造影剤関連急性腎障害の予防には、造影前後の十分な等張性輸液による水分補給が最も重要である。","tags":"腎機能;予防策;輸液"},{"id":"TE-50","category":"撮影技術と造影法","subcategory":"腎機能","question":"メトホルミン服用患者で造影後の腎機能悪化に注意する主な理由はどれか。","choices":{"a":"メトホルミン自体が造影剤腎障害を起こすため","b":"急性腎障害時に乳酸アシドーシスが懸念されるため","c":"メトホルミンが造影剤濃度を上昇させ血管外漏出を必ず起こすため","d":"メトホルミンが尿中ヨードを結晶化させ尿路閉塞を必ず起こすため"},"answer":"b","explanation":"メトホルミン服用患者において、造影剤による急性腎障害が生じると、メトホルミンの排泄が滞り、致死的な乳酸アシドーシスを引き起こす可能性がある。","tags":"腎機能;メトホルミン;乳酸アシドーシス"},{"id":"ED-01","category":"被ばく管理と線量評価","subcategory":"CTDIvol","question":"CTDIvolの説明として適切なのはどれか。","choices":{"a":"患者臓器の実吸収線量を直接示している指標","b":"全身リスクを年齢別に換算した指標","c":"標準ファントムによる装置出力の指標","d":"撮影範囲を含む総線量を表している指標"},"answer":"c","explanation":"CTDIvolは標準ファントムによる装置出力の指標である。","tags":"被ばく;指標;装置出力"},{"id":"ED-02","category":"被ばく管理と線量評価","subcategory":"DLP","question":"DLPの定義として適切なのはどれか。","choices":{"a":"CTDIvolと撮影長の積である","b":"CTDIvolを撮影長で除した指標","c":"SSDEに患者体重を乗じた指標","d":"実効線量を臓器数で除した指標"},"answer":"a","explanation":"DLPはCTDIvolと撮影長の積で定義される。","tags":"被ばく;指標;撮影長"},{"id":"ED-03","category":"被ばく管理と線量評価","subcategory":"SSDE","question":"SSDEの特徴として適切なのはどれか。","choices":{"a":"標準体格の実効線量を年齢で補正した値","b":"臓器線量の合計を撮影長で補正した値","c":"装置出力を管電圧の比率で補正した値","d":"CTDIvolの患者サイズ補正値"},"answer":"d","explanation":"SSDEはCTDIvolの患者サイズ補正値である。","tags":"被ばく;指標;患者サイズ"},{"id":"ED-04","category":"被ばく管理と線量評価","subcategory":"実効線量","question":"実効線量の算出概念として適切なのはどれか。","choices":{"a":"各臓器の吸収線量を単純加算した量","b":"組織荷重係数を用いて合算した量","c":"CTDIvolを患者体重だけで補正した量","d":"DLPを全撮影時間で平均化した量"},"answer":"b","explanation":"実効線量は組織荷重係数を用いて各臓器の線量を合算した量である。","tags":"被ばく;指標;組織荷重係数"},{"id":"ED-05","category":"被ばく管理と線量評価","subcategory":"線量指標","question":"CTの線量指標と単位の組合せとして適切なのはどれか。","choices":{"a":"CTDIvolはmGy、DLPはmGy cm、実効線量はSv","b":"CTDIvolはmSv、DLPはmGy、実効線量はmGy cm","c":"CTDIvolはmGy cm、DLPはmSv、実効線量はmGy","d":"CTDIvolはmGy、DLPはmSv、実効線量はmGy cm"},"answer":"a","explanation":"CTDIvolはmGy、DLPはmGy cm、実効線量はSvである。","tags":"被ばく;指標;単位"},{"id":"ED-06","category":"被ばく管理と線量評価","subcategory":"撮影条件","question":"他の撮影条件と管電流時間積を一定にしてヘリカルピッチを上げた場合、CTDIvolはどうなるか。","choices":{"a":"撮影長に比例して増加する","b":"患者体重に比例して増加する","c":"ピッチに反比例して低下する","d":"スライス厚に反比例して低下する"},"answer":"c","explanation":"CTDIvolはピッチに反比例して低下する。","tags":"ヘリカルピッチ;線量;撮影条件"},{"id":"ED-07","category":"被ばく管理と線量評価","subcategory":"画像ノイズ","question":"X線量と画像ノイズの基本的な関係として適切なのはどれか。","choices":{"a":"X線量を増やすと量子ノイズも増加する","b":"X線量を増やすと量子ノイズは減少する","c":"X線量を変えても量子ノイズは一定である","d":"X線量を減らすと量子ノイズも減少する"},"answer":"b","explanation":"X線量を増やすと量子ノイズは減少する。","tags":"画像ノイズ;量子ノイズ;X線量"},{"id":"ED-08","category":"被ばく管理と線量評価","subcategory":"撮影条件","question":"同じ再構成法と画像ノイズを保ちながら再構成スライス厚を薄くする場合、一般に必要な対応はどれか。","choices":{"a":"管電流を下げて線量を少なくする","b":"撮影長を延ばして線量を多くする","c":"管電圧を下げて線量を少なくする","d":"管電流を上げて線量を多くする"},"answer":"d","explanation":"スライス厚を薄くするとノイズが増えるため、管電流を上げて線量を多くする。","tags":"再構成;スライス厚;線量"},{"id":"ED-09","category":"被ばく管理と線量評価","subcategory":"画質","question":"低コントラスト検出能を改善する要因として適切なのはどれか。","choices":{"a":"画像ノイズを増加させること","b":"部分体積効果を増加させること","c":"画像ノイズを低下させること","d":"ビームハードニングを増加させること"},"answer":"c","explanation":"画像ノイズを低下させると低コントラスト検出能が改善する。","tags":"画質;コントラスト;ノイズ"},{"id":"ED-10","category":"被ばく管理と線量評価","subcategory":"再構成法","question":"逐次近似再構成の線量管理上の利点として適切なのはどれか。","choices":{"a":"撮影範囲を延長して解剖情報を増やせる","b":"同等ノイズのまま線量を低減できる","c":"管電圧を固定して造影効果を一定にできる","d":"寝台速度を固定して撮影時間を短縮できる"},"answer":"b","explanation":"逐次近似再構成は同等ノイズのまま線量を低減できる。","tags":"逐次近似再構成;ノイズ;線量低減"},{"id":"ED-11","category":"被ばく管理と線量評価","subcategory":"造影CT","question":"造影CTで管電圧を下げる際の一般的な特徴として適切なのはどれか。","choices":{"a":"ヨード造影効果が高まりノイズに注意する","b":"ヨード造影効果が下がる一方でノイズに注意する","c":"ヨード造影効果が高まる一方で撮影長に注意する","d":"ヨード造影効果が下がる一方で撮影長に注意する"},"answer":"a","explanation":"管電圧を下げるとヨード造影効果が高まる一方、ノイズが増えるため注意が必要。","tags":"管電圧;ヨード造影;ノイズ"},{"id":"ED-12","category":"被ばく管理と線量評価","subcategory":"ヘリカルCT","question":"ヘリカルCTにおけるオーバーレンジングの説明として適切なのはどれか。","choices":{"a":"位置決め画像を予定範囲より長く撮ること","b":"検査目的を超えて多相撮影を追加すること","c":"再構成画像を予定範囲より厚く作ること","d":"補間用に予定範囲外まで照射すること"},"answer":"d","explanation":"オーバーレンジングは補間用に予定範囲外まで照射することである。","tags":"ヘリカル;照射;補間"},{"id":"ED-13","category":"被ばく管理と線量評価","subcategory":"撮影範囲","question":"不要な撮影範囲の拡大を防ぐ方法として適切なのはどれか。","choices":{"a":"再構成関数を検査目的ごとに選択する","b":"必要な解剖範囲だけを撮影する","c":"表示条件を検査目的ごとに選択する","d":"画像保存範囲を必要な時相に限定する"},"answer":"b","explanation":"必要な解剖範囲だけを撮影することが、不要な範囲の拡大を防ぐ。","tags":"撮影範囲;最適化;防護"},{"id":"ED-14","category":"被ばく管理と線量評価","subcategory":"撮影時相","question":"同じ部位で撮影時相を追加した場合の線量への影響として適切なのはどれか。","choices":{"a":"各時相のDLPが相殺され総DLPは低下する","b":"各時相のDLPが平均され総DLPは一定になる","c":"各時相のDLPが加算され総DLPは増加する","d":"各時相のDLPが除算され総DLPは低下する"},"answer":"c","explanation":"撮影時相を追加すると各時相のDLPが加算され総DLPは増加する。","tags":"時相;DLP;線量"},{"id":"ED-15","category":"被ばく管理と線量評価","subcategory":"AEC","question":"CTのAECの主な目的として適切なのはどれか。","choices":{"a":"撮影中の管電圧を常に一定値へ保つこと","b":"撮影中の寝台速度を常に一定値へ保つこと","c":"撮影中のスライス厚を体格別に変えること","d":"減弱に応じて管電流を調整すること"},"answer":"d","explanation":"AECは患者の減弱に応じて管電流を調整する。","tags":"AEC;管電流;線量"},{"id":"ED-16","category":"被ばく管理と線量評価","subcategory":"AEC","question":"CTの自動管電流変調に含まれる方式として適切なのはどれか。","choices":{"a":"体軸方向変調と回転角度方向変調","b":"管電圧方向変調と焦点寸法方向変調","c":"寝台方向変調と再構成関数方向変調","d":"撮影時相変調と表示条件方向変調"},"answer":"a","explanation":"自動管電流変調には体軸方向変調と回転角度方向変調がある。","tags":"AEC;変調;管電流"},{"id":"ED-17","category":"被ばく管理と線量評価","subcategory":"AEC","question":"AECを用いるCTで患者の中心位置合わせが重要な理由として適切なのはどれか。","choices":{"a":"寝台速度が中心位置だけで決定されるため","b":"再構成関数が中心位置だけで決定されるため","c":"見かけの体格と線量調整に影響するため","d":"造影剤濃度と注入速度に影響するため"},"answer":"c","explanation":"中心位置がずれると見かけの体格が変わり、線量調整に影響する。","tags":"AEC;位置合わせ;線量調整"},{"id":"ED-18","category":"被ばく管理と線量評価","subcategory":"撮影技術","question":"胸腹部CTで可能な患者の腕を挙上する主な利点として適切なのはどれか。","choices":{"a":"体幹の減弱とストリークを抑える","b":"体幹部の撮影長と撮影時相を減らせる","c":"体幹部の造影剤量と注入速度を減らせる","d":"体幹部のスライス厚と画像枚数を減らせる"},"answer":"a","explanation":"腕を挙上することで体幹の減弱とストリークを抑える。","tags":"撮影技術;腕挙上;アーチファクト"},{"id":"ED-19","category":"被ばく管理と線量評価","subcategory":"AEC","question":"多くのCT装置でAECが管電流計画に利用する情報として適切なのはどれか。","choices":{"a":"検査後に作成した冠状断画像の減弱情報","b":"撮影前に得た位置決め画像の減弱情報","c":"検査後に作成した線量報告書の統計情報","d":"撮影前に入力した造影剤量の投与情報"},"answer":"b","explanation":"AECは位置決め画像の減弱情報を利用して管電流を計画する。","tags":"AEC;位置決め;管電流"},{"id":"ED-20","category":"被ばく管理と線量評価","subcategory":"臓器線量","question":"臓器線量変調の説明として適切なのはどれか。","choices":{"a":"側面通過時の管電圧を上げて骨盤線量を増やす","b":"後面通過時の管電圧を下げて脊椎線量を増やす","c":"側面通過時の管電流を上げて皮膚線量を増やす","d":"前面側の管電流を抑え表在臓器線量を減らす"},"answer":"d","explanation":"臓器線量変調は前面側の管電流を抑え表在臓器線量を減らす方式である。","tags":"線量変調;臓器;線量"},{"id":"ED-21","category":"被ばく管理と線量評価","subcategory":"正当化","question":"AECを使用する場合の検査の正当化について適切なのはどれか。","choices":{"a":"AEC使用中も検査の正当化が必要である","b":"AECを使用すれば検査ごとの正当化は不要である","c":"AECを使用すれば依頼目的の確認は不要である","d":"AECを使用すれば代替検査の検討は不要である"},"answer":"a","explanation":"検査の正当化は装置の機能（AEC等）に関わらず必要である。","tags":"正当化;最適化;防護"},{"id":"ED-22","category":"被ばく管理と線量評価","subcategory":"AEC","question":"メーカーが異なるAECの画質設定値を扱う際に適切なのはどれか。","choices":{"a":"同じ数値なら同じCTDIvolになると判断する","b":"同じ数値なら同じ画像ノイズになると判断する","c":"同じ数値なら同じ管電流になると判断する","d":"定義を確認し単純な数値比較を避ける"},"answer":"d","explanation":"メーカーごとに定義が異なるため、単純な数値比較は避けるべきである。","tags":"AEC;画質設定;比較"},{"id":"ED-23","category":"被ばく管理と線量評価","subcategory":"小児CT","question":"小児CTのプロトコル設定として適切なのはどれか。","choices":{"a":"成人条件を年齢に関係なくそのまま用いる","b":"成人条件を撮影部位に関係なくそのまま用いる","c":"体格と診断目的に応じた条件を用いる","d":"体格と診断目的に関係なく条件を固定する"},"answer":"c","explanation":"小児CTは体格と診断目的に応じて条件を適正化すべきである。","tags":"小児;プロトコル;最適化"},{"id":"ED-24","category":"被ばく管理と線量評価","subcategory":"DRL","question":"診断参考レベルであるDRLの位置づけとして適切なのはどれか。","choices":{"a":"個々の患者に適用する厳格な線量限度である","b":"標準検査の線量最適化に使う指標である","c":"確定的影響を防ぐ個人別のしきい値である","d":"装置故障を判定する一律の許容誤差である"},"answer":"b","explanation":"DRLは線量最適化のための指標である。","tags":"DRL;指標;最適化"},{"id":"ED-25","category":"被ばく管理と線量評価","subcategory":"DRL","question":"国や地域のDRLを設定する基礎として適切なのはどれか。","choices":{"a":"一人の患者における最大線量の測定値","b":"一台の装置における最小線量の測定値","c":"一人の患者における臓器線量の計算値","d":"複数施設における代表線量値の分布"},"answer":"d","explanation":"DRLは複数施設における代表線量の分布から設定される。","tags":"DRL;設定;分布"},{"id":"ED-26","category":"被ばく管理と線量評価","subcategory":"DRL","question":"施設の代表的なCT線量がDRLを継続して上回る場合の対応として適切なのはどれか。","choices":{"a":"直ちに全患者の検査を一律に中止する","b":"原因を調査してプロトコルを最適化する","c":"全患者の線量をDRLと同じ値に固定する","d":"線量記録を削除して再集計を回避する"},"answer":"b","explanation":"DRLを上回る場合は原因調査とプロトコル最適化を行う。","tags":"DRL;対応;最適化"},{"id":"ED-27","category":"被ばく管理と線量評価","subcategory":"DRL","question":"施設の代表的なCT線量がDRLを下回る場合の解釈として適切なのはどれか。","choices":{"a":"診断に必要な画質も併せて確認する","b":"線量が低いほど常に検査品質は高い","c":"画質に関係なく線量をさらに半減する","d":"検査目的に関係なく条件を統一する"},"answer":"a","explanation":"DRLを下回る場合でも、診断に必要な画質が保たれているか確認する必要がある。","tags":"DRL;画質;評価"},{"id":"ED-28","category":"被ばく管理と線量評価","subcategory":"DRL","question":"2026年時点で日本のCT線量管理に用いる最新の全国DRLはどれか。","choices":{"a":"Japan DRLs 2015初版","b":"Japan DRLs 2020改訂版","c":"Japan DRLs 2025","d":"Japan DRLs 2030改訂版"},"answer":"c","explanation":"Japan DRLs 2025が現在使用される最新のDRLである。","tags":"DRL;最新;日本"},{"id":"ED-29","category":"被ばく管理と線量評価","subcategory":"DRL","question":"Japan DRLs 2025における成人の頭部単純ルーチンCTの組合せはどれか。","choices":{"a":"CTDIvol 57 mGy、DLP 1160 mGy cm","b":"CTDIvol 67 mGy、DLP 1260 mGy cm","c":"CTDIvol 77 mGy、DLP 1360 mGy cm","d":"CTDIvol 107 mGy、DLP 1460 mGy cm"},"answer":"b","explanation":"Japan DRLs 2025の頭部単純ルーチンCTの値はCTDIvol 67mGy、DLP 1260mGy cmである。","tags":"DRL;頭部;数値"},{"id":"ED-30","category":"被ばく管理と線量評価","subcategory":"正当化","question":"医療被ばくにおける検査の正当化として適切なのはどれか。","choices":{"a":"線量がゼロになる検査だけを実施すること","b":"装置の稼働率が上がる検査を実施すること","c":"依頼医が希望した検査を無条件で実施すること","d":"期待される医学的便益がリスクを上回ること"},"answer":"d","explanation":"便益がリスクを上回ることが検査正当化の条件である。","tags":"正当化;便益;リスク"},{"id":"ED-31","category":"被ばく管理と線量評価","subcategory":"最適化","question":"医療被ばくにおける防護の最適化として適切なのはどれか。","choices":{"a":"診断情報に関係なく最低線量を選ぶこと","b":"全患者に同一の撮影条件を適用すること","c":"必要画質を保って線量を抑えること","d":"線量に関係なく最高画質を常に選ぶこと"},"answer":"c","explanation":"必要画質を保ちつつ線量を最小限に抑えることが最適化である。","tags":"最適化;防護;画質"},{"id":"ED-32","category":"被ばく管理と線量評価","subcategory":"線量限度","question":"ICRPの考え方に基づく患者の医療被ばくへの線量限度の適用として適切なのはどれか。","choices":{"a":"患者に線量限度を適用せず最適化を重視する","b":"職業被ばくと同じ線量限度を患者にも一律適用する","c":"公衆被ばくと同じ線量限度を患者にも一律適用する","d":"年齢だけで決めた線量限度を患者ごとに一律適用する"},"answer":"a","explanation":"患者への医療被ばくには線量限度を適用せず、最適化を重視する。","tags":"線量限度;患者;最適化"},{"id":"ED-33","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線の確率的影響の特徴として適切なのはどれか。","choices":{"a":"発生確率は一定で重症度だけが線量で増す","b":"しきい値を超えると重症度だけが線量で増す","c":"しきい値以下では発生確率が必ずゼロになる","d":"線量が増すと発生確率が高まると仮定する"},"answer":"d","explanation":"確率的影響は線量が増すと発生確率が高まると仮定される。","tags":"放射線影響;確率的影響;発生確率"},{"id":"ED-34","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線の組織反応の特徴として適切なのはどれか。","choices":{"a":"一般にしきい値があり線量とともに重症度が増す","b":"一般にしきい値がなく線量とともに重症度が減る","c":"一般にしきい値があり線量とともに発生率が下がる","d":"一般にしきい値がなく線量とともに発生率が一定になる"},"answer":"a","explanation":"組織反応（確定的影響）はしきい値があり、重症度が増す。","tags":"放射線影響;組織反応;しきい値"},{"id":"ED-35","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線誘発がんの時間的特徴として適切なのはどれか。","choices":{"a":"被ばく直後だけに発生して以後は生じない","b":"被ばくから発症まで潜伏期間が存在する","c":"被ばくした時点で必ず臨床症状が出現する","d":"被ばく後の一定時刻に全員で同時発症する"},"answer":"b","explanation":"放射線誘発がんには潜伏期間が存在する。","tags":"放射線影響;がん;潜伏期間"},{"id":"ED-36","category":"被ばく管理と線量評価","subcategory":"小児被ばく","question":"同程度のCT被ばくを受けた小児と成人の比較として適切なのはどれか。","choices":{"a":"小児は余命が短いため生涯リスクが低い","b":"小児は細胞分裂が少ないため影響を受けにくい","c":"小児は感受性と余命の点からリスクが高い","d":"小児は体格が小さいため臓器線量が常にゼロになる"},"answer":"c","explanation":"小児は感受性が高く余命も長いためリスクが高い。","tags":"小児;感受性;リスク"},{"id":"ED-37","category":"被ばく管理と線量評価","subcategory":"胎児被ばく","question":"胎児への放射線影響を評価する際の考え方として適切なのはどれか。","choices":{"a":"妊娠時期と胎児線量で評価する","b":"母体年齢だけを考慮して一律に評価する","c":"撮影装置の製造年だけで一律に評価する","d":"造影剤の注入速度だけで一律に評価する"},"answer":"a","explanation":"胎児影響は妊娠時期と胎児線量で評価する。","tags":"胎児;被ばく;影響評価"},{"id":"ED-38","category":"被ばく管理と線量評価","subcategory":"胎児被ばく","question":"妊娠の可能性がある患者にCTが検討される場合の対応として適切なのはどれか。","choices":{"a":"妊娠の可能性だけで必要な検査を永久に中止する","b":"妊娠の可能性を確認せず通常条件で検査を進める","c":"臨床的必要性を確認し代替法と条件を検討する","d":"胎児線量を確認せず患者に判断をすべて委ねる"},"answer":"c","explanation":"必要性を確認し代替法や条件の最適化を検討する。","tags":"胎児;妊娠;対応"},{"id":"ED-39","category":"被ばく管理と線量評価","subcategory":"放射線感受性","question":"細胞の放射線感受性に関する一般的な説明として適切なのはどれか。","choices":{"a":"分裂せず高度に分化した細胞ほど感受性が高い","b":"分裂頻度と分化度に関係なく感受性は同じである","c":"分裂頻度が低く高度に分化した細胞ほど感受性が高い","d":"分裂頻度が高く未分化な細胞ほど感受性が高い"},"answer":"d","explanation":"分裂頻度が高く未分化な細胞ほど感受性が高い。","tags":"感受性;細胞;放射線"},{"id":"ED-40","category":"被ばく管理と線量評価","subcategory":"線量評価","question":"CT検査の実効線量を患者個人のリスク説明に使う際の注意点として適切なのはどれか。","choices":{"a":"個人の臓器線量と発がん確率を正確に確定できる","b":"標準集団に基づく概算で個人差を十分に表さない","c":"CTDIvolと常に同じ数値になるため換算は不要である","d":"患者体格だけで決まり撮影部位による差は生じない"},"answer":"b","explanation":"実効線量は標準集団に基づく概算であり個人差を十分に表さない。","tags":"実効線量;リスク;説明"},{"id":"ED-41","category":"被ばく管理と線量評価","subcategory":"リスクコミュニケーション","question":"患者へのCT被ばくのリスクコミュニケーションとして適切なのはどれか。","choices":{"a":"便益を説明せず放射線リスクだけを強調する","b":"リスクを説明せず検査の便益だけを強調する","c":"便益とリスクを平易に伝え不確かさも示す","d":"専門用語だけを用いて数値の比較を避ける"},"answer":"c","explanation":"便益とリスクを平易に伝え、不確かさも伝えることが重要。","tags":"リスクコミュニケーション;便益;リスク"},{"id":"ED-42","category":"被ばく管理と線量評価","subcategory":"X線の性質","question":"CTで使用するX線の性質として適切なのはどれか。","choices":{"a":"電離作用を持たない機械的な縦波である","b":"物質を電離し得る電磁放射線である","c":"静磁場だけから成る非電離放射線である","d":"可聴域の周波数だけを持つ音波である"},"answer":"b","explanation":"X線は物質を電離し得る電磁放射線である。","tags":"X線;物理;電離"},{"id":"ED-43","category":"被ばく管理と線量評価","subcategory":"放射線防護","question":"CT室内にやむを得ず残るスタッフが受ける主な放射線の由来として適切なのはどれか。","choices":{"a":"患者や周囲の物質から生じる散乱線","b":"画像表示モニタから生じる一次X線","c":"造影剤自動注入器から生じる中性子線","d":"再構成計算装置から生じる電子線"},"answer":"a","explanation":"スタッフが受ける主な放射線は散乱線である。","tags":"防護;散乱線;スタッフ"},{"id":"ED-44","category":"被ばく管理と線量評価","subcategory":"放射線防護","question":"介助者がやむを得ずCT室内で患者を保持する場合の対応として適切なのはどれか。","choices":{"a":"照射野内に立ち患者と同じ部位を保持する","b":"防護具を使わず患者の近くで保持を続ける","c":"線源に近づきガントリへ体を密着させる","d":"照射野を避け距離と防護具を活用する"},"answer":"d","explanation":"照射野を避け、距離を保ち、防護具を使用する。","tags":"防護;介助者;保持"},{"id":"ED-45","category":"被ばく管理と線量評価","subcategory":"線量記録","question":"CT線量情報を系統的に保存する仕組みとして適切なのはどれか。","choices":{"a":"画像の表示条件だけを記録する検像票","b":"CTDIvolとDLPの線量記録","c":"造影剤の商品名だけを記録する注射票","d":"患者の会計情報だけを記録する請求票"},"answer":"b","explanation":"CTDIvolとDLPの線量記録を行うべきである。","tags":"記録;線量;保存"},{"id":"ED-46","category":"被ばく管理と線量評価","subcategory":"防護","question":"不要な再撮影による被ばくを防ぐ取り組みとして適切なのはどれか。","choices":{"a":"撮影前に患者確認とプロトコル確認を行う","b":"撮影後に撮影範囲を毎回追加して確認する","c":"撮影前に過去画像を見ず同じ検査を繰り返す","d":"撮影後に理由を問わず全時相を再撮影する"},"answer":"a","explanation":"事前確認を行うことで不要な再撮影を防ぐ。","tags":"再撮影;防護;確認"},{"id":"ED-47","category":"被ばく管理と線量評価","subcategory":"計算","question":"CTDIvolが10 mGy、撮影長が30 cmのとき、DLPはいくらか。","choices":{"a":"30 mGy cm","b":"100 mGy cm","c":"1000 mGy cm","d":"300 mGy cm"},"answer":"d","explanation":"DLP = CTDIvol × 撮影長 = 10 mGy × 30 cm = 300 mGy cm","tags":"計算;DLP;CTDIvol"},{"id":"ED-48","category":"被ばく管理と線量評価","subcategory":"計算","question":"DLPが500 mGy cm、換算係数が0.02 mSv/(mGy cm)のとき、概算実効線量はいくらか。","choices":{"a":"2.5 mSv","b":"5 mSv","c":"10 mSv","d":"20 mSv"},"answer":"c","explanation":"実効線量 = DLP × 換算係数 = 500 × 0.02 = 10 mSv","tags":"計算;実効線量;DLP"},{"id":"ED-49","category":"被ばく管理と線量評価","subcategory":"SSDE","question":"同じCTDIvolで体格だけが異なる体幹部CTのSSDEについて、一般的に適切なのはどれか。","choices":{"a":"小さい患者ではCTDIvolを上回りやすい","b":"小さい患者では必ずCTDIvolと等しくなる","c":"大きい患者ではCTDIvolより大きくなりやすい","d":"大きい患者では必ずCTDIvolと等しくなる"},"answer":"a","explanation":"体格が小さい患者では、減弱が少なくてもSSDEはCTDIvolを上回る傾向がある。","tags":"SSDE;体格;線量"},{"id":"ED-50","category":"被ばく管理と線量評価","subcategory":"監査","question":"施設で行うCT線量監査として適切なのはどれか。","choices":{"a":"全検査の最大値だけを装置間で比較する","b":"検査別線量をDRLと画質で評価する","c":"患者一人の最小値だけを全国値と比較する","d":"装置の管電圧だけを患者体格と比較する"},"answer":"b","explanation":"線量監査は検査別の線量をDRLや画質とともに評価する。","tags":"監査;DRL;評価"}]</script>
<script>
(function(){
"use strict";

var ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
var CATEGORY_ORDER = [];
ALL_QUESTIONS.forEach(function(q){ if(CATEGORY_ORDER.indexOf(q.category)===-1) CATEGORY_ORDER.push(q.category); });

var CATEGORY_ICON = {};
(function(){
  var icons = [
    '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.4" fill="currentColor" stroke="none"/>',
    '<path d="M4 18c2-8 6-12 8-12s6 4 8 12" fill="none"/><path d="M7 18c1.4-5.5 3.6-8.5 5-8.5s3.6 3 5 8.5" fill="none"/>',
    '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    '<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3z" fill="none"/><path d="M9 12l2 2 4-4"/>'
  ];
  CATEGORY_ORDER.forEach(function(cat,i){ CATEGORY_ICON[cat] = icons[i % icons.length]; });
})();

var LS_KEY = 'ctquiz_progress_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {missed:{}, attempts:{}, correct:{}}; }
  catch(e){ return {missed:{}, attempts:{}, correct:{}}; }
}
function saveStore(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
var store = loadStore();
if(!store.correct) store.correct = {};

var state = {
  screen: 'home',
  homeTab: 'setup',
  selectedCats: CATEGORY_ORDER.slice(),
  count: 20,
  shuffle: true,
  weakOnly: false,
  queue: [],
  idx: 0,
  answered: null,
  score: 0,
  history: []
};

function byId(id){ return document.getElementById(id); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]===null || attrs[k]===false || attrs[k]===undefined){ /* skip: no attribute */ }
    else if(attrs[k]===true) e.setAttribute(k, '');
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function svgIcon(inner){
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function ringSvg(size, stroke, pct, color){
  var r = (size-stroke)/2;
  var c = 2*Math.PI*r;
  var off = c*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" '+
      'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .4s ease"/>'+
    '</svg>';
}
function catCount(cat){ return ALL_QUESTIONS.filter(function(q){return q.category===cat;}).length; }
function weakCount(){
  var ids = Object.keys(store.missed).filter(function(id){ return store.missed[id] > 0; });
  return ids.length;
}
function catProficiency(cat){
  var ids = ALL_QUESTIONS.filter(function(q){return q.category===cat;}).map(function(q){return q.id;});
  var attemptedQ = 0, totalAttempts = 0, totalCorrect = 0;
  ids.forEach(function(id){
    var a = store.attempts[id]||0, c = store.correct[id]||0;
    if(a>0) attemptedQ++;
    totalAttempts += a; totalCorrect += c;
  });
  var acc = totalAttempts ? Math.round(totalCorrect/totalAttempts*100) : null;
  var level = acc===null ? 'neutral' : acc>=80 ? 'good' : acc>=50 ? 'amber' : 'bad';
  return {total: ids.length, attemptedQ: attemptedQ, acc: acc, level: level};
}

function render(){
  var app = byId('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  if(state.screen==='home') app.appendChild(renderHome());
  else if(state.screen==='quiz') app.appendChild(renderQuiz());
  else if(state.screen==='result') app.appendChild(renderResult());
  app.appendChild(renderFooter());
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function renderTopbar(){
  var back = state.screen!=='home';
  return el('div',{class:'topbar'},[
    el('div',{class:'brand'},[
      el('div',{class:'mark'}),
      el('div',{class:'name'},['GANTRY', el('small',{},['CT認定試験対策'])])
    ]),
    back ? el('button',{class:'icon-btn', onclick:function(){
      if(state.screen==='quiz'){
        if(!confirm('検査を中断してホームに戻りますか？進行中の結果は保存されません。')) return;
      }
      state.screen='home'; render();
    }},[el('span',{html:svgIcon('<path d="M15 18l-6-6 6-6"/>')}), 'ホームへ']) : el('span',{class:'icon-btn', style:'visibility:hidden'},['　'])
  ]);
}

function renderFooter(){
  return el('footer',{class:'app-footer'},['GANTRY — CT認定試験対策 ／ 全 '+ALL_QUESTIONS.length+' 問収録']);
}

/* ---------------- HOME ---------------- */
function renderHome(){
  var wrap = el('div',{});

  var hero = el('section',{class:'hero'},[
    el('div',{class:'eyebrow'},['CT認定技師試験対策']),
    el('p',{class:'lead'},['4分野・250問を1問ずつ解いて、解説とともに理解を積み上げていきます。']),
    el('div',{class:'hero-stats'},[
      statBlock(String(ALL_QUESTIONS.length), '収録問題数'),
      statBlock(String(CATEGORY_ORDER.length), '出題分野'),
      statBlock(String(weakCount()), '要復習問題')
    ])
  ]);
  wrap.appendChild(hero);

  var tabNav = el('div',{class:'tab-nav'},[
    el('button',{type:'button', class: state.homeTab==='setup' ? 'active':'', onclick:function(){ state.homeTab='setup'; render(); }},['出題']),
    el('button',{type:'button', class: state.homeTab==='stats' ? 'active':'', onclick:function(){ state.homeTab='stats'; render(); }},['習熟度'])
  ]);
  wrap.appendChild(tabNav);

  if(state.homeTab==='stats'){
    wrap.appendChild(renderProficiency());
    return wrap;
  }

  wrap.appendChild(el('div',{class:'section-label'},['分野を選択']));
  var grid = el('div',{class:'cat-grid'});
  CATEGORY_ORDER.forEach(function(cat){
    var active = state.selectedCats.indexOf(cat)>-1;
    var card = el('button',{class:'cat-card'+(active?' active':''), type:'button', onclick:function(){
      var i = state.selectedCats.indexOf(cat);
      if(i>-1){
        if(state.selectedCats.length===1) return;
        state.selectedCats.splice(i,1);
      } else state.selectedCats.push(cat);
      render();
    }},[
      el('span',{class:'icon', html:svgIcon(CATEGORY_ICON[cat])}),
      el('div',{},[
        el('div',{class:'cat-title'},[cat]),
        el('div',{class:'cat-meta'},[catCount(cat)+' 問']),
      ]),
      el('span',{class:'check'})
    ]);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  wrap.appendChild(el('div',{class:'section-label'},['検査条件']));
  var setup = el('div',{class:'setup-row'});

  var countField = el('div',{class:'field'},[el('label',{},['出題数'])]);
  var seg = el('div',{class:'seg'});
  [10,20,50,'all'].forEach(function(v){
    var label = v==='all' ? '全問' : String(v);
    var b = el('button',{type:'button', class: state.count===v ? 'active':'', onclick:function(){ state.count=v; render(); }},[label]);
    seg.appendChild(b);
  });
  countField.appendChild(seg);
  setup.appendChild(countField);

  var orderField = el('div',{class:'field'},[el('label',{},['出題順'])]);
  var seg2 = el('div',{class:'seg'});
  [[true,'シャッフル'],[false,'ID順']].forEach(function(pair){
    var b = el('button',{type:'button', class: state.shuffle===pair[0] ? 'active':'', onclick:function(){ state.shuffle=pair[0]; render(); }},[pair[1]]);
    seg2.appendChild(b);
  });
  orderField.appendChild(seg2);
  setup.appendChild(orderField);

  wrap.appendChild(setup);

  if(weakCount()>0){
    wrap.appendChild(el('div',{class:'weak-banner'},[
      el('div',{class:'t'},['過去に誤答した問題が ', el('b',{},[String(weakCount())]), ' 問あります。']),
      el('button',{class:'btn-ghost', onclick:function(){ startQuiz(true); }},['苦手問題だけ解く'])
    ]));
  }

  var pool = poolForSelection();
  wrap.appendChild(el('div',{class:'start-bar'},[
    el('div',{class:'avail', html:'選択中: <span class="mono">'+pool.length+'</span> 問から出題されます'}),
    el('button',{class:'btn-primary', disabled: pool.length===0, onclick:function(){ startQuiz(false); }},[
      el('span',{html:svgIcon('<path d="M5 3l14 9-14 9V3z"/>')}), 'スキャン開始'
    ])
  ]));

  return wrap;
}
function renderProficiency(){
  var wrap = el('div',{});
  wrap.appendChild(el('div',{class:'section-label'},['分野別の習熟度']));
  var list = el('div',{class:'bar-list'});
  var anyAttempt = false;
  CATEGORY_ORDER.forEach(function(cat){
    var p = catProficiency(cat);
    if(p.acc!==null) anyAttempt = true;
    var pctLabel = p.acc===null ? '未着手' : p.acc+'%';
    var row = el('div',{class:'bar-row'},[
      el('div',{class:'top'},[
        el('span',{class:'name'},[cat]),
        el('span',{class:'pct-tag '+p.level},[pctLabel])
      ]),
      el('div',{class:'bar-track'},[ el('div',{class:'bar-fill '+p.level, style:'width:'+(p.acc||0)+'%'}) ]),
      el('div',{class:'sub'},[p.attemptedQ+' / '+p.total+' 問に解答済み'])
    ]);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  if(!anyAttempt){
    wrap.appendChild(el('div',{class:'empty-note'},['まだ解答記録がありません。「出題」タブから問題を解くと、ここに分野別の正答率が表示されます。']));
  }
  return wrap;
}
function statBlock(num,label){
  return el('div',{},[ el('div',{class:'num'},[num]), el('div',{class:'lbl'},[label]) ]);
}
function poolForSelection(){
  return ALL_QUESTIONS.filter(function(q){ return state.selectedCats.indexOf(q.category)>-1; });
}

function startQuiz(weak){
  var pool;
  if(weak){
    pool = ALL_QUESTIONS.filter(function(q){ return (store.missed[q.id]||0) > 0; });
  } else {
    pool = poolForSelection();
  }
  if(pool.length===0) return;
  var ordered = state.shuffle ? shuffleArr(pool) : pool.slice();
  var n = weak ? ordered.length : (state.count==='all' ? ordered.length : Math.min(state.count, ordered.length));
  state.queue = ordered.slice(0,n);
  state.idx = 0;
  state.answered = null;
  state.score = 0;
  state.history = [];
  state.screen = 'quiz';
  render();
}

/* ---------------- QUIZ ---------------- */
function currentQ(){ return state.queue[state.idx]; }

function renderQuiz(){
  var q = currentQ();
  var wrap = el('div',{});
  var pct = state.queue.length ? state.idx/state.queue.length : 0;
  var deg = Math.round(pct*360);

  var ringDiv = el('div',{class:'ring-wrap'});
  ringDiv.innerHTML = ringSvg(52,4,pct,'var(--accent)');
  var degSpan = el('div',{class:'deg'},[deg+'°']);
  ringDiv.appendChild(degSpan);

  wrap.appendChild(el('div',{class:'quiz-top'},[
    ringDiv,
    el('div',{class:'quiz-meta'},[
      el('div',{class:'cat'},[q.category]),
      el('div',{class:'prog'},[el('b',{},[String(state.idx+1)]), ' / '+state.queue.length+' 問'])
    ])
  ]));

  var card = el('div',{class:'q-card'});
  card.appendChild(el('div',{},[
    el('span',{class:'q-id mono'},[q.id]),
    el('span',{class:'q-sub'},[q.subcategory])
  ]));
  card.appendChild(el('div',{class:'q-text'},[q.question]));

  var choicesDiv = el('div',{class:'choices'});
  var letters = ['a','b','c','d'];
  letters.forEach(function(L){
    var isAnswered = state.answered !== null;
    var isCorrect = L === q.answer;
    var isPicked = state.answered === L;
    var cls = 'choice';
    if(isAnswered){
      if(isCorrect) cls += ' correct';
      else if(isPicked) cls += ' wrong';
      else cls += ' dim';
    }
    var btn = el('button',{type:'button', class:cls, disabled: isAnswered ? 'disabled' : null, onclick:function(){ selectAnswer(L); }},[
      el('span',{class:'badge'},[L.toUpperCase()]),
      el('span',{},[q.choices[L]])
    ]);
    choicesDiv.appendChild(btn);
  });
  card.appendChild(choicesDiv);

  if(state.answered !== null){
    var correct = state.answered === q.answer;
    var expWrap = el('div',{class:'explain'});
    expWrap.appendChild(el('div',{class:'result-tag '+(correct?'ok':'ng')},[correct?'正解':'不正解 — 正答は '+q.answer.toUpperCase()]));
    expWrap.appendChild(el('p',{},[q.explanation]));
    if(q.tags){
      var tagsDiv = el('div',{class:'tags'});
      q.tags.split(';').forEach(function(t){ t=t.trim(); if(t) tagsDiv.appendChild(el('span',{class:'tag'},[t])); });
      expWrap.appendChild(tagsDiv);
    }
    card.appendChild(expWrap);
  }

  var actions = el('div',{class:'q-actions'});
  actions.appendChild(el('button',{class:'link-quiet', onclick:function(){
    if(!confirm('検査を終了して結果を確認しますか？')) return;
    finishQuiz();
  }}, ['ここで終了して結果を見る']));

  if(state.answered !== null){
    var isLast = state.idx === state.queue.length-1;
    actions.appendChild(el('button',{class:'btn-primary', onclick:function(){
      if(isLast) finishQuiz(); else nextQuestion();
    }},[ isLast ? '結果を見る' : '次の問題', el('span',{html:svgIcon('<path d="M9 6l6 6-6 6"/>')})]));
  }
  card.appendChild(actions);
  wrap.appendChild(card);
  wrap.appendChild(el('div',{class:'kbd-hint'},['選択: ',el('kbd',{},['1']),el('kbd',{},['2']),el('kbd',{},['3']),el('kbd',{},['4']),'　次へ: ',el('kbd',{},['Enter'])]));

  return wrap;
}

function selectAnswer(L){
  if(state.answered !== null) return;
  var q = currentQ();
  state.answered = L;
  var correct = L === q.answer;
  if(correct) state.score++;
  store.missed[q.id] = correct ? 0 : ((store.missed[q.id]||0) + 1);
  store.attempts[q.id] = (store.attempts[q.id]||0) + 1;
  store.correct[q.id] = (store.correct[q.id]||0) + (correct ? 1 : 0);
  saveStore(store);
  state.history.push({q:q, picked:L, correct:correct});
  render();
}
function nextQuestion(){
  state.idx++;
  state.answered = null;
  render();
}
function finishQuiz(){
  state.screen = 'result';
  render();
}

document.addEventListener('keydown', function(e){
  if(state.screen !== 'quiz') return;
  var map = {'1':'a','2':'b','3':'c','4':'d'};
  if(map[e.key] && state.answered===null){ selectAnswer(map[e.key]); }
  else if(e.key==='Enter' && state.answered!==null){
    var isLast = state.idx === state.queue.length-1;
    if(isLast) finishQuiz(); else nextQuestion();
  }
});

/* ---------------- RESULT ---------------- */
function renderResult(){
  var wrap = el('div',{});
  var total = state.history.length;
  var correct = state.history.filter(function(h){return h.correct;}).length;
  var pct = total ? correct/total : 0;

  var ring = el('div',{class:'score-ring'});
  ring.innerHTML = ringSvg(168,12,pct,'var(--accent)');
  ring.appendChild(el('div',{class:'center'},[
    el('div',{class:'pct mono'},[Math.round(pct*100)+'%']),
    el('div',{class:'of'},[correct+' / '+total+' 問正解'])
  ]));

  wrap.appendChild(el('section',{class:'result-hero'},[
    ring,
    el('div',{class:'result-copy'},[ el('h2',{},['結果']) ])
  ]));

  wrap.appendChild(el('div',{class:'section-label'},['分野別スコア']));
  var barList = el('div',{class:'bar-list'});
  var byCat = {};
  state.history.forEach(function(h){
    var c = h.q.category;
    byCat[c] = byCat[c] || {c:0,t:0};
    byCat[c].t++;
    if(h.correct) byCat[c].c++;
  });
  Object.keys(byCat).forEach(function(c){
    var d = byCat[c];
    var p = d.t? d.c/d.t : 0;
    var row = el('div',{class:'bar-row'},[
      el('div',{class:'top'},[ el('span',{class:'name'},[c]), el('span',{class:'frac mono'},[d.c+'/'+d.t]) ]),
      el('div',{class:'bar-track'},[ el('div',{class:'bar-fill', style:'width:'+(p*100)+'%'}) ])
    ]);
    barList.appendChild(row);
  });
  wrap.appendChild(barList);

  wrap.appendChild(el('div',{class:'section-label'},['誤答の復習']));
  var wrongs = state.history.filter(function(h){return !h.correct;});
  if(wrongs.length===0){
    wrap.appendChild(el('div',{class:'empty-note'},['誤答はありませんでした。']));
  } else {
    var rl = el('div',{class:'review-list'});
    wrongs.forEach(function(h){
      var item = el('div',{class:'review-item'},[
        el('div',{},[ el('span',{class:'q-id mono'},[h.q.id]), el('span',{class:'q-sub'},[h.q.subcategory]) ]),
        el('div',{class:'rq'},[h.q.question]),
        el('div',{class:'ra'},[
          el('div',{class:'you'},['あなたの回答: '+h.picked.toUpperCase()+'）'+h.q.choices[h.picked]]),
          el('div',{class:'right'},['正答: '+h.q.answer.toUpperCase()+'）'+h.q.choices[h.q.answer]])
        ]),
        el('div',{class:'rexp'},[h.q.explanation])
      ]);
      rl.appendChild(item);
    });
    wrap.appendChild(rl);
  }

  wrap.appendChild(el('div',{class:'result-actions'},[
    el('button',{class:'btn-primary', onclick:function(){ startQuiz(false); }},['同じ条件でもう一度']),
    wrongs.length>0 ? el('button',{class:'btn-ghost', onclick:function(){
      state.queue = state.shuffle ? shuffleArr(wrongs.map(function(h){return h.q;})) : wrongs.map(function(h){return h.q;});
      state.idx=0; state.answered=null; state.score=0; state.history=[];
      state.screen='quiz'; render();
    }},['誤答だけ再挑戦']) : null,
    el('button',{class:'btn-ghost', onclick:function(){ state.screen='home'; render(); }},['ホームに戻る'])
  ]));

  return wrap;
}

render();
})();
</script>
</body>
</html>
