<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>CT認定AP - 学習アプリ</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CT認定AP">
<style>
  :root{
    --bg:#0B0F14;
    --panel:#121820;
    --panel2:#1A222C;
    --line:#26313D;
    --text:#E7EDF3;
    --sub:#8CA0B3;
    --cyan:#46D9CE;
    --amber:#F2A65A;
    --red:#E8637A;
    --green:#5FCB8B;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans JP', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 85% -10%, rgba(70,217,206,0.10), transparent 45%),
      radial-gradient(circle at -10% 110%, rgba(242,166,90,0.08), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:70px;
  }
  a{color:inherit;}

  /* ---- Gantry ring header ---- */
  header{
    padding:22px 18px 14px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(11,15,20,0.92);
    backdrop-filter:blur(6px);
    z-index:20;
  }
  .gantry{
    width:40px;height:40px;flex:none;position:relative;
  }
  .gantry svg{width:100%;height:100%;animation:spin 8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  header h1{
    font-size:16px;
    margin:0;
    letter-spacing:0.02em;
    font-weight:700;
  }
  header .tagline{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--sub);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:2px;
  }

  main{max-width:640px;margin:0 auto;padding:18px 16px 40px;}

  /* ---- Tab bar (bottom nav, thumb-reachable) ---- */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--line);
    z-index:30;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;color:var(--sub);
    font-family:var(--sans);
    font-size:12px;
    padding:11px 4px 9px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;
  }
  nav.tabbar button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  nav.tabbar button.active{color:var(--cyan);}
  nav.tabbar button.active .dot{background:var(--cyan);}

  h2.section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--cyan);
    font-family:var(--mono);
    margin:0 0 12px;
    display:flex;align-items:center;gap:8px;
  }
  h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:14px;
  }

  /* ---- Setup screen ---- */
  .mode-switch{display:flex;gap:8px;margin-bottom:18px;}
  .mode-btn{
    flex:1;padding:14px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--sub);cursor:pointer;text-align:left;
  }
  .mode-btn strong{display:block;color:var(--text);font-size:14px;margin-bottom:3px;}
  .mode-btn span{font-size:11.5px;font-family:var(--mono);}
  .mode-btn.selected{border-color:var(--cyan);background:rgba(70,217,206,0.08);}
  .mode-btn.selected strong{color:var(--cyan);}

  label.field-label{
    display:block;font-size:11.5px;color:var(--sub);
    text-transform:uppercase;letter-spacing:0.06em;font-family:var(--mono);
    margin:14px 0 6px;
  }
  select, .chip-group{width:100%;}
  select{
    width:100%;padding:10px 12px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    font-family:var(--sans);font-size:14px;
  }
  .chip-group{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    padding:7px 12px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel2);color:var(--sub);font-size:12.5px;cursor:pointer;
    font-family:var(--mono);
  }
  .chip.selected{border-color:var(--amber);color:var(--amber);background:rgba(242,166,90,0.10);}

  .count-line{
    margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--sub);
  }
  .count-line b{color:var(--text);font-size:15px;}

  .start-btn{
    width:100%;margin-top:16px;padding:15px;border:none;border-radius:10px;
    background:linear-gradient(135deg, var(--cyan), #2FB8AC);
    color:#08201D;font-weight:700;font-size:15px;cursor:pointer;
    letter-spacing:0.02em;
  }
  .start-btn:disabled{opacity:0.35;cursor:not-allowed;}

  /* ---- Quiz screen ---- */
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:var(--mono);font-size:12px;color:var(--sub);}
  .progress-track{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));transition:width .3s;}

  .q-meta{font-family:var(--mono);font-size:11px;color:var(--sub);margin-bottom:8px;letter-spacing:0.04em;}
  .q-text{font-size:16px;line-height:1.65;margin-bottom:18px;}

  .choice{
    display:flex;gap:10px;align-items:flex-start;
    padding:13px 14px;margin-bottom:9px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel2);
    cursor:pointer;font-size:14.5px;line-height:1.55;
  }
  .choice .letter{
    font-family:var(--mono);color:var(--sub);flex:none;
    width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;
  }
  .choice:hover{border-color:#3A4856;}
  .choice.correct{border-color:var(--green);background:rgba(95,203,139,0.10);}
  .choice.correct .letter{background:var(--green);color:#0B0F14;border-color:var(--green);}
  .choice.incorrect{border-color:var(--red);background:rgba(232,99,122,0.10);}
  .choice.incorrect .letter{background:var(--red);color:#0B0F14;border-color:var(--red);}
  .choice.disabled{cursor:default;}
  .choice.dim{opacity:0.45;}

  .feedback{
    margin-top:6px;padding:13px 14px;border-radius:9px;font-size:13.5px;line-height:1.65;
    border:1px solid var(--line);background:var(--panel2);
  }
  .feedback.correct{border-color:var(--green);}
  .feedback.incorrect{border-color:var(--red);}
  .feedback .fb-head{font-family:var(--mono);font-weight:700;margin-bottom:5px;letter-spacing:0.04em;}
  .feedback.correct .fb-head{color:var(--green);}
  .feedback.incorrect .fb-head{color:var(--red);}
  .feedback .fb-body{color:var(--sub);}

  .nav-row{display:flex;gap:10px;margin-top:16px;}
  .btn{
    flex:1;padding:13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer;font-weight:600;
  }
  .btn.primary{background:var(--cyan);color:#08201D;border:none;}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}

  /* ---- Result screen ---- */
  .score-ring-wrap{display:flex;justify-content:center;margin:10px 0 20px;}
  .score-num{font-family:var(--mono);font-size:34px;text-align:center;}
  .score-label{text-align:center;color:var(--sub);font-size:12px;font-family:var(--mono);margin-top:2px;letter-spacing:0.06em;}

  .review-item{border-bottom:1px solid var(--line);padding:12px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .rq{font-size:13.5px;margin-bottom:6px;}
  .review-item .rtag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:10px;margin-right:6px;}
  .rtag.ok{color:var(--green);border:1px solid var(--green);}
  .rtag.ng{color:var(--red);border:1px solid var(--red);}

  /* ---- Progress tab ---- */
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
  .stat-row:last-child{border-bottom:none;}
  .stat-name{font-size:13.5px;}
  .stat-sub{font-size:11px;color:var(--sub);font-family:var(--mono);}
  .bar-track{width:90px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-left:10px;}
  .bar-fill{height:100%;background:var(--cyan);}
  .stat-num{font-family:var(--mono);font-size:12px;color:var(--sub);width:44px;text-align:right;}

  .master-badges{display:flex;gap:16px;margin-bottom:6px;}
  .badge{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;text-align:center;}
  .badge .n{font-family:var(--mono);font-size:20px;}
  .badge .l{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .badge.master .n{color:var(--green);}
  .badge.learning .n{color:var(--amber);}
  .badge.weak .n{color:var(--red);}
  .badge.new .n{color:var(--sub);}

  .reset-link{
    display:block;text-align:center;margin-top:20px;font-family:var(--mono);
    font-size:11.5px;color:var(--sub);text-decoration:underline;cursor:pointer;background:none;border:none;width:100%;
  }

  .empty-note{color:var(--sub);font-size:13px;text-align:center;padding:30px 10px;}
</style>
</head>
<body>

<header>
  <div class="gantry">
    <svg viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#1D2833" stroke-width="3.4"/>
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#46D9CE" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="68 23" transform="rotate(-90 20 20)"/>
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#F2A65A" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="10 81" stroke-dashoffset="-68" transform="rotate(-90 20 20)"/>
      <g stroke="#BFF3EC" stroke-width="1.6" stroke-linecap="round">
        <line x1="20" y1="8.5" x2="20" y2="12.5"/>
        <line x1="20" y1="27.5" x2="20" y2="31.5"/>
        <line x1="8.5" y1="20" x2="12.5" y2="20"/>
        <line x1="27.5" y1="20" x2="31.5" y2="20"/>
      </g>
      <circle cx="20" cy="20" r="2.4" fill="#F2A65A"/>
    </svg>
  </div>
  <div>
    <h1>CT認定AP</h1>
    <div class="tagline">診療放射線技師 CT認定試験対策</div>
  </div>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button data-tab="practice" class="active"><span class="dot"></span>演習モード</button>
  <button data-tab="exam"><span class="dot"></span>模擬試験</button>
  <button data-tab="progress"><span class="dot"></span>進捗</button>
</nav>

<script>
/* =========================================================
   データ（CSVから埋め込み）
========================================================= */
const QUESTIONS = [
{"id":"CB-01","category":"CT装置の構成と基礎","subcategory":"X線管の熱容量","question":"X線管の熱容量について正しいのはどれか。","choices":{"a":"陽極熱容量は管電圧×管電流×露光時間で表される。","b":"陽極熱容量が小さいほど，連続撮影に適している。","c":"陽極熱容量が大きいほど，短時間で高出力の撮影が可能である。","d":"陽極熱容量は陽極の材質に依存しない。","e":"陽極熱容量は管電流の二乗に比例する。"},"correct":"c","explanation":"","tags":"陽極熱容量;熱特性;X線出力"},
{"id":"CB-02","category":"CT装置の構成と基礎","subcategory":"検出器の特性","question":"CT検出器の特性として正しいのはどれか。","choices":{"a":"検出効率が高いほど，線量利用効率が低い。","b":"応答速度が速いほど，高速回転撮影に適している。","c":"残光が長いほど，画質が向上する。","d":"検出器素子間隔が広いほど，空間分解能が高い。","e":"幾何学的効率は，検出器の配置には依存しない。"},"correct":"b","explanation":"","tags":"検出効率;検出器;応答速度"},
{"id":"CB-03","category":"CT装置の構成と基礎","subcategory":"コリメータの役割","question":"CT装置におけるコリメータの役割はどれか。","choices":{"a":"X線管の焦点サイズの変更","b":"被写体の散乱線の除去","c":"検出器の温度調節","d":"管電圧の安定化","e":"再構成アルゴリズムの選択"},"correct":"b","explanation":"","tags":"散乱線除去;コリメータ;画質"},
{"id":"CB-04","category":"CT装置の構成と基礎","subcategory":"画像再構成","question":"CTの逐次近似再構成について正しいのはどれか。","choices":{"a":"計算時間がフィルタ補正逆投影法よりも短い。","b":"統計的ノイズモデルを考慮できない。","c":"アーチファクトの低減に有効である。","d":"空間分解能の向上は期待できない。","e":"投影データを使用しない。"},"correct":"c","explanation":"","tags":"逐次近似再構成;アーチファクト;画質"},
{"id":"CB-05","category":"CT装置の構成と基礎","subcategory":"ヘリカルスキャン","question":"ヘリカルスキャンのピッチ係数について正しいのはどれか。","choices":{"a":"ピッチ係数が1より大きいと，スライス厚が薄くなる。","b":"ピッチ係数が小さいほど，被ばく線量が低減する。","c":"ピッチ係数はテーブル移動量／ビーム幅で定義される。","d":"ピッチ係数が大きいほど，画像コントラストが向上する。","e":"ピッチ係数は0に設定できる。"},"correct":"c","explanation":"","tags":"ピッチ係数;被ばく低減;ヘリカルスキャン"},
{"id":"CB-06","category":"CT装置の構成と基礎","subcategory":"再構成パラメータ","question":"再構成関数（カーネル）の選択で正しい組み合わせはどれか。","choices":{"a":"骨評価には，高周波強調カーネルを用いる。","b":"軟部組織には，高周波強調カーネルを用いる。","c":"高コントラスト分解能が必要な場合は，平滑化カーネルを用いる。","d":"低コントラスト分解能が必要な場合は，高周波強調カーネルを用いる。","e":"再構成関数は画質に影響しない。"},"correct":"a","explanation":"","tags":"再構成関数;カーネル;空間分解能"},
{"id":"CB-07","category":"CT装置の構成と基礎","subcategory":"アーチファクト","question":"金属アーチファクトの原因として正しいのはどれか。","choices":{"a":"ビームハードニング","b":"部分体積効果","c":"エイリアシング","d":"モーション","e":"リングアーチファクト"},"correct":"a","explanation":"","tags":"金属アーチファクト;ビームハードニング;画像品質"},
{"id":"CB-08","category":"CT装置の構成と基礎","subcategory":"被ばく管理","question":"CTDIvolについて正しいのはどれか。","choices":{"a":"スキャン条件が変わっても一定である。","b":"加重CTDI（CTDIw）をピッチで除した値である。","c":"患者の体型に依存しない。","d":"被写体の吸収線量の指標である。","e":"撮影範囲の全線量を示す。"},"correct":"b","explanation":"","tags":"CTDIvol;線量評価;被ばく管理"},
{"id":"CB-09","category":"CT装置の構成と基礎","subcategory":"画質の性能評価","question":"CTの空間分解能を評価する指標はどれか。","choices":{"a":"CT値の精度","b":"MTF（変調伝達関数）","c":"コントラスト対ノイズ比（CNR）","d":"SD値（標準偏差）","e":"信号対雑音比（SNR）"},"correct":"b","explanation":"","tags":"MTF;空間分解能;画質評価"},
{"id":"CB-10","category":"CT装置の構成と基礎","subcategory":"撮影条件","question":"管電流と画質の関係で正しいのはどれか。","choices":{"a":"管電流を増やすと，ノイズが増加する。","b":"管電流を増やすと，CNRが低下する。","c":"管電流とノイズの二乗平均は反比例の関係にある。","d":"管電流を減らすと，被ばく線量が増加する。","e":"管電流は画質に無関係である。"},"correct":"c","explanation":"","tags":"管電流;ノイズ;画質"}
];

const LETTERS = ["a","b","c","d","e"];
const STORAGE_KEY = "ct_ap_progress_v1";

/* =========================================================
   進捗ストレージ
========================================================= */
function loadProgress(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
function recordAnswer(qid, isCorrect){
  const p = loadProgress();
  const rec = p[qid] || {attempts:0, correct:0, streak:0};
  rec.attempts++;
  if(isCorrect){ rec.correct++; rec.streak++; }
  else { rec.streak = 0; }
  p[qid] = rec;
  saveProgress(p);
}
function statusOf(qid){
  const p = loadProgress();
  const rec = p[qid];
  if(!rec || rec.attempts===0) return "new";
  if(rec.streak >= 2) return "master";
  if(rec.streak === 0) return "weak";
  return "learning";
}
const STATUS_LABEL = {new:"未挑戦", weak:"苦手", learning:"学習中", master:"習得"};

/* =========================================================
   ルーティング / タブ
========================================================= */
let currentTab = "practice";
const tabButtons = document.querySelectorAll("nav.tabbar button");
tabButtons.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    tabButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentTab = btn.dataset.tab;
    render();
  });
});

/* =========================================================
   共通ヘルパー
========================================================= */
function uniq(arr){ return [...new Set(arr)]; }
function categories(){ return uniq(QUESTIONS.map(q=>q.category)); }
function subcategories(cat){ return uniq(QUESTIONS.filter(q=> cat==="__all__" || q.category===cat).map(q=>q.subcategory)); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* =========================================================
   演習モード：セットアップ状態
========================================================= */
let practiceSetup = {
  category: "__all__",
  subcats: [],       // 空 = 全サブカテゴリー
  statuses: [],       // 空 = 全ステータス
};

function filteredPracticeQuestions(){
  return QUESTIONS.filter(q=>{
    if(practiceSetup.category !== "__all__" && q.category !== practiceSetup.category) return false;
    if(practiceSetup.subcats.length && !practiceSetup.subcats.includes(q.subcategory)) return false;
    if(practiceSetup.statuses.length && !practiceSetup.statuses.includes(statusOf(q.id))) return false;
    return true;
  });
}

/* =========================================================
   出題セッション（演習・模擬試験共通）
========================================================= */
let session = null; // {mode, queue:[q...], idx, answers:{}, revealed, examMode}

function startSession(list, examMode){
  session = {
    queue: shuffle(list),
    idx: 0,
    answers: {},     // qid -> chosen letter
    revealed: false,
    examMode: examMode
  };
  render();
}

function currentQuestion(){ return session.queue[session.idx]; }

function chooseAnswer(letter){
  if(session.revealed) return;
  const q = currentQuestion();
  session.answers[q.id] = letter;
  const isCorrect = letter === q.correct;
  recordAnswer(q.id, isCorrect);
  if(!session.examMode){
    session.revealed = true;
  }
  render();
}

function nextQuestion(){
  if(session.idx < session.queue.length - 1){
    session.idx++;
    session.revealed = false;
    render();
  } else {
    session.finished = true;
    render();
  }
}
function prevQuestion(){
  if(session.idx > 0){
    session.idx--;
    session.revealed = !session.examMode && !!session.answers[currentQuestion().id];
    render();
  }
}

/* =========================================================
   レンダリング：メイン振り分け
========================================================= */
function render(){
  const main = document.getElementById("main");
  if(currentTab === "progress"){
    session = null;
    main.innerHTML = renderProgressTab();
    attachProgressEvents();
    return;
  }
  if(currentTab === "practice"){
    if(session && !session.finished){ main.innerHTML = renderQuiz(); attachQuizEvents(); }
    else if(session && session.finished){ main.innerHTML = renderResult(); attachResultEvents(); }
    else { main.innerHTML = renderPracticeSetup(); attachPracticeSetupEvents(); }
    return;
  }
  if(currentTab === "exam"){
    if(session && !session.finished){ main.innerHTML = renderQuiz(); attachQuizEvents(); }
    else if(session && session.finished){ main.innerHTML = renderResult(); attachResultEvents(); }
    else { main.innerHTML = renderExamSetup(); attachExamSetupEvents(); }
    return;
  }
}

/* =========================================================
   演習セットアップ画面
========================================================= */
function renderPracticeSetup(){
  const cats = categories();
  const subs = subcategories(practiceSetup.category);
  const count = filteredPracticeQuestions().length;

  return `
    <h2 class="section-title">演習モード設定</h2>
    <div class="card">
      <label class="field-label">カテゴリー</label>
      <select id="cat-select">
        <option value="__all__" ${practiceSetup.category==="__all__"?"selected":""}>すべて</option>
        ${cats.map(c=>`<option value="${esc(c)}" ${practiceSetup.category===c?"selected":""}>${esc(c)}</option>`).join("")}
      </select>

      <label class="field-label">サブカテゴリー（未選択＝すべて）</label>
      <div class="chip-group" id="subcat-chips">
        ${subs.map(s=>`<span class="chip ${practiceSetup.subcats.includes(s)?"selected":""}" data-sub="${esc(s)}">${esc(s)}</span>`).join("")}
      </div>

      <label class="field-label">習熟度で絞り込む（未選択＝すべて）</label>
      <div class="chip-group" id="status-chips">
        ${["new","weak","learning","master"].map(st=>`<span class="chip ${practiceSetup.statuses.includes(st)?"selected":""}" data-status="${st}">${STATUS_LABEL[st]}</span>`).join("")}
      </div>

      <div class="count-line">出題対象：<b>${count}</b> 問</div>
      <button class="start-btn" id="start-practice" ${count===0?"disabled":""}>演習をはじめる</button>
    </div>
  `;
}
function attachPracticeSetupEvents(){
  document.getElementById("cat-select").addEventListener("change", e=>{
    practiceSetup.category = e.target.value;
    practiceSetup.subcats = [];
    render();
  });
  document.querySelectorAll("#subcat-chips .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const s = chip.dataset.sub;
      const i = practiceSetup.subcats.indexOf(s);
      if(i>-1) practiceSetup.subcats.splice(i,1); else practiceSetup.subcats.push(s);
      render();
    });
  });
  document.querySelectorAll("#status-chips .chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      const s = chip.dataset.status;
      const i = practiceSetup.statuses.indexOf(s);
      if(i>-1) practiceSetup.statuses.splice(i,1); else practiceSetup.statuses.push(s);
      render();
    });
  });
  const startBtn = document.getElementById("start-practice");
  if(startBtn) startBtn.addEventListener("click", ()=>{
    startSession(filteredPracticeQuestions(), false);
  });
}

/* =========================================================
   模擬試験セットアップ画面
========================================================= */
let examSetup = { count: Math.min(10, QUESTIONS.length) };
function renderExamSetup(){
  const max = QUESTIONS.length;
  const options = uniq([5,10,20,max].filter(n=>n>0 && n<=max));
  return `
    <h2 class="section-title">模擬試験モード</h2>
    <div class="card">
      <p style="color:var(--sub);font-size:13.5px;line-height:1.7;margin-top:0;">
        全カテゴリーからランダムに出題します。採点は最後にまとめて表示され、途中で正誤はわかりません。
      </p>
      <label class="field-label">出題数</label>
      <div class="chip-group">
        ${options.map(n=>`<span class="chip ${examSetup.count===n?"selected":""}" data-count="${n}">${n}問</span>`).join("")}
      </div>
      <div class="count-line">全 <b>${max}</b> 問中から <b>${examSetup.count}</b> 問を出題</div>
      <button class="start-btn" id="start-exam">模擬試験を開始する</button>
    </div>
  `;
}
function attachExamSetupEvents(){
  document.querySelectorAll("[data-count]").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      examSetup.count = parseInt(chip.dataset.count,10);
      render();
    });
  });
  document.getElementById("start-exam").addEventListener("click", ()=>{
    const pool = shuffle(QUESTIONS).slice(0, examSetup.count);
    startSession(pool, true);
  });
}

/* =========================================================
   出題画面（演習・模擬試験 共通）
========================================================= */
function renderQuiz(){
  const q = currentQuestion();
  const total = session.queue.length;
  const answered = session.answers[q.id];
  const pct = Math.round(((session.idx) / total) * 100);

  const choiceHtml = LETTERS.map(l=>{
    if(!(l in q.choices)) return "";
    let cls = "choice";
    if(session.revealed || (session.examMode && answered)){
      if(l === q.correct) cls += " correct";
      else if(l === answered) cls += " incorrect";
      else cls += " dim";
      cls += " disabled";
    } else if(answered === l){
      cls += " selected";
    }
    return `<div class="${cls}" data-letter="${l}">
      <span class="letter">${l}</span>
      <span>${esc(q.choices[l])}</span>
    </div>`;
  }).join("");

  let feedbackHtml = "";
  if(session.revealed){
    const isCorrect = answered === q.correct;
    feedbackHtml = `
      <div class="feedback ${isCorrect?"correct":"incorrect"}">
        <div class="fb-head">${isCorrect ? "◎ 正解" : "✕ 不正解　正解は " + q.correct.toUpperCase()}</div>
        <div class="fb-body">${q.explanation ? esc(q.explanation) : "（このカテゴリーの考え方を確認しておきましょう）"}</div>
      </div>`;
  }

  return `
    <div class="quiz-top">
      <span>${session.examMode ? "模擬試験" : "演習"} ・ ${session.idx+1} / ${total}</span>
      <span>${q.id}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="q-meta">${esc(q.category)} ／ ${esc(q.subcategory)}</div>
    <div class="q-text">${esc(q.question)}</div>

    <div id="choices">${choiceHtml}</div>
    ${feedbackHtml}

    <div class="nav-row">
      <button class="btn" id="prev-btn" ${session.idx===0?"disabled":""}>戻る</button>
      <button class="btn primary" id="next-btn" ${(!session.examMode && !session.revealed)?"disabled":""}>
        ${session.idx===total-1 ? "結果を見る" : "次の問題"}
      </button>
    </div>
  `;
}
function attachQuizEvents(){
  document.querySelectorAll("#choices .choice").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(el.classList.contains("disabled")) return;
      chooseAnswer(el.dataset.letter);
    });
  });
  document.getElementById("prev-btn").addEventListener("click", prevQuestion);
  document.getElementById("next-btn").addEventListener("click", ()=>{
    if(session.examMode && !session.answers[currentQuestion().id]){
      if(!confirm("未回答です。このまま次に進みますか？")) return;
    }
    nextQuestion();
  });
}

/* =========================================================
   結果画面
========================================================= */
function renderResult(){
  const total = session.queue.length;
  let correctCount = 0;
  session.queue.forEach(q=>{ if(session.answers[q.id]===q.correct) correctCount++; });
  const pct = Math.round((correctCount/total)*100);

  const reviewHtml = session.queue.map(q=>{
    const ans = session.answers[q.id];
    const ok = ans === q.correct;
    return `
      <div class="review-item">
        <div><span class="rtag ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</span><span class="q-meta" style="display:inline">${esc(q.subcategory)}</span></div>
        <div class="rq">${esc(q.question)}</div>
        <div style="font-family:var(--mono);font-size:12px;color:var(--sub);">
          あなたの回答：${ans ? ans.toUpperCase() : "（未回答）"} ／ 正解：${q.correct.toUpperCase()}
        </div>
      </div>
    `;
  }).join("");

  return `
    <h2 class="section-title">結果</h2>
    <div class="card">
      <div class="score-ring-wrap">
        <div>
          <div class="score-num" style="color:${pct>=80?"var(--green)":pct>=50?"var(--amber)":"var(--red)"}">${correctCount} / ${total}</div>
          <div class="score-label">正答率 ${pct}%</div>
        </div>
      </div>
      <div class="nav-row">
        <button class="btn" id="retry-btn">もう一度</button>
        <button class="btn primary" id="back-btn">設定に戻る</button>
      </div>
    </div>
    <h2 class="section-title">解答内容</h2>
    <div class="card">${reviewHtml}</div>
  `;
}
function attachResultEvents(){
  document.getElementById("retry-btn").addEventListener("click", ()=>{
    const list = session.queue;
    const examMode = session.examMode;
    startSession(list, examMode);
  });
  document.getElementById("back-btn").addEventListener("click", ()=>{
    session = null;
    render();
  });
}

/* =========================================================
   進捗タブ
========================================================= */
function renderProgressTab(){
  const p = loadProgress();
  const counts = {new:0, weak:0, learning:0, master:0};
  QUESTIONS.forEach(q=> counts[statusOf(q.id)]++ );

  const cats = categories();
  const catRows = cats.map(cat=>{
    const qs = QUESTIONS.filter(q=>q.category===cat);
    const masterCount = qs.filter(q=>statusOf(q.id)==="master").length;
    const attemptedCount = qs.filter(q=> (p[q.id]||{}).attempts > 0).length;
    const pct = Math.round((masterCount/qs.length)*100);
    return `
      <div class="stat-row">
        <div>
          <div class="stat-name">${esc(cat)}</div>
          <div class="stat-sub">${attemptedCount}/${qs.length} 問挑戦済み</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="stat-num">${masterCount}/${qs.length}</div>
        </div>
      </div>
    `;
  }).join("");

  // サブカテゴリー別（習得率の低い順に注意喚起）
  const allSubs = uniq(QUESTIONS.map(q=>q.subcategory));
  const subRows = allSubs.map(sub=>{
    const qs = QUESTIONS.filter(q=>q.subcategory===sub);
    const masterCount = qs.filter(q=>statusOf(q.id)==="master").length;
    const pct = Math.round((masterCount/qs.length)*100);
    return {sub, qs, masterCount, pct};
  }).sort((a,b)=>a.pct-b.pct).map(r=>`
      <div class="stat-row">
        <div>
          <div class="stat-name">${esc(r.sub)}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="bar-track"><div class="bar-fill" style="width:${r.pct}%"></div></div>
          <div class="stat-num">${r.masterCount}/${r.qs.length}</div>
        </div>
      </div>
  `).join("");

  return `
    <h2 class="section-title">習熟度サマリー</h2>
    <div class="master-badges">
      <div class="badge new"><div class="n">${counts.new}</div><div class="l">未挑戦</div></div>
      <div class="badge weak"><div class="n">${counts.weak}</div><div class="l">苦手</div></div>
      <div class="badge learning"><div class="n">${counts.learning}</div><div class="l">学習中</div></div>
      <div class="badge master"><div class="n">${counts.master}</div><div class="l">習得</div></div>
    </div>

    <h2 class="section-title" style="margin-top:22px;">カテゴリー別</h2>
    <div class="card">${catRows}</div>

    <h2 class="section-title" style="margin-top:22px;">サブカテゴリー別（習得率の低い順）</h2>
    <div class="card">${subRows}</div>

    <button class="reset-link" id="reset-progress">この端末の学習記録をすべてリセットする</button>
  `;
}
function attachProgressEvents(){
  document.getElementById("reset-progress").addEventListener("click", ()=>{
    if(confirm("学習記録をすべて削除します。よろしいですか？")){
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });
}

/* =========================================================
   ユーティリティ
========================================================= */
function esc(str){
  if(str===undefined || str===null) return "";
  return String(str)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

/* 初期描画 */
render();
</script>
