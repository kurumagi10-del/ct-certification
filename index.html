":"泌尿器","question":"区域性の腎梗塞を示唆する造影CT所見はどれか。","choices":{"a":"髄質側を底辺とする円形濃染を認める","b":"腎盂中心に広がる線状濃染を認める","c":"皮質側を底辺とする楔状欠損を認める","d":"腎全体に均一な脂肪置換を認める"},"answer":"c","explanation":"腎動脈の枝が閉塞して起こる腎梗塞では、血流が途絶えた領域が血管の走行を反映して「皮質側を底辺とし、腎門部（髄質側）を頂点とする楔状の造影欠損（染まらない領域）」として描出される。","tags":"腎梗塞;楔状欠損;皮質側"},{"id":"AM-36","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"尿路結石が疑われる患者で基本となるCT撮影法はどれか。","choices":{"a":"動脈相で尿路結石を最初に評価する","b":"腎実質相で尿路結石を最初に評価する","c":"排泄相だけで尿路結石を最初に評価する","d":"単純CTで尿路結石を最初に評価する"},"answer":"d","explanation":"尿路結石（特にシュウ酸カルシウムなどの含カルシウム結石）は単純CTで高吸収（白く）として明瞭に描出されるため、造影剤を使用しない単純CTが結石検出のゴールドスタンダードかつ基本撮影法となる。","tags":"尿路結石;単純CT;基本撮影法"},{"id":"AM-37","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"腎外腎盂を水腎症から鑑別する所見はどれか。","choices":{"a":"腎杯拡張を伴わない腎盂拡大を認める","b":"腎杯拡張を伴う尿管全長拡大を認める","c":"腎皮質菲薄化を伴う腎盂拡大を認める","d":"腎周囲浸潤を伴う尿管拡大を認める"},"answer":"a","explanation":"腎外腎盂は正常のバリエーションであり、腎盂が腎実質の外側に大きく飛び出している状態である。そのため、閉塞に起因する水腎症で見られるような「腎杯の拡張や腎実質の圧排・菲薄化」を伴わない点が鑑別点となる。","tags":"腎外腎盂;水腎症鑑別;腎杯拡張なし"},{"id":"AM-38","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"CT尿路造影におけるsplit bolus法を用いる主な利点はどれか。","choices":{"a":"造影剤を一度に注入し単純相を省略する","b":"造影剤を分割注入し撮影相数を減らす","c":"造影剤を動脈内投与し尿管を拡張する","d":"造影剤を経口投与し腎実質を濃染する"},"answer":"b","explanation":"split bolus（分割注射）法では、造影剤をタイミングをずらして2回（または複数回）に分けて投与し、排泄相と実質相などを1回のスキャン（または少ない撮影相数）に重ねて評価できるようにすることで、被ばく低減や撮影相数の削減を図ることができる。","tags":"CT尿路造影;split bolus法;撮影相数減少"},{"id":"AM-39","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"CTで骨折を直接示す所見はどれか。","choices":{"a":"骨頭内の均一な脂肪濃度を認める","b":"関節液の減少だけを認める","c":"骨皮質の連続性断裂を認める","d":"筋肉内の均一な造影効果を認める"},"answer":"c","explanation":"骨折の直接的な所見（確定所見）は、硬い骨の表面である骨皮質が断裂し、連続性が失われている「骨皮質の連続性断裂（骨折線）」が明示されることである。","tags":"骨折;骨皮質連続性断裂;直接所見"},{"id":"AM-40","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"舟状骨骨折をCTで詳細に評価するために適した画像再構成はどれか。","choices":{"a":"手関節全体を厚い横断像だけで評価する","b":"前腕長軸に直交する冠状断だけで評価する","c":"指節骨長軸に沿う矢状断だけで評価する","d":"舟状骨長軸に沿うMPRで評価する"},"answer":"d","explanation":"手根骨の一つである舟状骨は三次元的に特殊な方向を向いて曲がりくねって存在しているため、その微細な骨折線を詳細に評価するには、舟状骨自体の長軸および短軸に沿って再構成したMPR画像が最も適している。","tags":"舟状骨骨折;長軸MPR;詳細評価"},{"id":"AM-41","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"脊椎破裂骨折を示唆する重要なCT所見はどれか。","choices":{"a":"椎体後壁骨片の脊柱管内突出を認める","b":"椎体前縁だけの軽い楔状圧潰を認める","c":"椎間板内だけのガス貯留を認める","d":"棘突起先端だけの骨硬化を認める"},"answer":"a","explanation":"脊椎の破裂骨折（Bora Burst骨折など）では、高エネルギー外力により椎体が縦方向に圧潰し、特に「椎体後壁（後縁）の骨片が脊柱管の内部へ向かって飛び出す（突出する）」ことで神経障害を引き起こすのが特徴である。","tags":"脊椎破裂骨折;椎体後壁骨片;脊柱管内突出"},{"id":"AM-42","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"脆弱性骨折に分類される不全骨折の発生機序はどれか。","choices":{"a":"正常骨に反復する強い負荷で生じる","b":"脆弱骨に通常の生理的負荷で生じる","c":"正常骨に一回の直達外力で生じる","d":"脆弱骨に感染性骨破壊だけで生じる"},"answer":"b","explanation":"脆弱性骨折（骨粗鬆症などを基盤とする）は、骨の強度自体が低下している（脆弱骨）ため、日常生活における通常の生理的負荷（転倒などの強い外力によらない負荷）によって発生する不全骨折を指す。","tags":"脆弱性骨折;不全骨折;生理的負荷"},{"id":"AM-43","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"類骨骨腫の診断に薄いスライスのCTが有用な理由はどれか。","choices":{"a":"骨髄内の広い脂肪置換を確認する","b":"関節内の均一な液体貯留を確認する","c":"骨皮質内の小さなnidusを確認する","d":"骨端線内の均一な骨硬化を確認する"},"answer":"c","explanation":"類骨骨腫は周囲に強い骨硬化を伴う小さな腫瘍性病変であり、その本体である数ミリ程度の非常に小さな中心巣（nidus：ナイダス）を明瞭に描き出して診断を確定するためには、極薄スライスのCT画像が不可欠となる。","tags":"類骨骨腫;薄いスライス;nidus"},{"id":"AM-44","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"通常型骨肉腫を示唆する代表的なCT所見はどれか。","choices":{"a":"地図状骨透亮像と薄い硬化縁を認める","b":"輪状石灰化と分葉状辺縁を認める","c":"均一脂肪濃度と平滑な骨皮質を認める","d":"雲状骨形成と侵襲性骨膜反応を認める"},"answer":"d","explanation":"通常型骨肉腫は、腫瘍骨によるモヤモヤとした「雲状の骨形成（腫瘍骨）」や、骨膜が刺激されて起こる日光芒状などの「侵襲性（悪性）骨膜反応」が典型的なCT所見として認められる。","tags":"通常型骨肉腫;雲状骨形成;骨膜反応"},{"id":"AM-45","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"軟骨性骨腫瘍の基質を示唆する石灰化はどれか。","choices":{"a":"輪状や弧状の軟骨基質石灰化を認める","b":"雲状に広がる不整な類骨基質形成を認める","c":"腫瘤全体に均一な脂肪成分を認める","d":"病変内部に広い均一な液体成分を認める"},"answer":"a","explanation":"内軟骨腫や軟骨肉腫などの軟骨性骨腫瘍に特徴的な基質の石灰化・骨化様式として、リング状（輪状）や弧状（点状・点描状）を呈する軟骨基質由来の石灰化が挙げられる。","tags":"軟骨性骨腫瘍;輪状石灰化;軟骨基質"},{"id":"AM-46","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"骨端線閉鎖後の骨巨細胞腫に典型的な発生部位はどれか。","choices":{"a":"骨幹部中央の骨皮質内に好発する","b":"骨端部から関節面直下に好発する","c":"骨幹端の骨膜表面だけに好発する","d":"椎体後方の硬膜外腔だけに好発する"},"answer":"b","explanation":"骨端線（成長線）が閉鎖した成人の長管骨において、骨巨細胞腫は「骨端部（あるいは骨端・幹端部）から関節面直下」にかけて偏心性に膨隆するような形で好発するという特徴的な発生部位を持つ。","tags":"骨巨細胞腫;骨端部;関節面直下"},{"id":"AM-47","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"骨島に典型的で、骨形成性転移との鑑別に役立つCT所見はどれか。","choices":{"a":"境界不明瞭で急速な骨破壊を伴う","b":"骨膜反応と大きな軟部腫瘤を伴う","c":"刷毛状辺縁で骨破壊を伴わない","d":"広い移行帯と皮質断裂を伴う"},"answer":"c","explanation":"骨島（骨斑：良性の骨硬化斑）は、周囲の骨に向かってトゲ状・毛羽立ったような「刷毛状（ふでじょう）の辺縁」を示し、骨破壊や骨膜反応を全く伴わない点が、悪性の骨形成性転移との鑑別において極めて有用な所見となる。","tags":"骨島;骨形成性転移鑑別;刷毛状辺縁"},{"id":"AM-48","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"骨折に対する3D CT画像の適切な用途はどれか。","choices":{"a":"微細骨折線の有無を確定する目的に用いる","b":"関節軟骨損傷の程度を確定する目的に用いる","c":"骨腫瘍の組織型を確定する目的に用いる","d":"骨片の立体配置を把握する目的に用いる"},"answer":"d","explanation":"3D-CT（三次元画像）は、複雑な骨折における骨片のズレ（転位）や立体的な位置関係、関節面の崩れ具合を直感的に把握・評価する目的に最も適している（微細な骨折線の検出には元の薄切断層像が適する）。","tags":"3D CT;骨折;立体配置"},{"id":"AM-49","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"金属固定材料を含む部位で金属アーチファクト低減画像を使用する際の注意点はどれか。","choices":{"a":"低減画像と通常画像を併せて確認する","b":"低減画像だけで金属周囲を確定する","c":"通常画像を捨て低減画像だけを保存する","d":"金属を高濃度造影剤として評価する"},"answer":"a","explanation":"金属アーチファクト低減処理を施した画像は、アーチファクトが軽減される一方で、画像の見え方が変化したり偽像（アーチファクトの偽り）を生じたりすることがあるため、診断の際は必ず「通常画像と低減画像を併せて確認」する必要がある。","tags":"金属固定材料;アーチファクト低減;併せて確認"},{"id":"AM-50","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"整形外科領域骨・関節","question":"骨腫瘍のCTガイド下生検を計画する際に重要な事項はどれか。","choices":{"a":"腫瘍の組織型を穿刺前に確定する","b":"安全な穿刺経路と標的部位を設定する","c":"腫瘍を造影剤だけで完全に治療する","d":"神経血管束を穿刺経路内に配置する"},"answer":"b","explanation":"CTガイド下生検を安全かつ確実に行うためには、周囲の重要血管や神経を損傷しない「安全な穿刺経路（アプローチ）」と、的確に病変の組織を採取できる「標的部位」を計画段階で正確に設定することが極めて重要である。","tags":"骨腫瘍;CTガイド下生検;穿刺経路"},{"id":"EO-01","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"重症鈍的外傷患者で、CT室への移動前に血圧低下が進行した。CT装置が蘇生室から離れている場合の対応として最も適切なのはどれか。","choices":{"a":"蘇生を優先し、CT室への移動を見合わせる","b":"鎮静を優先し、頭部CTから撮影を開始する","c":"造影を優先し、動脈相から撮影を開始する","d":"固定を優先し、全身CTの撮影から開始する"},"answer":"a","explanation":"循環動態が不安定な患者では、気道確保、呼吸管理、止血、輸血などの蘇生処置を優先する。蘇生を継続できない環境への移動は、治療開始の遅延や状態悪化につながる。","tags":"重症外傷;血圧低下;蘇生"},{"id":"EO-02","category":"救急・その他領域CT","subcategory":"頭部CT","question":"急性頭部外傷で頭蓋内出血を迅速に検索するため、最初に選択するCT撮影はどれか。","choices":{"a":"頭部の遅延相CTを撮影する","b":"頭部の単純CTを撮影する","c":"頭部の造影CTを撮影する","d":"頭部のCT血管撮影を実施する"},"answer":"b","explanation":"急性期の血腫は単純CTで高吸収域として描出され、短時間で骨折や脳腫脹も評価できる。造影CTは血管損傷など特定の病態が疑われる場合に追加する。","tags":"頭部外傷;頭蓋内出血;単純CT"},{"id":"EO-03","category":"救急・その他領域CT","subcategory":"頭部CT","question":"急性硬膜外血腫に典型的な単純CT所見はどれか。","choices":{"a":"大脳半球の表面に沿って広がる三日月状の高吸収域","b":"脳溝と脳槽のくも膜下腔に広がる線状の高吸収域","c":"頭蓋骨内板に接して広がる両凸レンズ状の高吸収域","d":"大脳白質の深部に散在して広がる点状の高吸収域"},"answer":"c","explanation":"硬膜外血腫は硬膜と頭蓋骨の間に形成され、頭蓋縫合を越えにくいため両凸レンズ状となる。三日月状の血腫は硬膜下血腫に典型的である。","tags":"頭部外傷;急性硬膜外血腫;高吸収域"},{"id":"EO-04","category":"救急・その他領域CT","subcategory":"頭部CT","question":"外傷性くも膜下出血に典型的な単純CT所見はどれか。","choices":{"a":"脳室周囲白質に左右対称に広がる帯状の低吸収域","b":"頭蓋骨内板に接して限局するレンズ状の高吸収域","c":"基底核から内包に左右対称に広がる斑状の高吸収域","d":"脳溝や脳槽に沿って広がる線状の高吸収域"},"answer":"d","explanation":"くも膜下腔に流入した急性期の血液は、脳溝や脳槽内の高吸収域として描出される。レンズ状の高吸収域は硬膜外血腫を示唆する。","tags":"頭部外傷;外傷性くも膜下出血;脳溝"},{"id":"EO-05","category":"救急・その他領域CT","subcategory":"頭部CT","question":"高エネルギー外傷後に意識障害が持続しているが、初回頭部CTで明らかな異常を認めない。この状況の解釈として適切なのはどれか。","choices":{"a":"CTが正常でも、びまん性軸索損傷を否定できない","b":"CTが正常なら、びまん性軸索損傷を完全に否定できる","c":"CTが正常でも、急性硬膜外血腫だけを強く疑う","d":"CTが正常なら、脳幹損傷の有無まで確定できる"},"answer":"a","explanation":"びまん性軸索損傷では微小出血や非出血性病変が主体となり、CTで異常を捉えにくいことがある。臨床所見との乖離がある場合はMRIによる追加評価が有用である。","tags":"意識障害;びまん性軸索損傷;MRI"},{"id":"EO-06","category":"救急・その他領域CT","subcategory":"胸部CT","question":"仰臥位で撮影した外傷CTにおいて、少量の気胸が分布しやすい部位はどれか。","choices":{"a":"胸腔の背側や下側に少量のガスがたまる","b":"胸腔の前方や内側に少量のガスがたまる","c":"胸腔の中央や肺門に少量のガスがたまる","d":"胸腔の外側や横隔膜内に少量のガスがたまる"},"answer":"b","explanation":"仰臥位では胸腔内ガスが非依存部である前方や内側に移動する。肺尖部だけを確認すると少量気胸を見落とす可能性がある。","tags":"外傷CT;気胸;仰臥位"},{"id":"EO-07","category":"救急・その他領域CT","subcategory":"胸部CT","question":"急性外傷性血胸を示唆する単純CT所見はどれか。","choices":{"a":"胸腔内に空気濃度の液体貯留がみられる","b":"胸腔内に脂肪濃度の液体貯留がみられる","c":"胸腔内に血液濃度の液体貯留がみられる","d":"胸腔内に骨濃度の液体貯留がみられる"},"answer":"c","explanation":"急性血液は一般的な胸水より高い吸収値を示し、凝血塊による不均一な高吸収域を伴うことがある。患者の貧血や血液希釈によって吸収値が低くなる場合にも注意する。","tags":"外傷;血胸;高吸収域"},{"id":"EO-08","category":"救急・その他領域CT","subcategory":"胸部CT","question":"鈍的胸部外傷による肺挫傷に典型的なCT所見はどれか。","choices":{"a":"肺葉の容積減少を伴う均一な無気肺像がみられる","b":"肺門に連続する円形の空洞影がみられる","c":"胸膜に限局する石灰化した結節影がみられる","d":"肺区域を越えるすりガラス影や浸潤影がみられる"},"answer":"d","explanation":"肺挫傷は肺胞出血と浮腫を反映し、解剖学的な肺区域に一致しない陰影を形成する。受傷後数時間で陰影が目立つこともある。","tags":"鈍的胸部外傷;肺挫傷;すりガラス影"},{"id":"EO-09","category":"救急・その他領域CT","subcategory":"腹部CT","question":"造影CTで活動性出血を示す造影剤漏出の時間的変化はどれか。","choices":{"a":"後期相で造影剤漏出が拡大または濃染する","b":"後期相で造影剤漏出が縮小または消失する","c":"単純相で造影剤漏出が脂肪濃度を示す","d":"単純相で造影剤漏出が石灰化濃度を示す"},"answer":"a","explanation":"血管外に漏れた造影剤は時間とともに拡散するため、形状の拡大や濃度変化を示す。単純相との比較は石灰化や既存の高吸収物との鑑別に役立つ。","tags":"造影CT;活動性出血;造影剤漏出"},{"id":"EO-10","category":"救急・その他領域CT","subcategory":"腹部CT","question":"脾損傷に伴う仮性動脈瘤を示唆する造影CT所見はどれか。","choices":{"a":"門脈相で脾被膜下全体にびまん性低吸収を示す","b":"動脈相で脾動脈と同程度の限局性濃染を示す","c":"単純相で脾門部に線状の脂肪濃度を示す","d":"後期相で脾実質全体に均一な高吸収を示す"},"answer":"b","explanation":"仮性動脈瘤は動脈相で血管と同程度に濃染する限局性病変として描出される。活動性漏出と異なり、後の相でも比較的限局した形状を保つことが多い。","tags":"脾損傷;仮性動脈瘤;動脈相"},{"id":"EO-11","category":"救急・その他領域CT","subcategory":"腹部CT","question":"鈍的腹部外傷において、治療を要する腸管・腸間膜損傷を強く疑う所見の組合せはどれか。","choices":{"a":"腸管壁の均一な菲薄化と腸間膜脂肪減少を認める","b":"腸管腔の均一な拡張と腸間膜血管減少を認める","c":"腸管壁の造影低下と腸間膜血腫を認める","d":"腸管壁の石灰化と腸間膜リンパ節腫大を認める"},"answer":"c","explanation":"腸管壁の造影低下は虚血を、腸間膜血腫は血管損傷を示唆する。腹腔内遊離ガス、腸管壁の不連続、造影剤漏出なども併せて評価する。","tags":"鈍的腹部外傷;腸管損傷;虚血"},{"id":"EO-12","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"外傷性腎損傷で腎盂・尿管損傷の合併が疑われる場合に適切な撮影法はどれか。","choices":{"a":"動脈相を追加して腎盂内の単純液体貯留量を調べる","b":"門脈相を追加して尿管壁の石灰化を調べる","c":"単純相を追加して膀胱内の造影剤排泄量を調べる","d":"排泄相を追加して尿路外への造影剤漏出を調べる"},"answer":"d","explanation":"排泄相では腎盂や尿管に造影剤が排泄され、尿路外漏出や尿路の断裂を評価できる。早期相だけでは尿漏を描出できないことがある。","tags":"腎損傷;尿路損傷;排泄相"},{"id":"EO-13","category":"救急・その他領域CT","subcategory":"腹部CT","question":"骨盤骨折患者の造影CTで認めた造影剤漏出について、適切な解釈はどれか。","choices":{"a":"動脈相の造影剤漏出は活動性動脈出血を示唆する","b":"動脈相の造影剤漏出は慢性静脈閉塞を示唆する","c":"単純相の骨片転位だけで活動性動脈出血を確定する","d":"単純相の血腫拡大は慢性静脈閉塞を確定する"},"answer":"a","explanation":"骨盤内動脈からの出血は動脈相で限局性の高吸収域として現れ、後期相で拡大することがある。血管内治療や外科的止血の必要性を判断する重要所見となる。","tags":"骨盤骨折;活動性出血;血管内治療"},{"id":"EO-14","category":"救急・その他領域CT","subcategory":"整形外科CT","question":"外傷CTにおける頸椎損傷の評価方法として適切なのはどれか。","choices":{"a":"横断像だけを用いて椎間板損傷の有無を確定する","b":"矢状断と冠状断を併用して椎体配列を評価する","c":"冠状断だけを用いて脊髄信号を評価する","d":"矢状断だけを用いて微細な靱帯断裂まで確定する"},"answer":"b","explanation":"多断面再構成像は椎体配列、椎間腔、関節面、骨片の転位を立体的に評価するうえで有用である。靱帯や脊髄の損傷が疑われる場合はMRIを検討する。","tags":"頸椎損傷;多断面再構成像;矢状断"},{"id":"EO-15","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"重症外傷で行うtrauma pan-scanの基本的な考え方はどれか。","choices":{"a":"頭部だけを短時間で反復して評価する","b":"胸部だけを高分解能条件で詳細に評価する","c":"頭部から骨盤までを短時間で系統的に評価する","d":"胸部から両下肢までを長時間で連続的に評価する"},"answer":"c","explanation":"trauma pan-scanは多発損傷を早期に検出する目的で、頭部、頸部、胸部、腹部、骨盤を包括的に評価する。撮影範囲や造影法は患者の状態と受傷機転に応じて最適化する。","tags":"trauma pan-scan;多発損傷;全身CT"},{"id":"EO-16","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"trauma pan-scanの適応を決定する考え方として適切なのはどれか。","choices":{"a":"年齢、性別、来院時刻だけを基に一律に適応を決める","b":"身長、体重、検査歴を基に一律に適応を決める","c":"主訴、診療科、搬送距離を基に一律に適応を決める","d":"受傷機転、バイタル所見、身体所見を基に適応を決める"},"answer":"d","explanation":"全身CTには多発損傷の早期発見という利点がある一方、被ばくや造影剤投与を伴う。軽微な外傷を含む全例に一律で実施するのではなく、臨床的な損傷リスクを基に判断する。","tags":"適応;被ばく;損傷リスク"},{"id":"EO-17","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"外傷全身CTで上肢による体幹部アーチファクトを減らす体位として適切なのはどれか。","choices":{"a":"安全に可能なら上肢を挙上して体幹部を撮影する","b":"常に両上肢を体幹脇に置いて体幹部を撮影する","c":"骨折が疑われても両上肢を挙上して撮影を続ける","d":"呼吸が不安定でも両上肢を挙上して撮影を続ける"},"answer":"a","explanation":"上肢を撮影範囲から外すと、肩や上腕骨によるビームハードニングを減らし、画質と線量効率を改善できる。上肢損傷や循環動態の悪化がある場合は、体位変換による危険を避ける。","tags":"アーチファクト;挙上;画質"},{"id":"EO-18","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"重症患者をCT室へ移動して撮影する際の安全管理として適切なのはどれか。","choices":{"a":"CT室では監視を中断して画像確認を優先する","b":"CT室でも監視と蘇生を切れ目なく継続する","c":"CT室では酸素投与を中止して息止めを優先する","d":"CT室では静脈路を抜去して体位変換を優先する"},"answer":"b","explanation":"CT室でも心電図、血圧、酸素飽和度などを監視し、気道管理や輸液を継続できる体制が必要である。患者の急変時には撮影を中断して蘇生処置を優先する。","tags":"安全管理;監視;急変"},{"id":"EO-19","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"外傷全身CTにおける被ばく最適化として適切なのはどれか。","choices":{"a":"撮影相をできるだけ増やし、同じ範囲の反復撮影を行う","b":"管電流を固定し、体格による画質差を許容する","c":"必要な相に限定し、重複範囲と反復撮影を減らす","d":"撮影範囲を広げ、体外領域まで余分に含める"},"answer":"c","explanation":"診断目的に必要な撮影相と範囲を事前に定めることで、不必要な放射線被ばくを抑えられる。自動露出制御や逐次近似再構成なども画質を保ちながら線量を低減する手段となる。","tags":"被ばく最適化;線量;画質"},{"id":"EO-20","category":"救急・その他領域CT","subcategory":"救急・外傷","question":"外傷全身CTの時間を意識した初期読影で、最初に行うべき評価はどれか。","choices":{"a":"骨折の細分類を先に行って詳細な画像報告書を完成させる","b":"偶発性結節を先に検索して経過観察を決める","c":"慢性変化を先に検索して既往歴と照合する","d":"生命を脅かす所見を先に検索して治療判断につなげる"},"answer":"d","explanation":"頭蓋内大量血腫、緊張性気胸、大動脈損傷、活動性出血などを優先的に検索する。詳細な骨折分類や偶発所見は、その後の段階で系統的に評価する。","tags":"読影;緊急性;治療判断"},{"id":"EO-21","category":"救急・その他領域CT","subcategory":"循環器CT","question":"急性大動脈症候群が疑われる患者の包括的CTプロトコールとして適切なのはどれか。","choices":{"a":"単純相、造影早期相、造影後期相を基本とする","b":"単純相、吸気相、呼気相だけを基本とする","c":"動脈相、排泄相、骨条件相だけを基本とする","d":"平衡相、脂肪抑制相、拡散相を基本とする"},"answer":"a","explanation":"単純相は壁内血腫や石灰化、早期相は解離腔や分枝血流、後期相は偽腔の遅延濃染や臓器灌流の評価に役立つ。患者の緊急度や装置性能に応じて撮影相を最適化する。","tags":"急性大動脈症候群;造影CT;プロトコール"},{"id":"EO-22","category":"救急・その他領域CT","subcategory":"循環器CT","question":"急性大動脈壁内血腫に典型的なCT所見はどれか。","choices":{"a":"造影CTで大動脈腔内全体に円形の石灰化を認める","b":"単純CTで大動脈壁に三日月状の高吸収域を認める","c":"単純CTで大動脈壁にびまん性の脂肪濃度を認める","d":"造影CTで大動脈周囲に均一な空気濃度を認める"},"answer":"b","explanation":"壁内血腫は明瞭な内膜フラップや偽腔内血流を伴わず、大動脈壁内の高吸収域として描出される。造影CTだけでは壁内血腫が不明瞭となることがある。","tags":"壁内血腫;単純CT;高吸収域"},{"id":"EO-23","category":"救急・その他領域CT","subcategory":"循環器CT","question":"大動脈解離のStanford分類におけるA型の定義はどれか。","choices":{"a":"下行大動脈だけに解離があればStanford A型とする","b":"腹部大動脈だけに解離があればStanford A型とする","c":"上行大動脈に解離が及べばStanford A型とする","d":"腸骨動脈だけに解離があればStanford A型とする"},"answer":"c","explanation":"Stanford分類は解離の入口ではなく、上行大動脈への進展の有無で分類する。A型は心タンポナーデや冠動脈灌流障害などの重篤な合併症を来しやすい。","tags":"大動脈解離;Stanford分類;上行大動脈"},{"id":"EO-24","category":"救急・その他領域CT","subcategory":"循環器CT","question":"大動脈解離のStanford分類におけるB型の定義はどれか。","choices":{"a":"解離の入口が下行大動脈にあればStanford B型とする","b":"偽腔の全体が血栓化していればStanford B型とする","c":"腹部分枝に解離が及べばStanford B型とする","d":"上行大動脈に解離が及ばないものをStanford B型とする"},"answer":"d","explanation":"B型は上行大動脈を含まず、一般に左鎖骨下動脈分岐部より末梢側を中心とする。偽腔の血栓化や腹部分枝への進展だけでは分類できない。","tags":"大動脈解離;Stanford分類;B型"},{"id":"EO-25","category":"救急・その他領域CT","subcategory":"循環器CT","question":"大動脈解離の偽腔を示唆するcobweb signの説明はどれか。","choices":{"a":"偽腔内に線状の低吸収構造がみられる所見","b":"真腔内に円形の石灰化構造がみられる所見","c":"大動脈壁外に気泡状の低吸収域がみられる所見","d":"大動脈周囲に輪状の脂肪濃度がみられる所見"},"answer":"a","explanation":"cobweb signは解離によって残存した中膜線維を反映し、偽腔内の細い線状構造として描出される。真腔と偽腔を識別する手掛かりの一つである。","tags":"大動脈解離;cobweb sign;偽腔"},{"id":"EO-26","category":"救急・その他領域CT","subcategory":"循環器CT","question":"急性大動脈症候群のCTで心電図同期撮影を用いる主な目的はどれか。","choices":{"a":"下行大動脈の壁在石灰化による線状アーチファクトを増やす","b":"大動脈基部や上行大動脈の拍動アーチファクトを減らす","c":"腹部大動脈の腸管ガスによる線状アーチファクトを増やす","d":"腸骨動脈の骨盤骨による線状アーチファクトを減らす"},"answer":"b","explanation":"上行大動脈は心拍動の影響を受けやすく、偽の内膜フラップが生じることがある。心電図同期は真の解離と拍動アーチファクトの鑑別に有用である。","tags":"心電図同期;拍動アーチファクト;上行大動脈"},{"id":"EO-27","category":"救急・その他領域CT","subcategory":"循環器CT","question":"大動脈解離の造影CTにおける撮影範囲として適切なのはどれか。","choices":{"a":"胸部大動脈と冠動脈だけを含めて入口部を評価する","b":"腹部大動脈と腎動脈だけを含めて破裂部を評価する","c":"全大動脈と主要分枝を含めて進展範囲を評価する","d":"腸骨動脈だけを含めて偽腔内血栓量を評価する"},"answer":"c","explanation":"解離は胸部から腹部、腸骨動脈まで広範囲に進展する可能性がある。頸部分枝、腹腔動脈、上腸間膜動脈、腎動脈などの灌流障害も評価する。","tags":"大動脈解離;進展範囲;造影CT"},{"id":"EO-28","category":"救急・その他領域CT","subcategory":"腹部CT","question":"腹部大動脈瘤破裂を強く示唆する単純CT所見はどれか。","choices":{"a":"大動脈内腔から腸骨動脈まで続く脂肪濃度域","b":"大動脈壁内から主要分枝まで続く空気濃度域","c":"大動脈弁周囲から心筋内まで続く均一な石灰化","d":"大動脈周囲や後腹膜に広がる高吸収血腫"},"answer":"d","explanation":"急性出血は大動脈瘤周囲から後腹膜に広がる高吸収域として描出される。造影剤漏出、瘤壁の不連続、draped aorta signなども破裂を示唆する。","tags":"腹部大動脈瘤;破裂;高吸収血腫"},{"id":"EO-29","category":"救急・その他領域CT","subcategory":"腹部CT","question":"急性腸間膜虚血で重篤な腸管虚血を強く疑う造影CT所見はどれか。","choices":{"a":"造影CTで腸管壁の造影が低下または消失する","b":"造影CTで腸管壁の石灰化が均一に増加する","c":"単純CTで腸管内容の脂肪濃度が均一に増加する","d":"単純CTで腸管内ガスが完全に消失する"},"answer":"a","explanation":"腸管壁の造影低下は血流障害を反映し重篤な虚血を示唆する。ただし造影低下のみで壊死とは断定できず、腸管壁内ガス、門脈・腸間膜静脈内ガス、壁の菲薄化、穿孔などを併せて総合的に評価する。","tags":"腸間膜虚血;虚血;造影低下"},{"id":"EO-30","category":"救急・その他領域CT","subcategory":"腹部CT","question":"急性虫垂炎に典型的なCT所見はどれか。","choices":{"a":"盲端の管状構造の縮小と周囲脂肪織濃度低下","b":"盲端の管状構造の腫大と周囲脂肪織濃度上昇","c":"連続する結腸壁の菲薄化と周囲脂肪織濃度低下","d":"連続する小腸壁の石灰化と周囲脂肪織濃度上昇"},"answer":"b","explanation":"炎症を起こした虫垂は腫大し、壁肥厚や造影増強、周囲脂肪織の濃度上昇を伴う。糞石、周囲膿瘍、壁の造影欠損は診断や重症度評価の参考となる。","tags":"虫垂炎;腫大;脂肪織濃度"},{"id":"EO-31","category":"救急・その他領域CT","subcategory":"腹部CT","question":"急性結腸憩室炎に典型的なCT所見はどれか。","choices":{"a":"胆石を伴う胆嚢壁肥厚と周囲脂肪織濃度上昇","b":"糞石を伴う虫垂壁肥厚と周囲脂肪織濃度上昇","c":"憩室を伴う結腸壁肥厚と周囲脂肪織濃度上昇","d":"結石を伴う尿管壁肥厚と周囲脂肪織濃度上昇"},"answer":"c","explanation":"炎症を起こした憩室を中心に結腸壁肥厚と周囲脂肪織の濃度上昇が生じる。膿瘍、消化管外ガス、瘻孔などの有無は合併症の評価に重要である。","tags":"結腸憩室炎;結腸壁肥厚;脂肪織濃度"},{"id":"EO-32","category":"救急・その他領域CT","subcategory":"腹部CT","question":"閉鎖係蹄型腸閉塞を示唆するCT所見はどれか。","choices":{"a":"離れた一つの閉塞点と直線状に虚脱した小腸","b":"離れた一つの閉塞点と円形状に拡張した胃","c":"離れた三つの閉塞点と直線状に虚脱した結腸","d":"近接する二つの閉塞点とC字状の拡張腸管"},"answer":"d","explanation":"閉鎖係蹄では同一腸管の二点が閉塞し、その間の腸管がC字状またはU字状に拡張する。腸間膜血管の集束や渦巻き状変化、腸管壁の造影低下は絞扼を示唆する。","tags":"腸閉塞;閉鎖係蹄;C字状"},{"id":"EO-33","category":"救急・その他領域CT","subcategory":"腹部CT","question":"消化管穿孔を直接示唆するCT所見はどれか。","choices":{"a":"腹腔内や後腹膜に生じた消化管外ガス","b":"胆嚢内や胆管内に限局した生理的な胆汁","c":"膀胱内や尿管内に限局した生理的な尿","d":"血管内や心腔内に限局した造影後の血液"},"answer":"a","explanation":"消化管外ガスは穿孔部位に近接して分布することがあり、壁の不連続や局所的な液体貯留も手掛かりとなる。直前の手術や処置によるガスとの鑑別が必要である。","tags":"消化管穿孔;ガス;腹腔内"},{"id":"EO-34","category":"救急・その他領域CT","subcategory":"腹部CT","question":"発症から十分な時間が経過した急性膵炎で、造影CTを行う主な目的はどれか。","choices":{"a":"単純CTの脂肪濃度から膵線維化の程度を評価する","b":"造影不良域の分布から膵壊死の有無を評価する","c":"排泄相の造影剤から膵管閉塞の長さを評価する","d":"骨条件の石灰化から膵浮腫の範囲を評価する"},"answer":"b","explanation":"壊死した膵実質は造影効果が低下または消失し、造影CTは壊死範囲や周囲合併症の評価に役立つ。発症早期には壊死範囲が明瞭でないことがある。","tags":"急性膵炎;造影CT;膵壊死"},{"id":"EO-35","category":"救急・その他領域CT","subcategory":"腹部CT","question":"活動性消化管出血を検索するCT撮影法として適切なのはどれか。","choices":{"a":"単純相だけで腸管内容の高吸収域を活動性出血と判定する","b":"造影相だけで腸管内容の石灰化を出血と判定する","c":"単純相と造影相を比較して造影剤漏出を確認する","d":"排泄相と骨条件を比較して造影剤排泄を確認する"},"answer":"c","explanation":"単純相は血液、薬剤、残留物などの既存高吸収域を識別するために有用である。動脈相や門脈相で新たに出現して形状が変化する高吸収域は活動性出血を示唆する。","tags":"消化管出血;活動性出血;単純相"},{"id":"EO-36","category":"救急・その他領域CT","subcategory":"胸部CT","question":"胸部CTで偶然に未評価の乳房腫瘤を認めた場合の対応として適切なのはどれか。","choices":{"a":"造影が弱ければ良性として追加検査を行わない","b":"石灰化がなければ良性として追加検査を行わない","c":"境界が明瞭なら良性として追加検査を行わない","d":"専用の乳房画像検査による追加評価を勧める"},"answer":"d","explanation":"通常の胸部CTだけでは乳房病変の良悪性を確定できない。マンモグラフィ、乳房超音波、乳房MRIなどを臨床状況に応じて追加する。","tags":"乳房腫瘤;追加検査;画像診断"},{"id":"EO-37","category":"救急・その他領域CT","subcategory":"腹部CT","question":"腸閉塞患者のCTで絞扼性変化を疑う場合、重視すべき所見はどれか。","choices":{"a":"腸管壁の造影低下と腸間膜浮腫を重視する","b":"腸管壁の均一な菲薄化と腸間膜脂肪減少を重視する","c":"腸管内の便量増加と腸間膜リンパ節減少を重視する","d":"腸管壁の石灰化と腸間膜血管短縮を重視する"},"answer":"a","explanation":"絞扼によって静脈還流障害や動脈血流低下が生じると、腸間膜浮腫、腹水、腸管壁の造影低下が現れる。壊死に進行する可能性があるため、迅速な治療判断が必要となる。","tags":"腸閉塞;絞扼性;血流障害"},{"id":"EO-38","category":"救急・その他領域CT","subcategory":"婦人科CT","question":"妊娠可能年齢の女性が下腹部痛を訴え、異所性妊娠が疑われる場合の初期診断法はどれか。","choices":{"a":"胸部単純CTと血中CEAを中心に診断する","b":"経膣超音波と血中hCGを中心に診断する","c":"腹部単純CTと血中AFPを中心に診断する","d":"骨盤造影CTと血中PSAを中心に診断する"},"answer":"b","explanation":"異所性妊娠の初期評価では妊娠反応を確認し、経膣超音波で子宮内妊娠の有無や付属器病変を調べる。CTは放射線被ばくを伴うため、通常の第一選択ではない。","tags":"異所性妊娠;経膣超音波;hCG"},{"id":"EO-39","category":"救急・その他領域CT","subcategory":"婦人科CT","question":"卵巣茎捻転で認められることが多いCT所見はどれか。","choices":{"a":"縮小した卵巣と中心部に集まる大卵胞を認める","b":"石灰化した卵巣と均一に並ぶ血管影を認める","c":"腫大した卵巣と末梢に並ぶ小卵胞を認める","d":"萎縮した卵巣と内部に広がる脂肪域を認める"},"answer":"c","explanation":"静脈やリンパ流の障害による卵巣浮腫のため、卵巣腫大と末梢偏在する小卵胞がみられる。捻転した血管茎、子宮偏位、造影低下なども診断の手掛かりとなる。","tags":"卵巣茎捻転;卵巣浮腫;小卵胞"},{"id":"EO-40","category":"救急・その他領域CT","subcategory":"婦人科CT","question":"婦人科悪性腫瘍における胸腹骨盤CTの主な役割はどれか。","choices":{"a":"子宮内膜の層構造から腫瘍の組織型を推定する","b":"卵巣腫瘤の血流から茎捻転の有無を確定する","c":"骨盤内浸潤だけをMRIより詳細に評価する","d":"リンパ節転移や遠隔転移の広がりを評価する"},"answer":"d","explanation":"CTは胸部から骨盤まで広範囲を撮影でき、リンパ節、肺、肝臓、腹膜などへの進展評価に適する。骨盤内の詳細な局所進展にはMRIが有用な場合が多い。","tags":"婦人科悪性腫瘍;遠隔転移;リンパ節転移"},{"id":"EO-41","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"妊娠していない成人の尿管結石が疑われる場合、標準的なCT撮影法はどれか。","choices":{"a":"低線量の単純CTを第一選択として用いる","b":"高線量の造影CTを第一選択として用いる","c":"排泄相だけの造影CTを第一選択として用いる","d":"動脈相だけの造影CTを第一選択として用いる"},"answer":"a","explanation":"単純CTは多くの尿路結石を高吸収域として描出し、閉塞部位や水腎症も評価できる。体格や診断目的に応じて低線量プロトコールを使用する。","tags":"尿管結石;単純CT;低線量"},{"id":"EO-42","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"急性腎盂腎炎の造影CTで認められる典型的な腎実質所見はどれか。","choices":{"a":"腎実質に円形で均一な脂肪濃度域を認める","b":"腎実質に放射状または楔状の造影不均一を認める","c":"腎実質に左右対称でびまん性に広がる石灰化を認める","d":"腎実質に空気濃度だけの均一な領域を認める"},"answer":"b","explanation":"炎症、浮腫、尿細管内停滞によってstriated nephrogramや境界不明瞭な楔状低吸収域が生じる。CTは重症例や治療反応不良例で膿瘍などの合併症を評価する際に有用である。","tags":"腎盂腎炎;造影不均一;腎実質"},{"id":"EO-43","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"急性腎梗塞を示唆する造影CT所見はどれか。","choices":{"a":"腎実質に円形の均一な強い造影効果を認める","b":"腎実質にびまん性の均一な脂肪濃度を認める","c":"腎実質に境界明瞭な楔状の造影欠損を認める","d":"腎実質に左右対称の均一な石灰化を認める"},"answer":"c","explanation":"腎動脈分枝の灌流域に一致した楔状欠損は腎梗塞に典型的である。時間が経過すると、皮質辺縁が遅れて造影されるcortical rim signを認めることがある。","tags":"腎梗塞;楔状造影欠損;腎実質"},{"id":"EO-44","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"外傷性膀胱破裂を評価するCT cystographyの手技として適切なのはどれか。","choices":{"a":"経静脈性に高濃度造影剤を投与して膀胱を十分に拡張する","b":"経口的に希釈造影剤を投与して膀胱を十分に拡張する","c":"尿道内に空気を注入して膀胱を軽く満たす","d":"逆行性に希釈造影剤を注入して膀胱を十分に拡張する"},"answer":"d","explanation":"膀胱内に適切な圧をかけて充満させることで、小さな破裂部からの造影剤漏出を検出できる。経静脈投与後の排泄による受動的な膀胱充満だけでは損傷を見逃すことがある。","tags":"膀胱破裂;CT cystography;造影剤"},{"id":"EO-45","category":"救急・その他領域CT","subcategory":"泌尿器CT","question":"腎外傷で上部尿路からの尿漏を評価する方法はどれか。","choices":{"a":"排泄相で腎盂や尿管外への造影剤漏出を確認する","b":"動脈相で腎盂や尿管内の空気濃度を確認する","c":"単純相で腎盂や尿管内の造影剤排泄遅延を確認する","d":"門脈相で腎盂や尿管壁の脂肪濃度を確認する"},"answer":"a","explanation":"排泄された造影剤が腎盂や尿管の外側に認められれば、尿路損傷による尿漏を示す。腎機能低下や循環不全では排泄が遅れるため、撮影時刻の追加調整が必要となることがある。","tags":"腎外傷;尿漏;排泄相"},{"id":"EO-46","category":"救急・その他領域CT","subcategory":"胸部CT","question":"乳癌患者に対する胸腹部造影CTの主な役割はどれか。","choices":{"a":"検診での微小乳癌の検出に胸腹部CTを用いる","b":"胸壁進展や遠隔転移の評価に造影CTを用いる","c":"微細石灰化の良悪性鑑別に造影CTを用いる","d":"腫瘤の組織型を確定する目的で造影CTを用いる"},"answer":"b","explanation":"造影CTは胸壁や周囲臓器への進展、リンパ節、肺、肝臓などへの転移評価に用いられる。微細石灰化の評価にはマンモグラフィ、組織型の確定には病理検査が必要である。","tags":"乳癌;造影CT;遠隔転移"},{"id":"EO-47","category":"救急・その他領域CT","subcategory":"腹部CT","question":"食道穿孔が疑われる患者のCTで重視する所見はどれか。","choices":{"a":"食道内の空気だけから粘膜炎の重症度を評価する","b":"食道壁の石灰化だけから腫瘍の組織型と深達度を評価する","c":"食道周囲のガスや液体貯留と壁欠損を評価する","d":"食道内の液体だけから狭窄の良悪性を評価する"},"answer":"c","explanation":"縦隔気腫、食道周囲液体貯留、食道壁の不連続は穿孔を示唆する。状況に応じて水溶性経口造影剤を用いると、食道外漏出を直接確認できる。","tags":"食道穿孔;縦隔気腫;液体貯留"},{"id":"EO-48","category":"救急・その他領域CT","subcategory":"腹部CT","question":"食道癌の病期診断における造影CTの主な役割はどれか。","choices":{"a":"粘膜表面の色調と微細血管構造を評価する","b":"壁内の詳細な層構造と微小な粘膜病変の広がりを評価する","c":"生検標本の細胞異型と分化度を評価する","d":"周囲臓器浸潤、リンパ節転移、遠隔転移を評価する"},"answer":"d","explanation":"造影CTは気管、大動脈などへの浸潤やリンパ節、肺、肝臓への転移を広範囲に評価できる。粘膜病変や壁深達度の詳細評価には内視鏡や超音波内視鏡が用いられる。","tags":"食道癌;病期診断;造影CT"},{"id":"EO-49","category":"救急・その他領域CT","subcategory":"IVR-CT","question":"IVR-CT装置の基本的な特徴はどれか。","choices":{"a":"血管造影とCTを同じ治療環境で組み合わせる","b":"超音波とMRIを同じ診断環境で組み合わせる","c":"内視鏡とPETを同じ治療環境で組み合わせる","d":"透視撮影と骨密度測定を同じ診断環境で組み合わせる"},"answer":"a","explanation":"IVR-CTでは血管造影によるリアルタイムの血管評価と、CTによる断層画像評価を患者移動を抑えて行える。塞栓範囲、病変への薬剤分布、合併症などの確認に有用である。","tags":"IVR-CT;血管造影;治療環境"},{"id":"EO-50","category":"救急・その他領域CT","subcategory":"IVR-CT","question":"CT透視を用いるIVRで、患者と術者の放射線被ばくを低減する方法はどれか。","choices":{"a":"連続照射を用い、手指を走査面内に置いて操作する","b":"間欠照射を用い、手指を走査面から離して操作する","c":"高管電流を用い、防護具を外して穿刺操作を行う","d":"広い走査範囲を用い、同一断面を反復して確認する"},"answer":"b","explanation":"必要時だけ照射し、低管電流や狭い走査範囲を使用することで患者線量と散乱線を低減できる。術者は防護具を使用し、手指を直接線や走査面に入れないことが重要である。","tags":"CT透視;IVR;放射線防護"}]</script>

    '<path d="M4 12c2-6 6-9 8-9s6 3 8 9c-2 6-6 9-8 9s-6-3-8-9z" fill="none"/><circle cx="12" cy="12" r="2.4"/>',
    '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    '<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="5"/>'
  ];
  CATEGORY_ORDER.forEach(function(cat,i){ CATEGORY_ICON[cat] = icons[i % icons.length]; });
})();

var LS_KEY = 'ctquiz_progress_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {missed:{}, attempts:{}, correct:{}}; }
  catch(e){ return {missed:{}, attempts:{}, correct:{}}; }
}
function saveStore(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
var store = loadStore();
if(!store.correct) store.correct = {};

var state = {
  screen: 'home',
  homeTab: 'setup',
  selectedCats: CATEGORY_ORDER.slice(),
  count: 20,
  shuffle: true,
  weakOnly: false,
  queue: [],
  idx: 0,
  answered: null,
  score: 0,
  history: []
};

function byId(id){ return document.getElementById(id); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') e.addEventListener(k.slice(2), attrs[k]);
    else if(attrs[k]===null || attrs[k]===false || attrs[k]===undefined){ /* skip: no attribute */ }
    else if(attrs[k]===true) e.setAttribute(k, '');
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function svgIcon(inner){
  return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function ringSvg(size, stroke, pct, color){
  var r = (size-stroke)/2;
  var c = 2*Math.PI*r;
  var off = c*(1-pct);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" '+
      'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .4s ease"/>'+
    '</svg>';
}
function catCount(cat){ return ALL_QUESTIONS.filter(function(q){return q.category===cat;}).length; }
function weakCount(){
  var ids = Object.keys(store.missed).filter(function(id){ return store.missed[id] > 0; });
  return ids.length;
}
function catProficiency(cat){
  var ids = ALL_QUESTIONS.filter(function(q){return q.category===cat;}).map(function(q){return q.id;});
  var attemptedQ = 0, totalAttempts = 0, totalCorrect = 0;
  ids.forEach(function(id){
    var a = store.attempts[id]||0, c = store.correct[id]||0;
    if(a>0) attemptedQ++;
    totalAttempts += a; totalCorrect += c;
  });
  var acc = totalAttempts ? Math.round(totalCorrect/totalAttempts*100) : null;
  var level = acc===null ? 'neutral' : acc>=80 ? 'good' : acc>=50 ? 'amber' : 'bad';
  return {total: ids.length, attemptedQ: attemptedQ, acc: acc, level: level};
}

function render(){
  var app = byId('app');
  app.innerHTML = '';
  app.appendChild(renderTopbar());
  if(state.screen==='home') app.appendChild(renderHome());
  else if(state.screen==='quiz') app.appendChild(renderQuiz());
  else if(state.screen==='result') app.appendChild(renderResult());
  app.appendChild(renderFooter());
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function renderTopbar(){
  var back = state.screen!=='home';
  return el('div',{class:'topbar'},[
    el('div',{class:'brand'},[
      el('div',{class:'mark'}),
      el('div',{class:'name'},['GANTRY', el('small',{},['CT認定試験対策'])])
    ]),
    back ? el('button',{class:'icon-btn', onclick:function(){
      if(state.screen==='quiz'){
        if(!confirm('検査を中断してホームに戻りますか？進行中の結果は保存されません。')) return;
      }
      state.screen='home'; render();
    }},[el('span',{html:svgIcon('<path d="M15 18l-6-6 6-6"/>')}), 'ホームへ']) : el('span',{class:'icon-btn', style:'visibility:hidden'},['　'])
  ]);
}

function renderFooter(){
  return el('footer',{class:'app-footer'},['GANTRY — CT認定試験対策 ／ 全 '+ALL_QUESTIONS.length+' 問収録']);
}

/* ---------------- HOME ---------------- */
function renderHome(){
  var wrap = el('div',{});

  var hero = el('section',{class:'hero'},[
    el('div',{class:'eyebrow'},['CT認定技師試験対策']),
    el('p',{class:'lead'},['4分野・250問を1問ずつ解いて、解説とともに理解を積み上げていきます。']),
    el('div',{class:'hero-stats'},[
      statBlock(String(ALL_QUESTIONS.length), '収録問題数'),
      statBlock(String(CATEGORY_ORDER.length), '出題分野'),
      statBlock(String(weakCount()), '要復習問題')
    ])
  ]);
  wrap.appendChild(hero);

  var tabNav = el('div',{class:'tab-nav'},[
    el('button',{type:'button', class: state.homeTab==='setup' ? 'active':'', onclick:function(){ state.homeTab='setup'; render(); }},['出題']),
    el('button',{type:'button', class: state.homeTab==='stats' ? 'active':'', onclick:function(){ state.homeTab='stats'; render(); }},['習熟度'])
  ]);
  wrap.appendChild(tabNav);

  if(state.homeTab==='stats'){
    wrap.appendChild(renderProficiency());
    return wrap;
  }

  wrap.appendChild(el('div',{class:'section-label'},['分野を選択']));
  var grid = el('div',{class:'cat-grid'});
  CATEGORY_ORDER.forEach(function(cat){
    var active = state.selectedCats.indexOf(cat)>-1;
    var card = el('button',{class:'cat-card'+(active?' active':''), type:'button', onclick:function(){
      var i = state.selectedCats.indexOf(cat);
      if(i>-1){
        if(state.selectedCats.length===1) return;
        state.selectedCats.splice(i,1);
      } else state.selectedCats.push(cat);
      render();
    }},[
      el('span',{class:'icon', html:svgIcon(CATEGORY_ICON[cat])}),
      el('div',{},[
        el('div',{class:'cat-title'},[cat]),
        el('div',{class:'cat-meta'},[catCount(cat)+' 問']),
      ]),
      el('span',{class:'check'})
    ]);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  wrap.appendChild(el('div',{class:'section-label'},['検査条件']));
  var setup = el('div',{class:'setup-row'});

  var countField = el('div',{class:'field'},[el('label',{},['出題数'])]);
  var seg = el('div',{class:'seg'});
  [10,20,50,'all'].forEach(function(v){
    var label = v==='all' ? '全問' : String(v);
    var b = el('button',{type:'button', class: state.count===v ? 'active':'', onclick:function(){ state.count=v; render(); }},[label]);
    seg.appendChild(b);
  });
  countField.appendChild(seg);
  setup.appendChild(countField);

  var orderField = el('div',{class:'field'},[el('label',{},['出題順'])]);
  var seg2 = el('div',{class:'seg'});
  [[true,'シャッフル'],[false,'ID順']].forEach(function(pair){
    var b = el('button',{type:'button', class: state.shuffle===pair[0] ? 'active':'', onclick:function(){ state.shuffle=pair[0]; render(); }},[pair[1]]);
    seg2.appendChild(b);
  });
  orderField.appendChild(seg2);
  setup.appendChild(orderField);

  wrap.appendChild(setup);

  if(weakCount()>0){
    wrap.appendChild(el('div',{class:'weak-banner'},[
      el('div',{class:'t'},['過去に誤答した問題が ', el('b',{},[String(weakCount())]), ' 問あります。']),
      el('button',{class:'btn-ghost', onclick:function(){ startQuiz(true); }},['苦手問題だけ解く'])
    ]));
  }

  var pool = poolForSelection();
  wrap.appendChild(el('div',{class:'start-bar'},[
    el('div',{class:'avail', html:'選択中: <span class="mono">'+pool.length+'</span> 問から出題されます'}),
    el('button',{class:'btn-primary', disabled: pool.length===0, onclick:function(){ startQuiz(false); }},[
      el('span',{html:svgIcon('<path d="M5 3l14 9-14 9V3z"/>')}), 'スキャン開始'
    ])
  ]));

  return wrap;
}
function renderProficiency(){
  var wrap = el('div',{});
  wrap.appendChild(el('div',{class:'section-label'},['分野別の習熟度']));
  var list = el('div',{class:'bar-list'});
  var anyAttempt = false;
  CATEGORY_ORDER.forEach(function(cat){
    var p = catProficiency(cat);
    if(p.acc!==null) anyAttempt = true;
    var pctLabel = p.acc===null ? '未着手' : p.acc+'%';
    var row = el('div',{class:'bar-row'},[
      el('div',{class:'top'},[
        el('span',{class:'name'},[cat]),
        el('span',{class:'pct-tag '+p.level},[pctLabel])
      ]),
      el('div',{class:'bar-track'},[ el('div',{class:'bar-fill '+p.level, style:'width:'+(p.acc||0)+'%'}) ]),
      el('div',{class:'sub'},[p.attemptedQ+' / '+p.total+' 問に解答済み'])
    ]);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  if(!anyAttempt){
    wrap.appendChild(el('div',{class:'empty-note'},['まだ解答記録がありません。「出題」タブから問題を解くと、ここに分野別の正答率が表示されます。']));
  }
  return wrap;
}
function statBlock(num,label){
  return el('div',{},[ el('div',{class:'num'},[num]), el('div',{class:'lbl'},[label]) ]);
}
function poolForSelection(){
  return ALL_QUESTIONS.filter(function(q){ return state.selectedCats.indexOf(q.category)>-1; });
}

function startQuiz(weak){
  var pool;
  if(weak){
    pool = ALL_QUESTIONS.filter(function(q){ return (store.missed[q.id]||0) > 0; });
  } else {
    pool = poolForSelection();
  }
  if(pool.length===0) return;
  var ordered = state.shuffle ? shuffleArr(pool) : pool.slice();
  var n = weak ? ordered.length : (state.count==='all' ? ordered.length : Math.min(state.count, ordered.length));
  state.queue = ordered.slice(0,n);
  state.idx = 0;
  state.answered = null;
  state.score = 0;
  state.history = [];
  state.screen = 'quiz';
  render();
}

/* ---------------- QUIZ ---------------- */
function currentQ(){ return state.queue[state.idx]; }

function renderQuiz(){
  var q = currentQ();
  var wrap = el('div',{});
  var pct = state.queue.length ? state.idx/state.queue.length : 0;
  var deg = Math.round(pct*360);

  var ringDiv = el('div',{class:'ring-wrap'});
  ringDiv.innerHTML = ringSvg(52,4,pct,'var(--accent)');
  var degSpan = el('div',{class:'deg'},[deg+'°']);
  ringDiv.appendChild(degSpan);

  wrap.appendChild(el('div',{class:'quiz-top'},[
    ringDiv,
    el('div',{class:'quiz-meta'},[
      el('div',{class:'cat'},[q.category]),
      el('div',{class:'prog'},[el('b',{},[String(state.idx+1)]), ' / '+state.queue.length+' 問'])
    ])
  ]));

  var card = el('div',{class:'q-card'});
  card.appendChild(el('div',{},[
    el('span',{class:'q-id mono'},[q.id]),
    el('span',{class:'q-sub'},[q.subcategory])
  ]));
  card.appendChild(el('div',{class:'q-text'},[q.question]));

  var choicesDiv = el('div',{class:'choices'});
  var letters = ['a','b','c','d'];
  letters.forEach(function(L){
    var isAnswered = state.answered !== null;
    var isCorrect = L === q.answer;
    var isPicked = state.answered === L;
    var cls = 'choice';
    if(isAnswered){
      if(isCorrect) cls += ' correct';
      else if(isPicked) cls += ' wrong';
      else cls += ' dim';
    }
    var btn = el('button',{type:'button', class:cls, disabled: isAnswered ? 'disabled' : null, onclick:function(){ selectAnswer(L); }},[
      el('span',{class:'badge'},[L.toUpperCase()]),
      el('span',{},[q.choices[L]])
    ]);
    choicesDiv.appendChild(btn);
  });
  card.appendChild(choicesDiv);

  if(state.answered !== null){
    var correct = state.answered === q.answer;
    var expWrap = el('div',{class:'explain'});
    expWrap.appendChild(el('div',{class:'result-tag '+(correct?'ok':'ng')},[correct?'正解':'不正解 — 正答は '+q.answer.toUpperCase()]));
    expWrap.appendChild(el('p',{},[q.explanation]));
    if(q.tags){
      var tagsDiv = el('div',{class:'tags'});
      q.tags.split(';').forEach(function(t){ t=t.trim(); if(t) tagsDiv.appendChild(el('span',{class:'tag'},[t])); });
      expWrap.appendChild(tagsDiv);
    }
    card.appendChild(expWrap);
  }

  var actions = el('div',{class:'q-actions'});
  actions.appendChild(el('button',{class:'link-quiet', onclick:function(){
    if(!confirm('検査を終了して結果を確認しますか？')) return;
    finishQuiz();
  }}, ['ここで終了して結果を見る']));

  if(state.answered !== null){
    var isLast = state.idx === state.queue.length-1;
    actions.appendChild(el('button',{class:'btn-primary', onclick:function(){
      if(isLast) finishQuiz(); else nextQuestion();
    }},[ isLast ? '結果を見る' : '次の問題', el('span',{html:svgIcon('<path d="M9 6l6 6-6 6"/>')})]));
  }
  card.appendChild(actions);
  wrap.appendChild(card);
  wrap.appendChild(el('div',{class:'kbd-hint'},['選択: ',el('kbd',{},['1']),el('kbd',{},['2']),el('kbd',{},['3']),el('kbd',{},['4']),'　次へ: ',el('kbd',{},['Enter'])]));

  return wrap;
}

function selectAnswer(L){
  if(state.answered !== null) return;
  var q = currentQ();
  state.answered = L;
  var correct = L === q.answer;
  if(correct) state.score++;
  store.missed[q.id] = correct ? 0 : ((store.missed[q.id]||0) + 1);
  store.attempts[q.id] = (store.attempts[q.id]||0) + 1;
  store.correct[q.id] = (store.correct[q.id]||0) + (correct ? 1 : 0);
  saveStore(store);
  state.history.push({q:q, picked:L, correct:correct});
  render();
}
function nextQuestion(){
  state.idx++;
  state.answered = null;
  render();
}
function finishQuiz(){
  state.screen = 'result';
  render();
}

document.addEventListener('keydown', function(e){
  if(state.screen !== 'quiz') return;
  var map = {'1':'a','2':'b','3':'c','4':'d'};
  if(map[e.key] && state.answered===null){ selectAnswer(map[e.key]); }
  else if(e.key==='Enter' && state.answered!==null){
    var isLast = state.idx === state.queue.length-1;
    if(isLast) finishQuiz(); else nextQuestion();
  }
});

/* ---------------- RESULT ---------------- */
function renderResult(){
  var wrap = el('div',{});
  var total = state.history.length;
  var correct = state.history.filter(function(h){return h.correct;}).length;
  var pct = total ? correct/total : 0;

  var ring = el('div',{class:'score-ring'});
  ring.innerHTML = ringSvg(168,12,pct,'var(--accent)');
  ring.appendChild(el('div',{class:'center'},[
    el('div',{class:'pct mono'},[Math.round(pct*100)+'%']),
    el('div',{class:'of'},[correct+' / '+total+' 問正解'])
  ]));

  wrap.appendChild(el('section',{class:'result-hero'},[
    ring,
    el('div',{class:'result-copy'},[ el('h2',{},['結果']) ])
  ]));

  wrap.appendChild(el('div',{class:'section-label'},['分野別スコア']));
  var barList = el('div',{class:'bar-list'});
  var byCat = {};
  state.history.forEach(function(h){
    var c = h.q.category;
    byCat[c] = byCat[c] || {c:0,t:0};
    byCat[c].t++;
    if(h.correct) byCat[c].c++;
  });
  Object.keys(byCat).forEach(function(c){
    var d = byCat[c];
    var p = d.t? d.c/d.t : 0;
    var row = el('div',{class:'bar-row'},[
      el('div',{class:'top'},[ el('span',{class:'name'},[c]), el('span',{class:'frac mono'},[d.c+'/'+d.t]) ]),
      el('div',{class:'bar-track'},[ el('div',{class:'bar-fill', style:'width:'+(p*100)+'%'}) ])
    ]);
    barList.appendChild(row);
  });
  wrap.appendChild(barList);

  wrap.appendChild(el('div',{class:'section-label'},['誤答の復習']));
  var wrongs = state.history.filter(function(h){return !h.correct;});
  if(wrongs.length===0){
    wrap.appendChild(el('div',{class:'empty-note'},['誤答はありませんでした。']));
  } else {
    var rl = el('div',{class:'review-list'});
    wrongs.forEach(function(h){
      var item = el('div',{class:'review-item'},[
        el('div',{},[ el('span',{class:'q-id mono'},[h.q.id]), el('span',{class:'q-sub'},[h.q.subcategory]) ]),
        el('div',{class:'rq'},[h.q.question]),
        el('div',{class:'ra'},[
          el('div',{class:'you'},['あなたの回答: '+h.picked.toUpperCase()+'）'+h.q.choices[h.picked]]),
          el('div',{class:'right'},['正答: '+h.q.answer.toUpperCase()+'）'+h.q.choices[h.q.answer]])
        ]),
        el('div',{class:'rexp'},[h.q.explanation])
      ]);
      rl.appendChild(item);
    });
    wrap.appendChild(rl);
  }

  wrap.appendChild(el('div',{class:'result-actions'},[
    el('button',{class:'btn-primary', onclick:function(){ startQuiz(false); }},['同じ条件でもう一度']),
    wrongs.length>0 ? el('button',{class:'btn-ghost', onclick:function(){
      state.queue = state.shuffle ? shuffleArr(wrongs.map(function(h){return h.q;})) : wrongs.map(function(h){return h.q;});
      state.idx=0; state.answered=null; state.score=0; state.history=[];
      state.screen='quiz'; render();
    }},['誤答だけ再挑戦']) : null,
    el('button',{class:'btn-ghost', onclick:function(){ state.screen='home'; render(); }},['ホームに戻る'])
  ]));

  return wrap;
}

render();
})();
</script>
</body>
</html>
