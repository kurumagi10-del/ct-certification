tegory":"副作用対応","question":"造影剤投与後に嗄声、喘鳴、呼吸困難が生じた場合の初期対応はどれか。","choices":{"a":"患者を一人にして画像処理を優先する","b":"応援要請し酸素投与と気道評価を行う","c":"飲水させ歩行で症状消失を確認する","d":"造影剤を追加し反応の再現性を調べる"},"answer":"b","explanation":"嗄声や呼吸困難は気道閉塞を示唆する重篤な症状であり、直ちに応援を呼び、酸素投与および気道確保を開始する。","tags":"副作用;アナフィラキシー;呼吸"},{"id":"TE-43","category":"撮影技術と造影法","subcategory":"副作用対応","question":"造影剤反応による低血圧に対する初期の支持療法はどれか。","choices":{"a":"坐位にして輸液を止め脈拍だけをみる","b":"立位にして酸素を止め血圧だけをみる","c":"下肢挙上し酸素、急速輸液を開始する","d":"腹臥位にして保温を止め体温だけをみる"},"answer":"c","explanation":"造影剤ショックによる低血圧に対し、患者を仰臥位とし下肢を挙上させ、酸素投与と急速輸液を行う。","tags":"副作用;ショック;低血圧"},{"id":"TE-44","category":"撮影技術と造影法","subcategory":"副作用対応","question":"ヨード造影剤による遅発性反応として典型的なのはどれか。","choices":{"a":"注入中の血管痛が数秒以内に現れる","b":"撮影中の熱感が数分以内に現れる","c":"観察中の迷走神経反応が直後に現れる","d":"斑状丘疹状皮疹が数時間後に現れる"},"answer":"d","explanation":"遅発性反応は、造影剤投与後数時間から数日後に現れることがあり、典型的な症状として斑状丘疹状の皮疹が挙げられる。","tags":"副作用;遅発性"},{"id":"TE-45","category":"撮影技術と造影法","subcategory":"副作用対応","question":"ヨード造影剤によるアレルギー様反応の再発リスクを最も強く示す病歴はどれか。","choices":{"a":"同種造影剤によるアレルギー様反応歴","b":"単純CTによる一過性の閉所不安歴","c":"超音波検査による軽い圧迫痛の既往","d":"胸部撮影による軽い立ちくらみの既往"},"answer":"a","explanation":"過去に造影剤でアレルギー様反応（アナフィラキシー含む）を起こしたことがある患者は、再発リスクが非常に高い。","tags":"副作用;アレルギー;病歴"},{"id":"TE-46","category":"撮影技術と造影法","subcategory":"副作用対応","question":"甲殻類アレルギー歴がある患者のヨード造影CTに対する考え方はどれか。","choices":{"a":"ヨード造影剤の絶対禁忌として扱う","b":"他の食物アレルギーと同様に評価する","c":"造影剤との交差反応が必ずあると扱う","d":"重篤反応の最重要予測因子として扱う"},"answer":"b","explanation":"甲殻類アレルギーとヨードアレルギーとの直接的な関連性や交差反応は医学的に証明されておらず、他の食物アレルギーと同様のリスク評価を行う。","tags":"副作用;アレルギー"},{"id":"TE-47","category":"撮影技術と造影法","subcategory":"副作用対応","question":"気管支喘息とヨード造影剤反応との関係はどれか。","choices":{"a":"重篤反応を必ず起こす絶対禁忌である","b":"腎障害を必ず起こす絶対禁忌である","c":"アレルギー様反応リスクをやや高める","d":"血管外漏出を必ず起こす絶対禁忌である"},"answer":"c","explanation":"気管支喘息は、造影剤によるアナフィラキシーなどのアレルギー様反応のリスクを高める要因の一つである。","tags":"副作用;アレルギー;喘息"},{"id":"TE-48","category":"撮影技術と造影法","subcategory":"腎機能","question":"造影剤関連急性腎障害の概念として適切なのはどれか。","choices":{"a":"造影剤が単独原因と病理学的に証明された慢性腎障害を指す","b":"造影剤と無関係な慢性腎障害だけを指す","c":"造影剤投与前に改善した急性腎障害を指す","d":"造影後に生じた原因未確定の急性腎障害を指す"},"answer":"d","explanation":"造影剤関連急性腎障害（CI-AKI）は、他の原因を除外した上で、造影剤投与後に生じた原因不明の腎機能悪化を指す。","tags":"腎機能;造影剤腎症"},{"id":"TE-49","category":"撮影技術と造影法","subcategory":"腎機能","question":"急性腎障害などを有する高リスク患者で検討される予防策はどれか。","choices":{"a":"等張性輸液による適切な容量補充を行う","b":"N-アセチルシステインを全例へ投与する","c":"ループ利尿薬を全例へ追加投与する","d":"造影直後に予防透析を全例へ実施する"},"answer":"a","explanation":"高リスク患者における造影剤関連急性腎障害の予防には、造影前後の十分な等張性輸液による水分補給が最も重要である。","tags":"腎機能;予防策;輸液"},{"id":"TE-50","category":"撮影技術と造影法","subcategory":"腎機能","question":"メトホルミン服用患者で造影後の腎機能悪化に注意する主な理由はどれか。","choices":{"a":"メトホルミン自体が造影剤腎障害を起こすため","b":"急性腎障害時に乳酸アシドーシスが懸念されるため","c":"メトホルミンが造影剤濃度を上昇させ血管外漏出を必ず起こすため","d":"メトホルミンが尿中ヨードを結晶化させ尿路閉塞を必ず起こすため"},"answer":"b","explanation":"メトホルミン服用患者において、造影剤による急性腎障害が生じると、メトホルミンの排泄が滞り、致死的な乳酸アシドーシスを引き起こす可能性がある。","tags":"腎機能;メトホルミン;乳酸アシドーシス"},{"id":"ED-01","category":"被ばく管理と線量評価","subcategory":"CTDIvol","question":"CTDIvolの説明として適切なのはどれか。","choices":{"a":"患者臓器の実吸収線量を直接示している指標","b":"全身リスクを年齢別に換算した指標","c":"標準ファントムによる装置出力の指標","d":"撮影範囲を含む総線量を表している指標"},"answer":"c","explanation":"CTDIvolは標準ファントムによる装置出力の指標である。","tags":"被ばく;指標;装置出力"},{"id":"ED-02","category":"被ばく管理と線量評価","subcategory":"DLP","question":"DLPの定義として適切なのはどれか。","choices":{"a":"CTDIvolと撮影長の積である","b":"CTDIvolを撮影長で除した指標","c":"SSDEに患者体重を乗じた指標","d":"実効線量を臓器数で除した指標"},"answer":"a","explanation":"DLPはCTDIvolと撮影長の積で定義される。","tags":"被ばく;指標;撮影長"},{"id":"ED-03","category":"被ばく管理と線量評価","subcategory":"SSDE","question":"SSDEの特徴として適切なのはどれか。","choices":{"a":"標準体格の実効線量を年齢で補正した値","b":"臓器線量の合計を撮影長で補正した値","c":"装置出力を管電圧の比率で補正した値","d":"CTDIvolの患者サイズ補正値"},"answer":"d","explanation":"SSDEはCTDIvolの患者サイズ補正値である。","tags":"被ばく;指標;患者サイズ"},{"id":"ED-04","category":"被ばく管理と線量評価","subcategory":"実効線量","question":"実効線量の算出概念として適切なのはどれか。","choices":{"a":"各臓器の吸収線量を単純加算した量","b":"組織荷重係数を用いて合算した量","c":"CTDIvolを患者体重だけで補正した量","d":"DLPを全撮影時間で平均化した量"},"answer":"b","explanation":"実効線量は組織荷重係数を用いて各臓器の線量を合算した量である。","tags":"被ばく;指標;組織荷重係数"},{"id":"ED-05","category":"被ばく管理と線量評価","subcategory":"線量指標","question":"CTの線量指標と単位の組合せとして適切なのはどれか。","choices":{"a":"CTDIvolはmGy、DLPはmGy cm、実効線量はSv","b":"CTDIvolはmSv、DLPはmGy、実効線量はmGy cm","c":"CTDIvolはmGy cm、DLPはmSv、実効線量はmGy","d":"CTDIvolはmGy、DLPはmSv、実効線量はmGy cm"},"answer":"a","explanation":"CTDIvolはmGy、DLPはmGy cm、実効線量はSvである。","tags":"被ばく;指標;単位"},{"id":"ED-06","category":"被ばく管理と線量評価","subcategory":"撮影条件","question":"他の撮影条件と管電流時間積を一定にしてヘリカルピッチを上げた場合、CTDIvolはどうなるか。","choices":{"a":"撮影長に比例して増加する","b":"患者体重に比例して増加する","c":"ピッチに反比例して低下する","d":"スライス厚に反比例して低下する"},"answer":"c","explanation":"CTDIvolはピッチに反比例して低下する。","tags":"ヘリカルピッチ;線量;撮影条件"},{"id":"ED-07","category":"被ばく管理と線量評価","subcategory":"画像ノイズ","question":"X線量と画像ノイズの基本的な関係として適切なのはどれか。","choices":{"a":"X線量を増やすと量子ノイズも増加する","b":"X線量を増やすと量子ノイズは減少する","c":"X線量を変えても量子ノイズは一定である","d":"X線量を減らすと量子ノイズも減少する"},"answer":"b","explanation":"X線量を増やすと量子ノイズは減少する。","tags":"画像ノイズ;量子ノイズ;X線量"},{"id":"ED-08","category":"被ばく管理と線量評価","subcategory":"撮影条件","question":"同じ再構成法と画像ノイズを保ちながら再構成スライス厚を薄くする場合、一般に必要な対応はどれか。","choices":{"a":"管電流を下げて線量を少なくする","b":"撮影長を延ばして線量を多くする","c":"管電圧を下げて線量を少なくする","d":"管電流を上げて線量を多くする"},"answer":"d","explanation":"スライス厚を薄くするとノイズが増えるため、管電流を上げて線量を多くする。","tags":"再構成;スライス厚;線量"},{"id":"ED-09","category":"被ばく管理と線量評価","subcategory":"画質","question":"低コントラスト検出能を改善する要因として適切なのはどれか。","choices":{"a":"画像ノイズを増加させること","b":"部分体積効果を増加させること","c":"画像ノイズを低下させること","d":"ビームハードニングを増加させること"},"answer":"c","explanation":"画像ノイズを低下させると低コントラスト検出能が改善する。","tags":"画質;コントラスト;ノイズ"},{"id":"ED-10","category":"被ばく管理と線量評価","subcategory":"再構成法","question":"逐次近似再構成の線量管理上の利点として適切なのはどれか。","choices":{"a":"撮影範囲を延長して解剖情報を増やせる","b":"同等ノイズのまま線量を低減できる","c":"管電圧を固定して造影効果を一定にできる","d":"寝台速度を固定して撮影時間を短縮できる"},"answer":"b","explanation":"逐次近似再構成は同等ノイズのまま線量を低減できる。","tags":"逐次近似再構成;ノイズ;線量低減"},{"id":"ED-11","category":"被ばく管理と線量評価","subcategory":"造影CT","question":"造影CTで管電圧を下げる際の一般的な特徴として適切なのはどれか。","choices":{"a":"ヨード造影効果が高まりノイズに注意する","b":"ヨード造影効果が下がる一方でノイズに注意する","c":"ヨード造影効果が高まる一方で撮影長に注意する","d":"ヨード造影効果が下がる一方で撮影長に注意する"},"answer":"a","explanation":"管電圧を下げるとヨード造影効果が高まる一方、ノイズが増えるため注意が必要。","tags":"管電圧;ヨード造影;ノイズ"},{"id":"ED-12","category":"被ばく管理と線量評価","subcategory":"ヘリカルCT","question":"ヘリカルCTにおけるオーバーレンジングの説明として適切なのはどれか。","choices":{"a":"位置決め画像を予定範囲より長く撮ること","b":"検査目的を超えて多相撮影を追加すること","c":"再構成画像を予定範囲より厚く作ること","d":"補間用に予定範囲外まで照射すること"},"answer":"d","explanation":"オーバーレンジングは補間用に予定範囲外まで照射することである。","tags":"ヘリカル;照射;補間"},{"id":"ED-13","category":"被ばく管理と線量評価","subcategory":"撮影範囲","question":"不要な撮影範囲の拡大を防ぐ方法として適切なのはどれか。","choices":{"a":"再構成関数を検査目的ごとに選択する","b":"必要な解剖範囲だけを撮影する","c":"表示条件を検査目的ごとに選択する","d":"画像保存範囲を必要な時相に限定する"},"answer":"b","explanation":"必要な解剖範囲だけを撮影することが、不要な範囲の拡大を防ぐ。","tags":"撮影範囲;最適化;防護"},{"id":"ED-14","category":"被ばく管理と線量評価","subcategory":"撮影時相","question":"同じ部位で撮影時相を追加した場合の線量への影響として適切なのはどれか。","choices":{"a":"各時相のDLPが相殺され総DLPは低下する","b":"各時相のDLPが平均され総DLPは一定になる","c":"各時相のDLPが加算され総DLPは増加する","d":"各時相のDLPが除算され総DLPは低下する"},"answer":"c","explanation":"撮影時相を追加すると各時相のDLPが加算され総DLPは増加する。","tags":"時相;DLP;線量"},{"id":"ED-15","category":"被ばく管理と線量評価","subcategory":"AEC","question":"CTのAECの主な目的として適切なのはどれか。","choices":{"a":"撮影中の管電圧を常に一定値へ保つこと","b":"撮影中の寝台速度を常に一定値へ保つこと","c":"撮影中のスライス厚を体格別に変えること","d":"減弱に応じて管電流を調整すること"},"answer":"d","explanation":"AECは患者の減弱に応じて管電流を調整する。","tags":"AEC;管電流;線量"},{"id":"ED-16","category":"被ばく管理と線量評価","subcategory":"AEC","question":"CTの自動管電流変調に含まれる方式として適切なのはどれか。","choices":{"a":"体軸方向変調と回転角度方向変調","b":"管電圧方向変調と焦点寸法方向変調","c":"寝台方向変調と再構成関数方向変調","d":"撮影時相変調と表示条件方向変調"},"answer":"a","explanation":"自動管電流変調には体軸方向変調と回転角度方向変調がある。","tags":"AEC;変調;管電流"},{"id":"ED-17","category":"被ばく管理と線量評価","subcategory":"AEC","question":"AECを用いるCTで患者の中心位置合わせが重要な理由として適切なのはどれか。","choices":{"a":"寝台速度が中心位置だけで決定されるため","b":"再構成関数が中心位置だけで決定されるため","c":"見かけの体格と線量調整に影響するため","d":"造影剤濃度と注入速度に影響するため"},"answer":"c","explanation":"中心位置がずれると見かけの体格が変わり、線量調整に影響する。","tags":"AEC;位置合わせ;線量調整"},{"id":"ED-18","category":"被ばく管理と線量評価","subcategory":"撮影技術","question":"胸腹部CTで可能な患者の腕を挙上する主な利点として適切なのはどれか。","choices":{"a":"体幹の減弱とストリークを抑える","b":"体幹部の撮影長と撮影時相を減らせる","c":"体幹部の造影剤量と注入速度を減らせる","d":"体幹部のスライス厚と画像枚数を減らせる"},"answer":"a","explanation":"腕を挙上することで体幹の減弱とストリークを抑える。","tags":"撮影技術;腕挙上;アーチファクト"},{"id":"ED-19","category":"被ばく管理と線量評価","subcategory":"AEC","question":"多くのCT装置でAECが管電流計画に利用する情報として適切なのはどれか。","choices":{"a":"検査後に作成した冠状断画像の減弱情報","b":"撮影前に得た位置決め画像の減弱情報","c":"検査後に作成した線量報告書の統計情報","d":"撮影前に入力した造影剤量の投与情報"},"answer":"b","explanation":"AECは位置決め画像の減弱情報を利用して管電流を計画する。","tags":"AEC;位置決め;管電流"},{"id":"ED-20","category":"被ばく管理と線量評価","subcategory":"臓器線量","question":"臓器線量変調の説明として適切なのはどれか。","choices":{"a":"側面通過時の管電圧を上げて骨盤線量を増やす","b":"後面通過時の管電圧を下げて脊椎線量を増やす","c":"側面通過時の管電流を上げて皮膚線量を増やす","d":"前面側の管電流を抑え表在臓器線量を減らす"},"answer":"d","explanation":"臓器線量変調は前面側の管電流を抑え表在臓器線量を減らす方式である。","tags":"線量変調;臓器;線量"},{"id":"ED-21","category":"被ばく管理と線量評価","subcategory":"正当化","question":"AECを使用する場合の検査の正当化について適切なのはどれか。","choices":{"a":"AEC使用中も検査の正当化が必要である","b":"AECを使用すれば検査ごとの正当化は不要である","c":"AECを使用すれば依頼目的の確認は不要である","d":"AECを使用すれば代替検査の検討は不要である"},"answer":"a","explanation":"検査の正当化は装置の機能（AEC等）に関わらず必要である。","tags":"正当化;最適化;防護"},{"id":"ED-22","category":"被ばく管理と線量評価","subcategory":"AEC","question":"メーカーが異なるAECの画質設定値を扱う際に適切なのはどれか。","choices":{"a":"同じ数値なら同じCTDIvolになると判断する","b":"同じ数値なら同じ画像ノイズになると判断する","c":"同じ数値なら同じ管電流になると判断する","d":"定義を確認し単純な数値比較を避ける"},"answer":"d","explanation":"メーカーごとに定義が異なるため、単純な数値比較は避けるべきである。","tags":"AEC;画質設定;比較"},{"id":"ED-23","category":"被ばく管理と線量評価","subcategory":"小児CT","question":"小児CTのプロトコル設定として適切なのはどれか。","choices":{"a":"成人条件を年齢に関係なくそのまま用いる","b":"成人条件を撮影部位に関係なくそのまま用いる","c":"体格と診断目的に応じた条件を用いる","d":"体格と診断目的に関係なく条件を固定する"},"answer":"c","explanation":"小児CTは体格と診断目的に応じて条件を適正化すべきである。","tags":"小児;プロトコル;最適化"},{"id":"ED-24","category":"被ばく管理と線量評価","subcategory":"DRL","question":"診断参考レベルであるDRLの位置づけとして適切なのはどれか。","choices":{"a":"個々の患者に適用する厳格な線量限度である","b":"標準検査の線量最適化に使う指標である","c":"確定的影響を防ぐ個人別のしきい値である","d":"装置故障を判定する一律の許容誤差である"},"answer":"b","explanation":"DRLは線量最適化のための指標である。","tags":"DRL;指標;最適化"},{"id":"ED-25","category":"被ばく管理と線量評価","subcategory":"DRL","question":"国や地域のDRLを設定する基礎として適切なのはどれか。","choices":{"a":"一人の患者における最大線量の測定値","b":"一台の装置における最小線量の測定値","c":"一人の患者における臓器線量の計算値","d":"複数施設における代表線量値の分布"},"answer":"d","explanation":"DRLは複数施設における代表線量の分布から設定される。","tags":"DRL;設定;分布"},{"id":"ED-26","category":"被ばく管理と線量評価","subcategory":"DRL","question":"施設の代表的なCT線量がDRLを継続して上回る場合の対応として適切なのはどれか。","choices":{"a":"直ちに全患者の検査を一律に中止する","b":"原因を調査してプロトコルを最適化する","c":"全患者の線量をDRLと同じ値に固定する","d":"線量記録を削除して再集計を回避する"},"answer":"b","explanation":"DRLを上回る場合は原因調査とプロトコル最適化を行う。","tags":"DRL;対応;最適化"},{"id":"ED-27","category":"被ばく管理と線量評価","subcategory":"DRL","question":"施設の代表的なCT線量がDRLを下回る場合の解釈として適切なのはどれか。","choices":{"a":"診断に必要な画質も併せて確認する","b":"線量が低いほど常に検査品質は高い","c":"画質に関係なく線量をさらに半減する","d":"検査目的に関係なく条件を統一する"},"answer":"a","explanation":"DRLを下回る場合でも、診断に必要な画質が保たれているか確認する必要がある。","tags":"DRL;画質;評価"},{"id":"ED-28","category":"被ばく管理と線量評価","subcategory":"DRL","question":"2026年時点で日本のCT線量管理に用いる最新の全国DRLはどれか。","choices":{"a":"Japan DRLs 2015初版","b":"Japan DRLs 2020改訂版","c":"Japan DRLs 2025","d":"Japan DRLs 2030改訂版"},"answer":"c","explanation":"Japan DRLs 2025が現在使用される最新のDRLである。","tags":"DRL;最新;日本"},{"id":"ED-29","category":"被ばく管理と線量評価","subcategory":"DRL","question":"Japan DRLs 2025における成人の頭部単純ルーチンCTの組合せはどれか。","choices":{"a":"CTDIvol 57 mGy、DLP 1160 mGy cm","b":"CTDIvol 67 mGy、DLP 1260 mGy cm","c":"CTDIvol 77 mGy、DLP 1360 mGy cm","d":"CTDIvol 107 mGy、DLP 1460 mGy cm"},"answer":"b","explanation":"Japan DRLs 2025の頭部単純ルーチンCTの値はCTDIvol 67mGy、DLP 1260mGy cmである。","tags":"DRL;頭部;数値"},{"id":"ED-30","category":"被ばく管理と線量評価","subcategory":"正当化","question":"医療被ばくにおける検査の正当化として適切なのはどれか。","choices":{"a":"線量がゼロになる検査だけを実施すること","b":"装置の稼働率が上がる検査を実施すること","c":"依頼医が希望した検査を無条件で実施すること","d":"期待される医学的便益がリスクを上回ること"},"answer":"d","explanation":"便益がリスクを上回ることが検査正当化の条件である。","tags":"正当化;便益;リスク"},{"id":"ED-31","category":"被ばく管理と線量評価","subcategory":"最適化","question":"医療被ばくにおける防護の最適化として適切なのはどれか。","choices":{"a":"診断情報に関係なく最低線量を選ぶこと","b":"全患者に同一の撮影条件を適用すること","c":"必要画質を保って線量を抑えること","d":"線量に関係なく最高画質を常に選ぶこと"},"answer":"c","explanation":"必要画質を保ちつつ線量を最小限に抑えることが最適化である。","tags":"最適化;防護;画質"},{"id":"ED-32","category":"被ばく管理と線量評価","subcategory":"線量限度","question":"ICRPの考え方に基づく患者の医療被ばくへの線量限度の適用として適切なのはどれか。","choices":{"a":"患者に線量限度を適用せず最適化を重視する","b":"職業被ばくと同じ線量限度を患者にも一律適用する","c":"公衆被ばくと同じ線量限度を患者にも一律適用する","d":"年齢だけで決めた線量限度を患者ごとに一律適用する"},"answer":"a","explanation":"患者への医療被ばくには線量限度を適用せず、最適化を重視する。","tags":"線量限度;患者;最適化"},{"id":"ED-33","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線の確率的影響の特徴として適切なのはどれか。","choices":{"a":"発生確率は一定で重症度だけが線量で増す","b":"しきい値を超えると重症度だけが線量で増す","c":"しきい値以下では発生確率が必ずゼロになる","d":"線量が増すと発生確率が高まると仮定する"},"answer":"d","explanation":"確率的影響は線量が増すと発生確率が高まると仮定される。","tags":"放射線影響;確率的影響;発生確率"},{"id":"ED-34","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線の組織反応の特徴として適切なのはどれか。","choices":{"a":"一般にしきい値があり線量とともに重症度が増す","b":"一般にしきい値がなく線量とともに重症度が減る","c":"一般にしきい値があり線量とともに発生率が下がる","d":"一般にしきい値がなく線量とともに発生率が一定になる"},"answer":"a","explanation":"組織反応（確定的影響）はしきい値があり、重症度が増す。","tags":"放射線影響;組織反応;しきい値"},{"id":"ED-35","category":"被ばく管理と線量評価","subcategory":"放射線影響","question":"放射線誘発がんの時間的特徴として適切なのはどれか。","choices":{"a":"被ばく直後だけに発生して以後は生じない","b":"被ばくから発症まで潜伏期間が存在する","c":"被ばくした時点で必ず臨床症状が出現する","d":"被ばく後の一定時刻に全員で同時発症する"},"answer":"b","explanation":"放射線誘発がんには潜伏期間が存在する。","tags":"放射線影響;がん;潜伏期間"},{"id":"ED-36","category":"被ばく管理と線量評価","subcategory":"小児被ばく","question":"同程度のCT被ばくを受けた小児と成人の比較として適切なのはどれか。","choices":{"a":"小児は余命が短いため生涯リスクが低い","b":"小児は細胞分裂が少ないため影響を受けにくい","c":"小児は感受性と余命の点からリスクが高い","d":"小児は体格が小さいため臓器線量が常にゼロになる"},"answer":"c","explanation":"小児は感受性が高く余命も長いためリスクが高い。","tags":"小児;感受性;リスク"},{"id":"ED-37","category":"被ばく管理と線量評価","subcategory":"胎児被ばく","question":"胎児への放射線影響を評価する際の考え方として適切なのはどれか。","choices":{"a":"妊娠時期と胎児線量で評価する","b":"母体年齢だけを考慮して一律に評価する","c":"撮影装置の製造年だけで一律に評価する","d":"造影剤の注入速度だけで一律に評価する"},"answer":"a","explanation":"胎児影響は妊娠時期と胎児線量で評価する。","tags":"胎児;被ばく;影響評価"},{"id":"ED-38","category":"被ばく管理と線量評価","subcategory":"胎児被ばく","question":"妊娠の可能性がある患者にCTが検討される場合の対応として適切なのはどれか。","choices":{"a":"妊娠の可能性だけで必要な検査を永久に中止する","b":"妊娠の可能性を確認せず通常条件で検査を進める","c":"臨床的必要性を確認し代替法と条件を検討する","d":"胎児線量を確認せず患者に判断をすべて委ねる"},"answer":"c","explanation":"必要性を確認し代替法や条件の最適化を検討する。","tags":"胎児;妊娠;対応"},{"id":"ED-39","category":"被ばく管理と線量評価","subcategory":"放射線感受性","question":"細胞の放射線感受性に関する一般的な説明として適切なのはどれか。","choices":{"a":"分裂せず高度に分化した細胞ほど感受性が高い","b":"分裂頻度と分化度に関係なく感受性は同じである","c":"分裂頻度が低く高度に分化した細胞ほど感受性が高い","d":"分裂頻度が高く未分化な細胞ほど感受性が高い"},"answer":"d","explanation":"分裂頻度が高く未分化な細胞ほど感受性が高い。","tags":"感受性;細胞;放射線"},{"id":"ED-40","category":"被ばく管理と線量評価","subcategory":"線量評価","question":"CT検査の実効線量を患者個人のリスク説明に使う際の注意点として適切なのはどれか。","choices":{"a":"個人の臓器線量と発がん確率を正確に確定できる","b":"標準集団に基づく概算で個人差を十分に表さない","c":"CTDIvolと常に同じ数値になるため換算は不要である","d":"患者体格だけで決まり撮影部位による差は生じない"},"answer":"b","explanation":"実効線量は標準集団に基づく概算であり個人差を十分に表さない。","tags":"実効線量;リスク;説明"},{"id":"ED-41","category":"被ばく管理と線量評価","subcategory":"リスクコミュニケーション","question":"患者へのCT被ばくのリスクコミュニケーションとして適切なのはどれか。","choices":{"a":"便益を説明せず放射線リスクだけを強調する","b":"リスクを説明せず検査の便益だけを強調する","c":"便益とリスクを平易に伝え不確かさも示す","d":"専門用語だけを用いて数値の比較を避ける"},"answer":"c","explanation":"便益とリスクを平易に伝え、不確かさも伝えることが重要。","tags":"リスクコミュニケーション;便益;リスク"},{"id":"ED-42","category":"被ばく管理と線量評価","subcategory":"X線の性質","question":"CTで使用するX線の性質として適切なのはどれか。","choices":{"a":"電離作用を持たない機械的な縦波である","b":"物質を電離し得る電磁放射線である","c":"静磁場だけから成る非電離放射線である","d":"可聴域の周波数だけを持つ音波である"},"answer":"b","explanation":"X線は物質を電離し得る電磁放射線である。","tags":"X線;物理;電離"},{"id":"ED-43","category":"被ばく管理と線量評価","subcategory":"放射線防護","question":"CT室内にやむを得ず残るスタッフが受ける主な放射線の由来として適切なのはどれか。","choices":{"a":"患者や周囲の物質から生じる散乱線","b":"画像表示モニタから生じる一次X線","c":"造影剤自動注入器から生じる中性子線","d":"再構成計算装置から生じる電子線"},"answer":"a","explanation":"スタッフが受ける主な放射線は散乱線である。","tags":"防護;散乱線;スタッフ"},{"id":"ED-44","category":"被ばく管理と線量評価","subcategory":"放射線防護","question":"介助者がやむを得ずCT室内で患者を保持する場合の対応として適切なのはどれか。","choices":{"a":"照射野内に立ち患者と同じ部位を保持する","b":"防護具を使わず患者の近くで保持を続ける","c":"線源に近づきガントリへ体を密着させる","d":"照射野を避け距離と防護具を活用する"},"answer":"d","explanation":"照射野を避け、距離を保ち、防護具を使用する。","tags":"防護;介助者;保持"},{"id":"ED-45","category":"被ばく管理と線量評価","subcategory":"線量記録","question":"CT線量情報を系統的に保存する仕組みとして適切なのはどれか。","choices":{"a":"画像の表示条件だけを記録する検像票","b":"CTDIvolとDLPの線量記録","c":"造影剤の商品名だけを記録する注射票","d":"患者の会計情報だけを記録する請求票"},"answer":"b","explanation":"CTDIvolとDLPの線量記録を行うべきである。","tags":"記録;線量;保存"},{"id":"ED-46","category":"被ばく管理と線量評価","subcategory":"防護","question":"不要な再撮影による被ばくを防ぐ取り組みとして適切なのはどれか。","choices":{"a":"撮影前に患者確認とプロトコル確認を行う","b":"撮影後に撮影範囲を毎回追加して確認する","c":"撮影前に過去画像を見ず同じ検査を繰り返す","d":"撮影後に理由を問わず全時相を再撮影する"},"answer":"a","explanation":"事前確認を行うことで不要な再撮影を防ぐ。","tags":"再撮影;防護;確認"},{"id":"ED-47","category":"被ばく管理と線量評価","subcategory":"計算","question":"CTDIvolが10 mGy、撮影長が30 cmのとき、DLPはいくらか。","choices":{"a":"30 mGy cm","b":"100 mGy cm","c":"1000 mGy cm","d":"300 mGy cm"},"answer":"d","explanation":"DLP = CTDIvol × 撮影長 = 10 mGy × 30 cm = 300 mGy cm","tags":"計算;DLP;CTDIvol"},{"id":"ED-48","category":"被ばく管理と線量評価","subcategory":"計算","question":"DLPが500 mGy cm、換算係数が0.02 mSv/(mGy cm)のとき、概算実効線量はいくらか。","choices":{"a":"2.5 mSv","b":"5 mSv","c":"10 mSv","d":"20 mSv"},"answer":"c","explanation":"実効線量 = DLP × 換算係数 = 500 × 0.02 = 10 mSv","tags":"計算;実効線量;DLP"},{"id":"ED-49","category":"被ばく管理と線量評価","subcategory":"SSDE","question":"同じCTDIvolで体格だけが異なる体幹部CTのSSDEについて、一般的に適切なのはどれか。","choices":{"a":"小さい患者ではCTDIvolを上回りやすい","b":"小さい患者では必ずCTDIvolと等しくなる","c":"大きい患者ではCTDIvolより大きくなりやすい","d":"大きい患者では必ずCTDIvolと等しくなる"},"answer":"a","explanation":"体格が小さい患者では、減弱が少なくてもSSDEはCTDIvolを上回る傾向がある。","tags":"SSDE;体格;線量"},{"id":"ED-50","category":"被ばく管理と線量評価","subcategory":"監査","question":"施設で行うCT線量監査として適切なのはどれか。","choices":{"a":"全検査の最大値だけを装置間で比較する","b":"検査別線量をDRLと画質で評価する","c":"患者一人の最小値だけを全国値と比較する","d":"装置の管電圧だけを患者体格と比較する"},"answer":"b","explanation":"線量監査は検査別の線量をDRLや画質とともに評価する。","tags":"監査;DRL;評価"},{"id":"SM-01","category":"安全管理","subcategory":"ペースメーカ安全管理","question":"植込み型心臓ペースメーカ本体へX線束を連続照射した場合に起こり得る現象はどれか。","choices":{"a":"電池消耗によりペーシング出力が恒久的に増加する","b":"リード加熱によりペーシング閾値が恒久的に低下する","c":"過感知によりペーシング出力が一時的に抑制される","d":"磁気反応によりペーシング出力が一時的に増加する"},"answer":"c","explanation":"X線束の連続照射により本体内部のC-MOS回路が影響を受け、オーバーセンシング（過感知）が生じることで、ペーシングパルス出力が一時的に抑制されることがある。","tags":"X線連続照射;ペースメーカ;過感知"},{"id":"SM-02","category":"安全管理","subcategory":"ペースメーカ安全管理","question":"植込み型心臓ペースメーカ本体への連続照射について、添付文書上の基本的な注意はどれか。","choices":{"a":"5秒以上連続して照射しない","b":"1秒以上連続して照射しない","c":"10秒以上連続して照射しない","d":"30秒以上連続して照射しない"},"answer":"a","explanation":"ペースメーカ本体へのX線束の連続照射による誤作動を防ぐため、添付文書上では本体植込み部位に5秒以上連続して照射しないこととされている。","tags":"添付文書;連続照射制限;ペースメーカ"},{"id":"SM-03","category":"安全管理","subcategory":"ペースメーカ安全管理","question":"ペースメーカ植込み部位への5秒以上の連続照射が見込まれる場合、最初に検討する対策はどれか。","choices":{"a":"寝台速度を下げて照射時間を延長できるか検討する","b":"撮影範囲を広げて照射部位を追加できるか検討する","c":"再構成厚を薄くして照射回数を増加できるか検討する","d":"両腕挙上などで本体を照射部位から外せるか検討する"},"answer":"d","explanation":"5秒以上の連続照射が見込まれる場合の初期対策として、患者の両腕挙上などによりペースメーカ本体を照射範囲から外すことが推奨される。","tags":"曝露低減;体位変換;両腕挙上"},{"id":"SM-04","category":"安全管理","subcategory":"ペースメーカ安全管理","question":"植込み型除細動器本体へX線束を照射した場合に想定される影響はどれか。","choices":{"a":"除細動電極が加熱して皮膚損傷を生じる可能性","b":"治療抑制や不適切な頻拍治療を生じる可能性","c":"内蔵電池が急速放電して寿命を縮める可能性","d":"接続リードが断線して感知機能を失う可能性"},"answer":"b","explanation":"植込み型除細動器（ICD）本体へのX線照射では、C-MOS回路への影響によりオーバーセンシングが生じ、治療抑制や不適切な頻拍治療を引き起こす可能性がある。","tags":"植込み型除細動器;誤作動;治療抑制"},{"id":"SM-05","category":"安全管理","subcategory":"ペースメーカ安全管理","question":"CT検査前に植込み型心臓デバイスの情報を確認する方法として適切なのはどれか。","choices":{"a":"聴診所見だけで植込み機器の種類を判定する","b":"患者手帳などで機種と植込み部位を確認する","c":"CTでは影響しないため植込み情報を確認しない","d":"胸部検査だけ植込み情報を検査後に確認する"},"answer":"b","explanation":"デバイスの有無や機種、植込み部位の正確な確認には、患者が所持する患者手帳や医療情報の確認が最も確実で適切である。","tags":"患者手帳;デバイス確認;事前情報"},{"id":"SM-06","category":"安全管理","subcategory":"装置管理・法令","question":"CT装置の使用上の注意を確認する方法として、2026年時点で適切なのはどれか。","choices":{"a":"納入時の紙添文だけを耐用期間中は継続して用いる","b":"院内手順書だけを最新の電子添文の代わりに用いる","c":"PMDAで最新の電子添文と改訂情報を確認する","d":"他社の同種装置の電子添文を共通の資料として用いる"},"answer":"c","explanation":"医療機器の添付文書は電子化されており、独立行政法人医薬品医療機器総合機構（PMDA）のウェブサイト等で最新の電子添文および改訂情報を確認する必要がある。","tags":"PMDA;電子添文;改訂情報"},{"id":"SM-07","category":"安全管理","subcategory":"患者安全・体位","question":"CT装置の位置決め用レーザを使用する際の対応として適切なのはどれか。","choices":{"a":"患者に閉眼または直視回避を指示して使用する","b":"患者に投光器を見続けるよう指示して使用する","c":"眼球位置の確認目的で瞳孔へ直接照射して使用する","d":"防護眼鏡がない場合は照明を消して直接照射する"},"answer":"a","explanation":"位置決め用レーザ光が眼に入ると網膜等に悪影響を及ぼす恐れがあるため、患者にはあらかじめ閉眼するか直視しないよう指示して使用する。","tags":"位置決めレーザ;直視回避;眼の安全"},{"id":"SM-08","category":"安全管理","subcategory":"装置管理・法令","question":"CT装置の緊急停止ボタンを使用する場面として適切なのはどれか。","choices":{"a":"通常終了後の電源遮断に毎回使用する","b":"画像転送を一時中断する目的で使用する","c":"校正処理を強制開始する目的で使用する","d":"緊急時に寝台移動やX線照射を停止する"},"answer":"d","explanation":"緊急停止ボタンは、患者や装置に突発的な危険が及んだ際、寝台の移動やX線照射、ガントリの動作などを直ちに停止させるためのものである。","tags":"緊急停止;事故防止;非常ボタン"},{"id":"SM-09","category":"安全管理","subcategory":"患者安全・体位","question":"CT寝台へ患者を載せる前の安全確認として適切なのはどれか。","choices":{"a":"施設の標準体重を超える患者には使用しない","b":"操作者が持ち上げられない患者には使用しない","c":"装置ごとの許容荷重と荷重位置を事前確認する","d":"ガントリ径に収まる患者なら制限なく使用する"},"answer":"c","explanation":"寝台の破損や事故を防ぐため、事前にCT装置ごとの最大許容荷重（耐荷重）や許容荷重位置を確認しておく必要がある。","tags":"許容荷重;寝台耐荷重;安全確認"},{"id":"SM-10","category":"安全管理","subcategory":"検査室環境","question":"CT装置を設置した検査室の環境に関する禁忌として適切なのはどれか。","choices":{"a":"酸素投与中の患者では装置の主電源を切って撮影する","b":"造影剤使用中の患者では室内照明を消して撮影する","c":"清掃直後の検査室では室内湿度を最低設定にして撮影する","d":"可燃性や爆発性の気体がある検査室では装置を使用しない"},"answer":"d","explanation":"可燃性ガスや爆発性ガスが存在する環境下では、電気火花などによる引火・爆発の危険があるため、CT装置をはじめとする電気機器の使用は禁忌である。","tags":"防爆;可燃性ガス;検査室環境"},{"id":"SM-11","category":"安全管理","subcategory":"患者安全・体位","question":"寝台移動による点滴ラインやドレーンの抜去を防ぐ対応として適切なのはどれか。","choices":{"a":"ライン類を寝台側面へ長く垂らしたまま移動させる","b":"ライン類の走行と余裕を確認してから移動させる","c":"ライン類をガントリへ固定してから移動させる","d":"ライン類を患者の下に束ねてから移動させる"},"answer":"b","explanation":"寝台の昇降や移動に伴うカテーテル・点滴ライン・ドレーンの予期せぬ抜去を防ぐため、事前にラインの走行経路と十分な余裕を確認することが必須である。","tags":"点滴ライン;ドレーン管理;抜去防止"},{"id":"SM-12","category":"安全管理","subcategory":"患者安全・体位","question":"操作室からCT撮影中の患者を安全に見守る方法として適切なのはどれか。","choices":{"a":"カメラと通話装置で患者の状態を継続観察する","b":"撮影開始後は画像だけで患者の状態を判断する","c":"撮影開始後は扉を閉めて通話装置を停止する","d":"撮影終了まで患者からの合図を受け付けない"},"answer":"a","explanation":"検査中は観察窓や監視カメラ、およびインターホン（通話装置）を用いて、患者の様子や体調変化を継続的にモニタリングする必要がある。","tags":"観察;インターホン;モニタリング"},{"id":"SM-13","category":"安全管理","subcategory":"放射線防護・適応","question":"妊娠の可能性がある患者のCT検査への対応として適切なのはどれか。","choices":{"a":"必要性と胎児線量を評価し撮影条件を最適化する","b":"妊娠の可能性があれば部位を問わず一律中止する","c":"本人が希望すれば医学的必要性を問わず実施する","d":"腹部を外せば妊娠確認をせず通常条件で実施する"},"answer":"a","explanation":"妊婦または妊娠の可能性がある患者に対するCT検査では、検査の医学的必要性と胎児被ばく線量を十分に評価し、必要に応じて線量低減などの最適化を図る。","tags":"妊婦;胎児線量;最適化"},{"id":"SM-14","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"死亡時画像診断であるAiの説明として適切なのはどれか。","choices":{"a":"死後に血液検査だけを用いて死因などを推定する手法","b":"死後に病理標本だけを用いて死因などを推定する手法","c":"死後に画像検査を用いて死因などを検討する手法","d":"死後に心電図だけを用いて死亡時刻を推定する手法"},"answer":"c","explanation":"Ai（Autopsy Imaging：死亡時画像診断）とは、死亡後にCTやMRIなどの画像診断装置を用いて体内の状況を撮影し、死因究明や病態把握に役立てる手法である。","tags":"Ai;死亡時画像診断;死因究明"},{"id":"SM-15","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"Aiの診断上の位置付けとして適切なのはどれか。","choices":{"a":"Aiだけで全ての感染症を常に確定診断できる","b":"Aiだけで全ての中毒死を常に確定診断できる","c":"Aiだけで全ての症例の死亡時刻を確実に判定できる","d":"Aiには限界があり解剖などを補完する役割がある"},"answer":"d","explanation":"Aiは死因究明に有用であるが、画像情報のみでは限界があるため、肉眼的な解剖（病理解剖や司法解剖）を補完・支援する位置付けとして行われる。","tags":"Aiの位置付け;剖検補完;診断限界"},{"id":"SM-16","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"院内で通常のAIを実施する際の遺族への対応として適切なのはどれか。","choices":{"a":"撮影終了後に遺族へ実施目的だけを通知する","b":"事前に遺族へ十分説明し承諾書を取得する","c":"検査担当者の判断だけで承諾なく実施する","d":"口頭説明を省略して画像提供だけを約束する"},"answer":"b","explanation":"通常の死亡時画像診断（Ai）を行う際は、事前にご遺族に対して検査の目的や内容について十分な説明を行い、同意（承諾書）を得る必要がある。","tags":"遺族説明;承諾書;インフォームド・コンセント"},{"id":"SM-17","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"Aiの院内運用を整備する際に明確化すべき事項はどれか。","choices":{"a":"受付順だけを基準に実施者をその都度決定する","b":"当直者だけを基準に許可者をその都度決定する","c":"装置空きだけを基準に指示者をその都度決定する","d":"実施決定者と指示系統を手順書で明確にする"},"answer":"d","explanation":"院内でAiを安全かつ円滑に実施するためには、実施の決定権者や関係部署間の指示系統、運用手順をあらかじめ院内手順書等で明確にしておく必要がある。","tags":"運用手順;指示系統;ガバナンス"},{"id":"SM-18","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"Aiの遺体をCT室へ搬入する前の感染対策として適切なのはどれか。","choices":{"a":"搬入前に感染情報を確認し必要な予防策を講じる","b":"撮影後に感染情報を確認し必要なら記録を消去する","c":"搬入時は感染情報にかかわらず防護具を用いない","d":"遺体は感染源にならないため通常の清掃を省略する"},"answer":"a","explanation":"遺体であっても感染症の伝播リスクがあるため、搬入前に感染症の有無や情報を事前に確認し、標準予防策および必要に応じた感染対策を講じる。","tags":"遺体搬入;感染確認;標準予防策"},{"id":"SM-19","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"医療事故調査を目的とするAiで、チューブ類と体位を扱う方法として適切なのはどれか。","choices":{"a":"チューブを全て抜去して標準体位へ大きく動かす","b":"チューブを残し搬入された状態を保って撮像する","c":"チューブを短く切断して両上肢を必ず挙上する","d":"チューブを入れ替えて腹臥位を優先して撮像する"},"answer":"b","explanation":"医療事故調査を目的とするAiでは、死亡時の状況や医療行為との関連性を検証するため、チューブ類や医療器具などを抜去せず、搬入された状態（現状保持）のまま撮像することが極めて重要である。","tags":"医療事故調査;現状維持;チューブ管理"},{"id":"SM-20","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"医療事故調査制度に関連するAiの撮像時期として適切なのはどれか。","choices":{"a":"調査開始まで冷蔵保管しチューブを抜いて撮像する","b":"蘇生記録完成まで待機し標準体位にして撮像する","c":"死亡確認後できるだけ早く現状を保って撮像する","d":"解剖終了後に残存臓器だけを選んで撮像する"},"answer":"c","explanation":"医療事故調査におけるAiは、死後の身体的変化や証拠隠滅・変容を防ぐため、死亡確認後できるだけ速やかに現状を保持した状態で実施することが求められる。","tags":"撮像時期;早期実施;現状保持"},{"id":"SM-21","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"医療事故調査制度に関連するAiのデータ保存として適切なのはどれか。","choices":{"a":"代表的なモニタ画面の写真だけを調査完了まで保管する","b":"薄いスライスのボリュームデータを調査完了まで保管する","c":"画像処理後の三次元画像だけを調査完了まで保管する","d":"読影後の報告書と数枚の画像だけを調査完了まで保管する"},"answer":"b","explanation":"医療事故調査等の事後検証に対応するため、再構成や詳細な解析が可能な薄いスライスのボリュームデータを調査完了まで確実に保存する必要がある。","tags":"ボリュームデータ;データ保存;薄いスライス"},{"id":"SM-22","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"Aiの撮像条件を安全かつ安定して運用する方法として適切なのはどれか。","choices":{"a":"生体の胸部低線量条件だけを全Ai症例に流用する","b":"装置の工場出荷条件だけを全Ai症例に流用する","c":"依頼医の口頭条件だけを全症例にそのまま流用する","d":"Ai専用の撮像プロトコルをあらかじめ整備する"},"answer":"d","explanation":"安定した画質と適切な線量・管球負荷管理を行うため、Ai撮影専用のプロトコルをあらかじめ施設内で整備・登録しておくことが適切である。","tags":"専用プロトコル;撮像条件;標準化"},{"id":"SM-23","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"Ai撮影終了後の検査室管理として適切なのはどれか。","choices":{"a":"撮影後は画像保存だけを行い清掃は翌日に回す","b":"撮影後は寝台を乾拭きし消毒剤は一切使わない","c":"撮影後は汚染に応じて装置と検査室を清拭消毒する","d":"撮影後は室内を長時間密閉し換気や臭気対策を行わない"},"answer":"c","explanation":"Ai撮影終了後は、体液や血液等の汚染状況や感染症情報に応じて、CT装置の寝台やガントリ表面、検査室内の適切な清拭および消毒を行う。","tags":"清拭消毒;環境整備;感染対策"},{"id":"SM-24","category":"安全管理","subcategory":"死亡時画像診断(Ai)","question":"臨床用CT装置でAiを実施する際の装置運用として適切なのはどれか。","choices":{"a":"画質とX線管負荷を考慮し臨床業務に配慮する","b":"被ばくがないため装置上限で連続撮影を続ける","c":"遺体撮影後は冷却せず直ちに高負荷撮影を行う","d":"生体用装置でも保守状況を確認せず連続使用する"},"answer":"a","explanation":"生体用兼用などの臨床用CT装置で遺体撮影（Ai）を行う際は、高負荷な条件によるX線管球への影響やその後の臨床業務への支障を考慮して運用する。","tags":"臨床用装置;管球負荷;運用配慮"},{"id":"SM-25","category":"安全管理","subcategory":"患者安全・体位","question":"放射線検査での患者取り違えを防ぐ確認方法として適切なのはどれか。","choices":{"a":"呼び出した姓への返事だけで本人確認を完了する","b":"検査室の入室時刻だけで本人確認を完了する","c":"本人の名乗りと予約票などを照合して確認する","d":"病室番号と検査部位だけで本人確認を完了する"},"answer":"c","explanation":"患者誤認（取り違え）を確実に防止するため、スタッフの呼びかけに対する返答だけでなく、患者本人にフルネームを名乗ってもらい、予約票やIDバンド等と照合する。","tags":"本人確認;取り違え防止;照合"},{"id":"SM-26","category":"安全管理","subcategory":"患者安全・体位","question":"CT検査前の説明に含める内容として適切なのはどれか。","choices":{"a":"装置名と検査時刻だけを示し質問を受け付ける","b":"目的と利益やリスクを示し質問の機会を設ける","c":"撮影条件と画像枚数だけを示し署名を求める","d":"費用と待ち時間だけを示し意思確認を省略する"},"answer":"b","explanation":"検査前説明では、検査の目的、期待される臨床的利益、予想されるリスクや副作用などを分かりやすく説明し、患者からの質問に答える機会を設ける。","tags":"インフォームド・コンセント;説明内容;リスク説明"},{"id":"SM-27","category":"安全管理","subcategory":"患者安全・体位","question":"CT検査における同意の考え方として適切なのはどれか。","choices":{"a":"同意は説明と意思確認を続ける過程として扱う","b":"同意書があれば検査内容の変更説明を省略する","c":"一度署名すれば患者は撤回できないものと扱う","d":"口頭説明がなくても署名だけで同意成立と扱う"},"answer":"a","explanation":"医療における同意（インフォームド・コンセント）は、一度の書類署名で完結するものではなく、十分な説明と患者の自発的な意思確認を継続するプロセスとして捉える。","tags":"同意のプロセス;意思確認;撤回可能"},{"id":"SM-28","category":"安全管理","subcategory":"造影剤安全管理","question":"造影CT前の問診項目として優先度が高いものはどれか。","choices":{"a":"造影CT前は食事時刻と睡眠時間だけを確認する","b":"造影CT前は身長と利き手だけを確認する","c":"造影CT前は視力と聴力だけを確認する","d":"造影CT前は副作用歴と腎機能などを確認する"},"answer":"d","explanation":"ヨード造影剤を用いたCT検査の安全性を確保するため、過去の造影剤副作用歴（アレルギー歴）や現在の腎機能、喘息の有無などの問診が極めて重要である。","tags":"問診項目;副作用歴;腎機能"},{"id":"SM-29","category":"安全管理","subcategory":"造影剤安全管理","question":"過去にヨード造影剤で重篤な反応があった患者への対応として適切なのはどれか。","choices":{"a":"重篤な造影剤反応歴を共有し実施可否を評価する","b":"重篤な造影剤反応歴を伏せて通常どおり注入する","c":"重篤な造影剤反応歴を撮影後に依頼医へ報告する","d":"重篤な造影剤反応歴を本人の不安だけと判断する"},"answer":"a","explanation":"過去に重篤な造影剤副反応（アナフィラキシーショック等）の既往がある場合は、その情報を多職種間で共有し、検査実施の是非や代替検査の検討を慎重に行う。","tags":"ヨード造影剤;重篤反応;実施可否評価"},{"id":"SM-30","category":"安全管理","subcategory":"患者安全・体位","question":"患者本人に同意能力がない場合の対応として適切なのはどれか。","choices":{"a":"担当技師が代諾者となり単独で実施を決定する","b":"受付職員が代諾者となり単独で実施を決定する","c":"緊急性と施設手順に従い代諾や実施可否を判断する","d":"同意能力がなければ緊急で必要な検査も一律に中止する"},"answer":"c","explanation":"患者本人に判断能力（同意能力）がない場合は、法的・倫理的な代諾者（家族等）の同意や、施設の緊急時対応手順に則った適切な判断・対応を行う。","tags":"同意能力;代諾者;緊急検査"},{"id":"SM-31","category":"安全管理","subcategory":"患者安全・体位","question":"言語や聴覚に障害がある患者への検査説明として適切なのはどれか。","choices":{"a":"説明を短縮し理解確認をせず同意書だけを渡す","b":"通訳や補助資料を用いて本人の理解を確認する","c":"同伴者だけに説明し本人への情報提供を省略する","d":"専門用語だけで説明し質問時間を設けず終了する"},"answer":"b","explanation":"意思疎通に配慮が必要な患者に対しては、手話通訳、筆談、分かりやすい補助資料などを活用して本人の理解度を確認しながら説明を行う。","tags":"コミュニケーション;補助資料;理解確認"},{"id":"SM-32","category":"安全管理","subcategory":"患者安全・体位","question":"認知機能低下や鎮静がある患者の検査台からの転落を防ぐ方法として適切なのはどれか。","choices":{"a":"鎮静患者を寝台に乗せた後は一人で待機させる","b":"認知機能の情報を共有せず技師だけで判断する","c":"転落歴があっても固定具を用いず寝台から長く目を離す","d":"転落リスクを共有し適切に固定して観察を継続する"},"answer":"d","explanation":"転落・転倒リスクの高い患者（認知機能低下や鎮静状態）に対しては、安全帯や固定ベルトの活用、スタッフの付き添いなどにより万全の転落防止策を講じる。","tags":"転落防止;固定具;安全観察"},{"id":"SM-33","category":"安全管理","subcategory":"造影剤安全管理","question":"造影剤の血管外漏出が疑われた直後の対応として適切なのはどれか。","choices":{"a":"注入を続けながら腫脹部を強く圧迫して観察する","b":"注入を続けながら撮影を優先し検査後に評価する","c":"注入を止めず穿刺針を深く進めて状態を確認する","d":"注入を停止し患肢を評価して院内手順で対応する"},"answer":"d","explanation":"造影剤の血管外漏出が認められた、または疑われた場合は、直ちに自動注入器の稼働および造影剤の注入を停止し、患部の状況を評価の上、施設の手順に従って処置を行う。","tags":"血管外漏出;注入停止;初期対応"},{"id":"SM-34","category":"安全管理","subcategory":"患者安全・体位","question":"人工呼吸器管理中の患者をCT寝台へ移乗する際の対応として適切なのはどれか。","choices":{"a":"移乗前に全ラインを外し再接続確認を省略する","b":"移乗前後にルートと接続部を複数人で確認する","c":"移乗中はラインを牽引し張力で位置を保つ","d":"移乗後は装置画像だけでチューブ位置を判断する"},"answer":"b","explanation":"人工呼吸器や各種カテーテルを装着した重症患者の移乗では、抜去や回路外れを防ぐため、移動前後に医師や看護師ら複数人でルートや接続部の安全性・位置を厳重に確認する。","tags":"人工呼吸器;移乗時確認;複数人チェック"},{"id":"SM-35","category":"安全管理","subcategory":"医療安全・インシデント","question":"患者への影響が生じる前に発見されたCT検査の誤りへの対応として適切なのはどれか。","choices":{"a":"患者影響がなければ記憶だけに留め報告しない","b":"発生者の経験年数だけを記録して共有しない","c":"未然に防げた事例も報告し再発防止に活用する","d":"同種事故が起きるまで部署内の検討を行わない"},"answer":"c","explanation":"患者に実際の被害が生じなかったヒヤリハット（ニアミス）事例であっても、積極的にインシデントレポートとして報告し、組織的な再発防止策の立案に活用する。","tags":"ヒヤリハット;未然防止;インシデント報告"},{"id":"SM-36","category":"安全管理","subcategory":"医療安全・インシデント","question":"CT室で発生したアクシデントの原因分析として適切なのはどれか。","choices":{"a":"個人だけでなく手順や環境などの背景要因を分析する","b":"当事者の注意力だけを原因として個人への処分を優先する","c":"結果の重大さだけを原因として現場での検証を中止する","d":"報告件数の多さだけを原因として一律の対策を決定する"},"answer":"a","explanation":"医療事故やアクシデントの分析においては、個人の不注意として片付けるのではなく、作業手順、コミュニケーション、環境、システム上の背景要因を多角的に分析する。","tags":"原因分析;背景要因;システムエラー"},{"id":"SM-37","category":"安全管理","subcategory":"医療安全・インシデント","question":"造影剤や患者情報をダブルチェックする方法として有効なのはどれか。","choices":{"a":"一人目の確認結果を読み上げて同じ判断をなぞる","b":"別の確認者が元情報から独立して内容を照合する","c":"二人が同じ画面を見て相談しながら一度だけ確認する","d":"経験年数の長い一人が記憶に基づいて最終確認する"},"answer":"b","explanation":"ダブルチェックの効果を最大限に高めるためには、一方の確認に引きずられないよう、別の作業者が元データを用いて独立して照合・確認を行うことが重要である。","tags":"ダブルチェック;独立照合;誤認防止"},{"id":"SM-38","category":"安全管理","subcategory":"医療安全・インシデント","question":"CT検査の確認漏れを減らす仕組みとして適切なのはどれか。","choices":{"a":"重要項目を標準化しチェックリストで確認する","b":"担当者ごとに確認項目を自由に増減して運用する","c":"繁忙時だけ確認項目を省略して検査を優先する","d":"異常時だけ手順書を作成して平時は使用しない"},"answer":"a","explanation":"検査手順におけるヒューマンエラーや確認漏れを防止するため、チェックリストを用いて重要項目を標準化し、確実な確認を行う仕組みを構築する。","tags":"チェックリスト;標準化;確認漏れ防止"},{"id":"SM-39","category":"安全管理","subcategory":"感染対策","question":"標準予防策の対象として適切なのはどれか。","choices":{"a":"感染症名が確定した患者だけに適用する予防策","b":"接触感染が疑われる患者だけに適用する予防策","c":"免疫不全が判明した患者だけに適用する予防策","d":"全ての患者に共通して適用する基本的な予防策"},"answer":"d","explanation":"標準予防策（スタンダードプリコーション）は、感染症の有無にかかわらず、すべての患者の血液、体液、分泌物、排泄物などを感染の可能性があるものとして取り扱う基本原則である。","tags":"標準予防策;全患者対象;ユニバーサルプレコーション"},{"id":"SM-40","category":"安全管理","subcategory":"感染対策","question":"CT検査で手袋を使用した場合の手指衛生として適切なのはどれか。","choices":{"a":"手袋を外した後は手指衛生を毎回省略してよい","b":"手袋に破損がなければ患者ごとに交換しなくてよい","c":"手袋の使用にかかわらず必要な時点で手指衛生を行う","d":"手袋の上から消毒すれば同じ手袋を連続使用してよい"},"answer":"c","explanation":"医療用手袋の着用は手指衛生の代わりにはならないため、手袋を外した後は必ず手指衛生を行い、必要なタイミングで適切な手指消毒を実施する。","tags":"手指衛生;手袋着用;感染予防"},{"id":"SM-41","category":"安全管理","subcategory":"感染対策","question":"CT室で使用する個人防護具の選び方として適切なのはどれか。","choices":{"a":"全患者に同じ防護具を一律に重ねて着用する","b":"感染症名だけで防護具を固定し手技を考虑しない","c":"予測される血液や体液への曝露に応じて選択する","d":"防護具の在庫量だけを基準に着用の要否を決める"},"answer":"c","explanation":"個人防護具（PPE）は、患者の感染症の診断名だけでなく、医療従事者が直面する血液、体液、排泄物などの曝露リスクや手技の性質に応じて適切に選択する。","tags":"個人防護具;曝露予測;PPE選択"},{"id":"SM-42","category":"安全管理","subcategory":"感染対策","question":"接触予防策が必要な患者のCT検査で適切な対応はどれか。","choices":{"a":"患者退出後も寝台などの接触面を清拭消毒しない","b":"手袋だけを着けてガウンや手指衛生を省略する","c":"装置を共用しても患者間の清掃や消毒を行わない","d":"手袋とガウンを用い環境表面を清掃消毒する"},"answer":"d","explanation":"接触感染経路別予防策が必要な患者の検査では、手袋やガウンを適切に着用し、患者が触れた寝台や装置周辺の接触面を速やかに清拭・消毒する。","tags":"接触予防策;環境消毒;ガウン"},{"id":"SM-43","category":"安全管理","subcategory":"感染対策","question":"飛沫予防策が必要な患者をCT撮影する際の対応として適切なのはどれか。","choices":{"a":"患者にマスクを促し医療者はサージカルマスクを用いる","b":"患者にはマスクを外させ医療者は手袋だけを着用する","c":"患者を共用待合に待機させ医療者はガウンだけを着用する","d":"患者に咳を促し医療者は眼の防護具だけを着用する"},"answer":"a","explanation":"飛沫感染対策が必要な患者に対しては、患者へのマスク着用協力や、医療者によるサージカルマスク等の着用をはじめとする適切な飛沫予防策を講じる。","tags":"飛沫予防策;マスク着用;サージカルマスク"},{"id":"SM-44","category":"安全管理","subcategory":"感染対策","question":"空気予防策が必要な患者をCT撮影する際の対応として適切なのはどれか。","choices":{"a":"サージカルマスクだけを着用し換気を止めて対応する","b":"N95等の呼吸用防護具を用い換気にも配慮する","c":"手袋だけを着用し患者を共用待合で長く待機させる","d":"ガウンだけを着用し検査後すぐ次患者を入室させる"},"answer":"b","explanation":"空気感染対策（結核や麻しんなど）が必要な患者の検査では、医療者はN95等の呼吸用防護具を着用し、検査室の換気や滞留時間に十分配慮して運用する。","tags":"空気予防策;N95マスク;換気"},{"id":"SM-45","category":"安全管理","subcategory":"感染対策","question":"CT寝台やガントリ表面を消毒する際の対応として適切なのはどれか。","choices":{"a":"装置の材質適合性と手順を確認して清掃消毒する","b":"汚れの有無にかかわらず高濃度薬剤へ浸漬する","c":"電子部品を含む装置全体へ消毒液を直接噴霧する","d":"製造元の指示を確認せず任意の薬剤を混合使用する"},"answer":"a","explanation":"CT装置の清掃・消毒を行う際は、装置の故障や劣化を防ぐため、メーカーが指定する材質適合性や正しい消毒手順を確認した上で実施する。","tags":"表面消毒;材質適合性;清拭"},{"id":"SM-46","category":"安全管理","subcategory":"感染対策","question":"造影CTで使用した注射針の廃棄方法として適切なのはどれか。","choices":{"a":"使用済み針を両手で再びリキャップして机上に置く","b":"使用済み針をリキャップせず耐貫通容器へ廃棄する","c":"使用済み針を折り曲げて一般廃棄物へ廃棄する","d":"使用済み針を手渡しして後でまとめて廃棄する"},"answer":"b","explanation":"針刺し事故を防止するため、使用済みの注射針は原則としてリキャップ（蓋のし直し）を行わず、直ちに専用の耐貫通性容器に廃棄する。","tags":"注射針廃棄;リキャップ禁止;耐貫通容器"},{"id":"SM-47","category":"安全管理","subcategory":"装置管理・法令","question":"CT装置の始業点検として適切なのはどれか。","choices":{"a":"業務終了後に装置外観とエラー履歴を確認する","b":"故障発生後に初めて基本動作と安全機能を確認する","c":"検査開始前に外観と基本動作や校正状態を確認する","d":"定期点検時だけ寝台動作と通話機能を確認する"},"answer":"c","explanation":"安全かつ正確な検査を担保するため、毎日の検査開始前（始業時）に、装置の外観、基本動作、安全機構、およびキャリブレーション（校正）状態等の点検を行う。","tags":"始業点検;基本動作;校正状態"},{"id":"SM-48","category":"安全管理","subcategory":"装置管理・法令","question":"CT装置の終業点検として適切なのはどれか。","choices":{"a":"使用件数だけを集計し装置状態の記録を省略する","b":"電源を入れたまま清掃せず翌日の担当者へ任せる","c":"エラーがあっても記録せず再起動だけで終了する","d":"汚染や異常を確認し清掃と記録を行って終了する"},"answer":"d","explanation":"一日の業務終了時（終業時）には、装置の汚染や異常の有無を確認して適切な清拭・清掃を行い、点検結果や稼働状況を記録して終了する。","tags":"終業点検;清掃;装置記録"},{"id":"SM-49","category":"安全管理","subcategory":"装置管理・法令","question":"CT装置に付属する精度管理用ファントムの主な用途はどれか。","choices":{"a":"患者ごとの造影到達時間と撮影開始時刻を決定するために用いる","b":"CT値やノイズや均一性の経時変化を確認するために用いる","c":"患者ごとの心拍変動と心電同期位相を補正するために用いる","d":"造影剤注入器の圧力上限と注入速度を校正するために用いる"},"answer":"b","explanation":"精度管理用ファントムは、CT値の精度、画像ノイズ、および均一性（ユニフォーミティ）などの画質特性における経時的変動や異常を評価するために用いられる。","tags":"精度管理用ファントム;CT値;ノイズ評価"},{"id":"SM-50","category":"安全管理","subcategory":"装置管理・法令","question":"2026年時点でCT装置の受入試験に用いる現行JISとして適切なのはどれか。","choices":{"a":"JIS Z 4752-3-5:2021を受入試験と不変性試験に用いる","b":"JIS Z 4752-2-6:2012を受入試験と不変性試験に用いる","c":"JIS Z 4915:1974を受入試験と不変性試験に用いる","d":"JIS T 0601-1:2017を受入試験と不変性試験に用いる"},"answer":"a","explanation":"X線コンピュータ断層撮影装置（CT）の受入試験および不変性試験に関する現行のJIS規格としては「JIS Z 4752-3-5:2021」が規定されている。","tags":"受入試験;JIS規格;不変性試験"},{"id":"HN-01","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"単純頭部CTにおける正常な灰白質と白質の吸収差について正しいのはどれか。","choices":{"a":"白質は灰白質より高い吸収を示す","b":"両者は同程度の吸収として描出される","c":"灰白質は白質より高い吸収を示す","d":"髄液は灰白質より高い吸収を示す"},"answer":"c","explanation":"灰白質は白質よりCT値（吸収）が高い。","tags":"脳組織;正常解剖"},{"id":"HN-02","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"基底核レベルの横断像における尾状核頭の位置として正しいのはどれか。","choices":{"a":"尾状核頭は側脳室前角の外側にある","b":"被殻は第三脳室の内側壁に接している","c":"淡蒼球は視床の後内側に位置している","d":"視床は側脳室下角の外側壁に接している"},"answer":"a","explanation":"尾状核頭は側脳室前角の外側に位置する。","tags":"基底核;正常解剖"},{"id":"HN-03","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"内包後脚と周囲の灰白質との位置関係として正しいのはどれか。","choices":{"a":"内側に被殻、外側に尾状核頭がある","b":"内側に淡蒼球、外側に視床がある","c":"内側に尾状核、外側に被殻がある","d":"内側に視床、外側にレンズ核がある"},"answer":"d","explanation":"内包後脚の内側は視床、外側はレンズ核（被殻・淡蒼球）である。","tags":"内包;正常解剖"},{"id":"HN-04","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"頭蓋内の正常な硬膜構造と区画との関係として正しいのはどれか。","choices":{"a":"大脳鎌は側頭葉と小脳半球を分けている","b":"小脳テントは後頭葉と小脳を分けている","c":"鞍隔膜は左右の大脳半球を分けている","d":"透明中隔は橋と延髄の境界を分けている"},"answer":"b","explanation":"小脳テントは後頭蓋窩と大脳を分ける構造である。","tags":"硬膜;正常解剖"},{"id":"HN-05","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"第四脳室の正常な解剖学的位置として正しいのはどれか。","choices":{"a":"第四脳室は橋の後方と小脳の前方にある","b":"第四脳室は視床の外側と被殻の内側にある","c":"第四脳室は脳梁の上方と大脳鎌の下方にある","d":"第四脳室は眼窩の後方と側頭葉の前方にある"},"answer":"a","explanation":"第四脳室は脳幹（橋・延髄）の後方、小脳の前方に位置する。","tags":"脳室;正常解剖"},{"id":"HN-06","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"眼窩内における視神経の正常な走行として正しいのはどれか。","choices":{"a":"視神経は眼球後方の筋円錐外を走行する","b":"視神経は眼球前方の硝子体内を走行する","c":"視神経は眼球後方の筋円錐内を走行する","d":"視神経は眼窩外側壁の骨内だけを走行する"},"answer":"c","explanation":"視神経は眼球後方の筋円錐内を走行する。","tags":"眼窩;視神経"},{"id":"HN-07","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"上顎洞の自然排泄路について正しいのはどれか。","choices":{"a":"上顎洞自然口は上鼻道へ開口する","b":"上顎洞自然口は中鼻道へ開口する","c":"上顎洞自然口は下鼻道へ開口する","d":"上顎洞自然口は蝶篩陥凹へ開口する"},"answer":"b","explanation":"上顎洞自然口は中鼻道（半月裂孔）へ開口する。","tags":"副鼻腔;上顎洞"},{"id":"HN-08","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"中耳の耳小骨を外側から内側へ並べた順序として正しいのはどれか。","choices":{"a":"アブミ骨、キヌタ骨、ツチ骨の順である","b":"キヌタ骨、ツチ骨、アブミ骨の順である","c":"ツチ骨、アブミ骨、キヌタ骨の順である","d":"ツチ骨、キヌタ骨、アブミ骨の順である"},"answer":"d","explanation":"外側からツチ骨、キヌタ骨、アブミ骨の順で並ぶ。","tags":"耳小骨;中耳"},{"id":"HN-09","category":"脳神経・頭頚部領域CT","subcategory":"アーチファクト","question":"歯科金属によるストリークアーチファクトの軽減に有用な方法はどれか。","choices":{"a":"表示FOVだけを極端に縮小して再構成する","b":"金属低減再構成を適用して画像を作成する","c":"スライス厚だけを極端に薄くして再構成する","d":"管電流だけを可能な限り低下させて撮影する"},"answer":"b","explanation":"金属低減再構成（MAR: Metal Artifact Reduction）が有用である。","tags":"歯科金属;再構成"},{"id":"HN-10","category":"脳神経・頭頚部領域CT","subcategory":"正常解剖","question":"頸動脈間隙に含まれる構造の組み合わせとして正しいのはどれか。","choices":{"a":"内頸動脈と内頸静脈が含まれる","b":"下顎神経と咀嚼筋群だけが含まれる","c":"耳下腺管と顔面動脈だけが含まれる","d":"甲状腺と反回神経だけが含まれる"},"answer":"a","explanation":"頸動脈間隙には内頸動脈、内頸静脈、迷走神経が含まれる。","tags":"頸部;頸動脈"},{"id":"HN-11","category":"脳神経・頭頚部領域CT","subcategory":"頭頸部疾患","question":"咽後部の深頸部感染が重篤な縦隔炎を起こしうる理由はどれか。","choices":{"a":"頭蓋内へ血管内だけを介して広がるため","b":"甲状腺内へ導管だけを介して広がるため","c":"危険間隙を介して縦隔へ波及しうるため","d":"耳下腺内へ神経だけを介して広がるため"},"answer":"c","explanation":"咽後部から危険間隙（Danger space）を介して縦隔へ感染が広がる。","tags":"頸部;感染"},{"id":"HN-12","category":"脳神経・頭頚部領域CT","subcategory":"頭頸部疾患","question":"喉頭癌の深部進展評価で、脂肪組織の消失や置換が重要となる間隙はどれか。","choices":{"a":"頬脂肪体を含む頬間隙","b":"咀嚼筋群を含む咀嚼筋間隙","c":"椎体前方にある咽後間隙","d":"声門周囲にある傍声門間隙"},"answer":"d","explanation":"傍声門間隙は脂肪組織を含み、喉頭癌の進展評価に重要である。","tags":"喉頭;腫瘍"},{"id":"HN-13","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"急性硬膜外血腫の典型的な単純CT所見はどれか。","choices":{"a":"両凸レンズ状で頭蓋縫合を越えにくい","b":"三日月状で大脳鎌を越えて広がりやすい","c":"脳溝に沿って左右対称に広がりやすい","d":"脳室内に限局して液面を形成しやすい"},"answer":"a","explanation":"硬膜外血腫は両凸レンズ状で、縫合部で制限されることが多い。","tags":"頭部外傷;血腫"},{"id":"HN-14","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"急性硬膜下血腫の典型的な単純CT所見はどれか。","choices":{"a":"両凸レンズ状で頭蓋縫合を越えにくい","b":"三日月状で頭蓋縫合を越えることがある","c":"脳槽中心で脳溝へ左右対称に広がりやすい","d":"基底核中心で脳室へ穿破して広がりやすい"},"answer":"b","explanation":"硬膜下血腫は三日月状で、縫合を越えて広がりやすい。","tags":"頭部外傷;血腫"},{"id":"HN-15","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"発症早期のくも膜下出血に典型的な単純CT所見はどれか。","choices":{"a":"白質内に広がる低吸収域として現れる","b":"硬膜外に生じる両凸高吸収域として現れる","c":"脳室周囲に沿う低吸収帯として現れる","d":"脳槽や脳溝に沿う高吸収域として現れる"},"answer":"d","explanation":"くも膜下出血は脳槽や脳溝の高吸収域として認められる。","tags":"くも膜下出血;脳出血"},{"id":"HN-16","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"高血圧性脳出血の好発部位の組み合わせはどれか。","choices":{"a":"前頭葉皮質、脳梁、松果体、下垂体","b":"側頭葉皮質、海馬、尾状核、脳弓","c":"被殻、視床、橋、小脳","d":"脳室脈絡叢、透明中隔、脳梁、海馬"},"answer":"c","explanation":"高血圧性脳出血の好発部位は被殻、視床、橋、小脳である。","tags":"脳出血;好発部位"},{"id":"HN-17","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"脳内血腫の単純CT濃度が一般に示す時間的変化はどれか。","choices":{"a":"発症直後から低吸収となり短時間で消失する","b":"発症直後は等吸収で翌日から石灰化する","c":"急性期は高吸収で経時的に低吸収化する","d":"急性期は脂肪濃度で経時的に高吸収化する"},"answer":"c","explanation":"急性期の血腫は高吸収であり、時間経過とともに低吸収に変化する。","tags":"脳出血;CT濃度"},{"id":"HN-18","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"中大脳動脈領域の急性脳梗塞でみられる島皮質徴候はどれか。","choices":{"a":"島皮質の灰白質白質境界が不明瞭となる","b":"小脳扁桃が均一な高吸収域を呈する","c":"脳底槽がびまん性の高吸収域を呈する","d":"側脳室が対称性に急速拡大して描出される"},"answer":"a","explanation":"島皮質の灰白質白質境界の不明瞭化は超急性期梗塞のサインである。","tags":"脳梗塞;虚血"},{"id":"HN-19","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"単純CTのASPECTSにおける点数と早期虚血変化の関係はどれか。","choices":{"a":"出血量が増えるほど点数は低下する","b":"虚血領域が増えるほど点数は低下する","c":"側副血行が増えるほど点数は低下する","d":"脳萎縮が増えるほど点数は低下する"},"answer":"b","explanation":"ASPECTSは虚血領域の広がりをスコア化するもので、虚血が広がるほど減点（低下）する。","tags":"ASPECTS;脳梗塞"},{"id":"HN-20","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"単純CTで認めるhyperdense MCA signが示唆する病態はどれか。","choices":{"a":"中大脳動脈壁の脂肪沈着を示す","b":"上矢状静脈洞内の血栓を示す","c":"造影剤の脳槽内漏出を示す","d":"中大脳動脈内の血栓を示す"},"answer":"d","explanation":"Hyperdense MCA signは、MCA内の急性血栓を示唆する。","tags":"脳梗塞;血栓"},{"id":"HN-21","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"急性脳卒中で最初に単純頭部CTを行う主要な目的はどれか。","choices":{"a":"頭蓋内出血を迅速に除外する","b":"梗塞中心を正確に容積測定する","c":"頸動脈狭窄率を直接測定する","d":"側副血行の時間変化を評価する"},"answer":"a","explanation":"急性期脳卒中での単純CTの第一目的は出血の除外である。","tags":"脳卒中;急性期"},{"id":"HN-22","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"急性脳主幹動脈閉塞で多時相CTAを用いる利点はどれか。","choices":{"a":"脳実質内の石灰化量を時間的に評価できる","b":"髄液圧の変化を画像から直接測定できる","c":"梗塞組織の病理型を撮影中に確定できる","d":"側副血行の時間変化を観察できる"},"answer":"d","explanation":"多時相CTAは側副血行路の充盈動態を時間的に評価できる。","tags":"CTA;側副血行"},{"id":"HN-23","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"CTPの中心容積原理におけるCBV、CBF、MTTの関係はどれか。","choices":{"a":"CBFはCBVとMTTの積で表される","b":"CBVはCBFをMTTで割って表される","c":"MTTはCBVをCBFで割って表される","d":"TmaxはCBVとCBFの和で表される"},"answer":"c","explanation":"中心容積原理：CBF = CBV / MTT であるため、MTT = CBV / CBF となる。","tags":"CTP;中心容積原理"},{"id":"HN-24","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"CTP解析で動脈入力関数を設定する領域として適切なのはどれか。","choices":{"a":"造影の遅い末梢静脈を選択する","b":"造影の明瞭な流入動脈を選択する","c":"壊死を含む脳実質領域を選択する","d":"石灰化を含む脳槽領域を選択する"},"answer":"b","explanation":"動脈入力関数（AIF）は造影の明瞭な流入動脈から設定する。","tags":"CTP;AIF"},{"id":"HN-25","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"虚血性ペナンブラに典型的なCTP所見の組み合わせはどれか。","choices":{"a":"CBF上昇、MTT短縮、CBV低下","b":"CBF低下、MTT延長、CBV保持","c":"CBF正常、MTT短縮、CBV低下","d":"CBF低下、MTT短縮、CBV増加"},"answer":"b","explanation":"ペナンブラはCBF低下・MTT延長し、CBVは代償的に保持されている。","tags":"CTP;ペナンブラ"},{"id":"HN-26","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"不可逆的な虚血コアに典型的なCTP所見の組み合わせはどれか。","choices":{"a":"CBF上昇とCBV増加","b":"CBF正常とCBV保持","c":"CBF低下とCBV低下","d":"CBF上昇とCBV低下"},"answer":"c","explanation":"虚血コアではCBF、CBV共に低下する。","tags":"CTP;虚血コア"},{"id":"HN-27","category":"脳神経・頭頚部領域CT","subcategory":"アーチファクト","question":"CTP撮影中に患者の体動が認められた場合の対応として適切なのはどれか。","choices":{"a":"位置合わせ補正を行ってマップを確認する","b":"時間軸を反転してからマップを再計算する","c":"骨条件画像だけを用いてマップを再計算する","d":"造影前画像だけを用いてマップを再計算する"},"answer":"a","explanation":"体動がある場合、位置合わせ（レジストレーション）による補正が必要となる。","tags":"CTP;体動"},{"id":"HN-28","category":"脳神経・頭頚部領域CT","subcategory":"アーチファクト","question":"後頭蓋窩のCTPを解釈する際に注意すべきアーチファクトはどれか。","choices":{"a":"副鼻腔空気による磁化率変化が生じやすい","b":"静磁場不均一による信号欠損が生じやすい","c":"骨表面反射による後方エコーが生じやすい","d":"頭蓋底骨によるビーム硬化が生じやすい"},"answer":"d","explanation":"後頭蓋窩では頭蓋底骨によるビーム硬化アーチファクトが顕著となる。","tags":"CTP;ビーム硬化"},{"id":"HN-29","category":"脳神経・頭頚部領域CT","subcategory":"脳腫瘍","question":"脳腫瘍周囲に生じる血管原性浮腫の典型的なCT分布はどれか。","choices":{"a":"主に灰白質を侵し脳溝に限局する","b":"主に脳室内を満たし液面を形成する","c":"主に白質を侵し指状に広がる","d":"主に硬膜外を走り縫合を越えない"},"answer":"c","explanation":"血管原性浮腫は、主に白質に指状（fingering）に広がる。","tags":"脳腫瘍;浮腫"},{"id":"HN-30","category":"脳神経・頭頚部領域CT","subcategory":"脳腫瘍","question":"被膜形成期の脳膿瘍に典型的な造影CT所見はどれか。","choices":{"a":"均一な脂肪濃度と広範な骨破壊を示す","b":"中心低吸収と薄い輪状増強を示す","c":"びまん性石灰化と対称性脳萎縮を示す","d":"髄液と同濃度で全く増強を示さない"},"answer":"b","explanation":"脳膿瘍は中心が低吸収で、周囲に薄い輪状（リング状）増強効果を示す。","tags":"脳腫瘍;膿瘍"},{"id":"HN-31","category":"脳神経・頭頚部領域CT","subcategory":"脳腫瘍","question":"髄膜腫を支持する典型的なCT所見はどれか。","choices":{"a":"皮質内に発生し均一な骨菲薄化を伴う","b":"脳室内に発生し髄液様濃度だけを示す","c":"白質内に発生し広範な骨融解を伴う","d":"硬膜に接して強く増強し骨過形成を伴う"},"answer":"d","explanation":"髄膜腫は硬膜基部を持ち、均一に造影され、骨過形成（hyperostosis）を伴うことがある。","tags":"脳腫瘍;髄膜腫"},{"id":"HN-32","category":"脳神経・頭頚部領域CT","subcategory":"その他","question":"トルコ鞍部病変の評価においてCTが特に優れる項目はどれか。","choices":{"a":"トルコ鞍周囲の骨性変化の評価","b":"視交叉内の微細な信号変化の評価","c":"下垂体茎の微細な造影動態の評価","d":"海綿静脈洞内の血流速度の評価"},"answer":"a","explanation":"CTは骨構造の評価に優れる。","tags":"下垂体;骨"},{"id":"HN-33","category":"脳神経・頭頚部領域CT","subcategory":"脳腫瘍","question":"急性水頭症に伴う経上衣性浮腫の単純CT所見はどれか。","choices":{"a":"脳溝に沿うびまん性高吸収域","b":"基底核に生じる対称性石灰化域","c":"硬膜外に生じる両凸状高吸収域","d":"脳室周囲に生じる低吸収域"},"answer":"d","explanation":"経上衣性浮腫は脳室周囲の低吸収域として認められる。","tags":"水頭症;脳室"},{"id":"HN-34","category":"脳神経・頭頚部領域CT","subcategory":"頭部外傷","question":"びまん性軸索損傷に対する頭部CTの特徴はどれか。","choices":{"a":"必ず大きな硬膜外血腫を認める","b":"重症でもCT所見が乏しいことがある","c":"頭蓋骨骨折がなければ完全に否定できる","d":"造影CTでのみ脳室拡大として現れる"},"answer":"b","explanation":"びまん性軸索損傷（DAI）は初期CTでは所見が乏しいことが多い。","tags":"頭部外傷;軸索損傷"},{"id":"HN-35","category":"脳神経・頭頚部領域CT","subcategory":"その他","question":"歯科用コーンビームCTの特性として正しいのはどれか。","choices":{"a":"軟部組織コントラストの評価が苦手である","b":"歯槽骨の高空間分解能評価が苦手である","c":"歯根と下顎管の位置評価が苦手である","d":"金属周囲の歯槽形態評価が常に不能である"},"answer":"a","explanation":"コーンビームCTは軟部組織コントラストの解像能が低い。","tags":"歯科;コーンビームCT"},{"id":"HN-36","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"単純CTでくも膜下出血を確認した後に頭部CTAを行う主な目的はどれか。","choices":{"a":"脳脊髄液圧を画像から直接測定する","b":"血腫の組織型を撮影中に病理診断する","c":"破裂原因となる動脈瘤を検索する","d":"神経症状の重症度を画像だけで数値化する"},"answer":"c","explanation":"くも膜下出血の主な原因である動脈瘤の検索がCTAの目的である。","tags":"CTA;脳動脈瘤"},{"id":"HN-37","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"造影CTにおけるempty delta signが示唆する病態はどれか。","choices":{"a":"上矢状静脈洞内の充盈欠損を示す","b":"中大脳動脈壁の石灰化を示す","c":"脳底槽内の造影剤漏出を示す","d":"側脳室内の脂肪沈着を示す"},"answer":"a","explanation":"Empty delta signは脳静脈洞血栓症で見られる所見である。","tags":"脳静脈洞血栓症;CTA"},{"id":"HN-38","category":"脳神経・頭頚部領域CT","subcategory":"脳血管疾患","question":"脳静脈洞血栓症を評価するCT venographyの撮影時相として適切なのはどれか。","choices":{"a":"動脈相より前に無造影だけで撮影する","b":"造影から数十分後の遅延相だけを撮影する","c":"静脈洞が十分に造影される時相で撮影する","d":"呼気停止後に造影せず短時間で撮影する"},"answer":"c","explanation":"静脈相（静脈洞が造影される時相）で撮影する。","tags":"静脈洞;CTV"},{"id":"HN-39","category":"脳神経・頭頚部領域CT","subcategory":"その他","question":"頭部CTで画像ノイズの低減に有用な再構成方法はどれか。","choices":{"a":"最大値投影画像だけを用いて評価する","b":"厚い冠状断画像だけを用いて評価する","c":"生データを補正せず直接表示する","d":"逐次近似再構成を用いて評価する"},"answer":"d","explanation":"逐次近似再構成（ASR）はノイズ低減に有用である。","tags":"再構成;画像処理"},{"id":"HN-40","category":"脳神経・頭頚部領域CT","subcategory":"頭部外傷","question":"少量の急性硬膜下血腫を見落とさないために有用な表示方法はどれか。","choices":{"a":"狭い肺野条件だけで頭蓋内を確認する","b":"広いウインドウ幅でも頭蓋内を確認する","c":"軟部条件を省いて骨条件だけで確認する","d":"造影後画像だけを用いて最終判断する"},"answer":"b","explanation":"広いウインドウ幅で骨と脳の両方を確認することが見落とし防止に繋がる。","tags":"血腫;ウインドウ設定"},{"id":"HN-41","category":"脳神経・頭頚部領域CT","subcategory":"その他","question":"診断に必要な撮影範囲を保ちながら頭部CTの水晶体線量を低減する方法はどれか。","choices":{"a":"眼窩を撮影範囲の中央へ広く含める","b":"水晶体を含む頭尾方向の撮影を追加する","c":"水晶体を直接線から外す角度を選ぶ","d":"眼球上で管電流を意図的に増加させる"},"answer":"c","explanation":"撮影角度を工夫し、水晶体への直接曝射を避けることが有効である。","tags":"被曝;線量低減"},{"id":"HN-42","category":"脳神経・頭頚部領域CT","subcategory":"小児CT","question":"小児頭部CTの放射線防護として適切な方法はどれか。","choices":{"a":"成人と同一の条件で検査を反復する","b":"最大管電流で頭部全体を反復撮影する","c":"位置決めを省いて撮影範囲を拡大する","d":"体格に合わせて線量と範囲を調整する"},"answer":"d","explanation":"小児の放射線防護では体格に応じた適切な線量設定が必要である。","tags":"被曝;小児"},{"id":"HN-43","category":"脳神経・頭頚部領域CT","subcategory":"頸部血管","question":"頸部CTAで頸動脈内の良好な造影を得るために有用な方法はどれか。","choices":{"a":"造影剤注入前に静脈相だけを撮影する","b":"ボーラストラッキングで時相を合わせる","c":"撮影終了後に造影剤の注入を開始する","d":"呼吸停止を解除して長時間待機する"},"answer":"b","explanation":"ボーラストラッキング法を用いることで最適なタイミングで撮影できる。","tags":"CTA;造影"},{"id":"HN-44","category":"脳神経・頭頚部領域CT","subcategory":"耳鼻咽喉","question":"中耳真珠腫を示唆する側頭骨CT所見はどれか。","choices":{"a":"上鼓室の軟部影と耳小骨骨びらん","b":"蝸牛内の脂肪影と前庭水管拡大","c":"内耳道の石灰化と耳小骨硬化","d":"乳突蜂巣の含気増加と骨過形成"},"answer":"a","explanation":"中耳真珠腫は上鼓室の軟部組織陰影と骨破壊（骨びらん）を呈する。","tags":"真珠腫;側頭骨"},{"id":"HN-45","category":"脳神経・頭頚部領域CT","subcategory":"耳鼻咽喉","question":"fenestral型耳硬化症に典型的な側頭骨CT所見はどれか。","choices":{"a":"外側半規管周囲の限局した骨欠損","b":"卵円窓前方の限局した骨性低吸収域","c":"内耳道後壁に生じる平滑な骨性隆起","d":"乳突洞全体に広がる均一な骨硬化"},"answer":"b","explanation":"Fenestral型は卵円窓周囲の骨性変化を伴う。","tags":"耳硬化症;側頭骨"},{"id":"HN-46","category":"脳神経・頭頚部領域CT","subcategory":"耳鼻咽喉","question":"副鼻腔のfungus ballに典型的な単純CT所見はどれか。","choices":{"a":"洞内の高吸収物質と微細石灰化","b":"洞内の均一な脂肪濃度と骨形成","c":"洞内の気体だけと粘膜の完全消失","d":"洞内の造影血管と眼球内への連続"},"answer":"a","explanation":"Fungus ball（真菌塊）は洞内の高吸収域と内部の石灰化を伴うことが多い。","tags":"副鼻腔;真菌"},{"id":"HN-47","category":"脳神経・頭頚部領域CT","subcategory":"頭部外傷","question":"眼窩底吹き抜け骨折で典型的に認められる内容物の脱出方向はどれか。","choices":{"a":"眼窩内側壁から前頭洞へ脱出する","b":"眼窩外側壁から側頭筋へ脱出する","c":"眼窩底から上顎洞へ脱出する","d":"眼窩上壁から篩骨洞へ脱出する"},"answer":"c","explanation":"眼窩底吹き抜け骨折では内容物が上顎洞へ脱出する。","tags":"骨折;眼窩"},{"id":"HN-48","category":"脳神経・頭頚部領域CT","subcategory":"頭頸部腫瘍","question":"頭頸部扁平上皮癌患者で転移性リンパ節を示唆する造影CT所見はどれか。","choices":{"a":"均一な脂肪濃度と平滑な薄い被膜","b":"中心部の骨濃度と均一な内部増強","c":"完全な気体濃度と石灰化した被膜","d":"中心部の壊死と不整な辺縁増強"},"answer":"d","explanation":"転移性リンパ節は内部壊死（低吸収）と不整な辺縁増強を呈する。","tags":"リンパ節;腫瘍"},{"id":"HN-49","category":"脳神経・頭頚部領域CT","subcategory":"耳鼻咽喉","question":"扁桃周囲膿瘍に典型的な造影CT所見はどれか。","choices":{"a":"扁桃周囲の低吸収域と輪状増強","b":"耳下腺内の脂肪域と均一な増強","c":"甲状腺内の気体域と広範な骨膜反応","d":"頸動脈内の石灰化と均一な内腔拡張"},"answer":"a","explanation":"扁桃周囲膿瘍は低吸収域と周囲の輪状造影効果を示す。","tags":"喉;感染"},{"id":"HN-50","category":"脳神経・頭頚部領域CT","subcategory":"耳鼻咽喉","question":"顎下腺管内の唾石症に典型的なCT所見はどれか。","choices":{"a":"耳下腺実質内の脂肪結節と導管短縮","b":"顎下腺管内の高吸収結節と上流拡張","c":"舌下腺周囲の気体結節と血管拡張","d":"甲状腺管内の低吸収結節と気管狭窄"},"answer":"b","explanation":"唾石は高吸収結節として描出され、上流の導管拡張を伴う。","tags":"唾石症;顎下腺"},{"id":"CC-01","category":"胸部・心血管領域CT","subcategory":"解剖","question":"二次小葉の中心部に位置する構造の組合せはどれか。","choices":{"a":"肺静脈枝と小葉間リンパ管","b":"終末細気管支と肺動脈枝","c":"気管支動脈と小葉間静脈","d":"肺静脈枝と小葉間結合組織"},"answer":"b","explanation":"二次小葉の中心（小葉中心）には終末細気管支と肺動脈枝が伴行して走行する。一方、小葉間隔壁や小葉辺縁には肺静脈枝や小葉間リンパ管、小葉間結合組織が存在する。","tags":"二次小葉;解剖学;肺動脈;細気管支"},{"id":"CC-02","category":"胸部・心血管領域CT","subcategory":"解剖","question":"右肺の水平裂について正しい記述はどれか。","choices":{"a":"右中葉と右下葉の境界をなす","b":"右上葉と右下葉の境界をなす","c":"左上葉と左下葉の境界をなす","d":"右上葉と右中葉の境界をなす"},"answer":"d","explanation":"右肺には水平裂（小裂）と斜裂（大裂）があり、水平裂は右上葉と右中葉の境界をなす。右下葉は斜裂によって上葉・中葉と分けられる。","tags":"右肺;葉間裂;水平裂;解剖学"},{"id":"CC-03","category":"胸部・心血管領域CT","subcategory":"解剖","question":"左肺門における肺動脈と主気管支の位置関係はどれか。","choices":{"a":"左肺動脈は左主気管支の上方を走る","b":"左肺動脈は左主気管支の下方を走る","c":"左肺動脈は左主気管支の前方を走る","d":"左肺動脈は左主気管支の後方を走る"},"answer":"a","explanation":"左肺門部において、左肺動脈は左主気管支をまたぐようにその上方を走行して肺実質内に入る（Mule's ear signなどの基準や解剖学的特徴）。","tags":"肺門;左肺動脈;主気管支;位置関係"},{"id":"CC-04","category":"胸部・心血管領域CT","subcategory":"解剖","question":"奇静脈弓が通常流入する血管はどれか。","choices":{"a":"右腕頭静脈へ流入する","b":"下大静脈へ流入する","c":"上大静脈へ流入する","d":"左腕頭静脈へ流入する"},"answer":"c","explanation":"奇静脈は胸部後壁を上行し、第4胸椎レベルで右主気管支の上方を前方にまたぐようにして奇静脈弓を形成し、上大静脈（Superior Vena Cava）へ直前に流入する。","tags":"奇静脈弓;上大静脈;血管解剖;縦隔"},{"id":"CC-05","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"胸部CTにおけるすりガラス影の定義はどれか。","choices":{"a":"肺血管影を消す均一な濃度上昇","b":"肺血管影を伴わない嚢胞状低吸収","c":"肺血管影を保つ淡い濃度上昇","d":"肺血管影を圧排する結節状軟部影"},"answer":"c","explanation":"すりガラス影（GGO: Ground-Glass Opacity）は、肺胞壁の肥厚や肺胞内への軽度な液体・細胞成分の貯留により、内部の肺血管影が透見（保持）される淡い吸収値の上昇を指す。血管影が消失する場合はコンソリデーションと呼ばれる。","tags":"すりガラス影;GGO;定義;肺野条件"},{"id":"CC-06","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"肺野のコンソリデーションを示す所見はどれか。","choices":{"a":"肺血管影を不明瞭にする濃度上昇","b":"肺血管影を保ったままの濃度低下","c":"胸膜直下に並ぶ薄壁嚢胞の集簇","d":"小葉中心部に分布する分枝状結節"},"answer":"a","explanation":"コンソリデーション（実質性陰影）は、肺胞内が液体、細胞、血液などで満たされることにより、周囲の組織濃度が上昇し、中を通る肺血管影が不明瞭（消失）になる所見である。","tags":"コンソリデーション;実質性陰影;肺野;血管影"},{"id":"CC-07","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"tree-in-bud appearanceを最もよく表す所見はどれか。","choices":{"a":"胸膜直下に重なる嚢胞状陰影","b":"小葉間隔壁に沿う平滑な肥厚","c":"肺門から広がる均一な浸潤影","d":"小葉中心性の分枝状微小結節"},"answer":"d","explanation":"tree-in-bud（出芽様陰影・樹氷様陰影）は、細気管支および肺胞道に粘液や膿汁などが充満・拡張し、小葉中心性に分枝状の微小結節が多発する所見で、非結核性抗酸菌症などの気道感染に特徴的である。","tags":"tree-in-bud;小葉中心性;微小結節;気道感染"},{"id":"CC-08","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"crazy-paving patternを構成する所見の組合せはどれか。","choices":{"a":"浸潤影と空洞形成の組合せ","b":"すりガラス影と網状影の組合せ","c":"気腫性変化と胸膜肥厚の組合せ","d":"粒状影と肺門腫大の組合せ"},"answer":"b","explanation":"クレイジーペイピング（crazy-paving）パターンは、すりガラス影の上に小葉間隔壁の肥厚（網状影）が重畳したもので、石綿肺胞蛋白症などで典型的とされる。","tags":"crazy-paving pattern;すりガラス影;網状影;小葉間隔壁"},{"id":"CC-09","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"蜂巣肺を最もよく表すCT所見はどれか。","choices":{"a":"肺門周囲に集まる充実性結節","b":"区域気管支に沿う粘液栓の集簇","c":"肺底部に限局する単発性肺囊胞","d":"胸膜直下に重なる嚢胞状空隙"},"answer":"d","explanation":"蜂巣肺（ハニカム・ラング）は、線維化に伴う肺構造の破壊により形成される、胸膜直下に多層に重なって並ぶ小嚢胞群（壁を共有する嚢胞状空隙）を特徴とする。","tags":"蜂巣肺;ハニカム;胸膜直下;線維化"},{"id":"CC-10","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"牽引性気管支拡張の成因として適切なものはどれか。","choices":{"a":"気管支内異物による急性閉塞","b":"肺線維化による気管支の牽引","c":"胸水貯留による気管支の圧迫","d":"肺血流増加による気管支の拡張"},"answer":"b","explanation":"牽引性気管支拡張（traction bronchiectasis）は、周囲の間質性肺炎や線維化に伴う組織の収縮力によって、気管支が外側から引っ張られて不規則に拡張・変形する現象である。","tags":"牽引性気管支拡張;肺線維化;成因;変形"},{"id":"CC-11","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"小葉中心性肺気腫の特徴はどれか。","choices":{"a":"小葉辺縁のみが均一に破壊される","b":"肺胞道だけが下葉優位に破壊される","c":"細葉中心部が上葉優位に破壊される","d":"細葉全体が下葉優位に破壊される"},"answer":"c","explanation":"小葉中心性肺気腫（centrilobular emphysema）は、喫煙に深く関連し、二次小葉の中心部（呼吸細気管支領域）が主に上葉優位に破壊・拡大する。","tags":"小葉中心性肺気腫;上葉優位;喫煙関連;肺気腫"},{"id":"CC-12","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"汎小葉性肺気腫の特徴はどれか。","choices":{"a":"細葉全体が下葉優位に障害される","b":"細葉中心部が上葉優位に障害される","c":"胸膜直下だけが上葉優位に障害される","d":"小葉間隔壁だけが下葉優位に障害される"},"answer":"a","explanation":"汎小葉性肺気腫（panlobular emphysema）は、α1-アンチトリプシン欠乏症などに合併しやすく、呼吸細気管支から肺胞嚢に至る細葉の構造全体が均一に、かつ下葉優位に障害される。","tags":"汎小葉性肺気腫;下葉優位;α1アンチトリプシン欠乏症"},{"id":"CC-13","category":"胸部・心血管領域CT","subcategory":"画像所見","question":"呼気CTでair trappingを示す所見はどれか。","choices":{"a":"呼気時にも低吸収域が残存する","b":"呼気時に高吸収結節が増大する","c":"呼気時に胸水の濃度が上昇する","d":"呼気時に縦隔リンパ節が縮小する"},"answer":"a","explanation":"末梢気道病変によるair trapping（空気の閉じ込め）では、正常肺は呼気時に収縮して全体に高吸収化するのに対し、病変部は呼気時でもガスが抜けず相対的な低吸収域として残存する。","tags":"air trapping;呼気CT;小気道病変;ガスとう置"},{"id":"CC-14","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"仰臥位CTで背側胸膜直下に淡い陰影を認めた場合、腹臥位撮影の主な目的はどれか。","choices":{"a":"肺血管内の造影効果を確認する","b":"肺結節内の石灰化を確認する","c":"荷重部無気肺との鑑別を行う","d":"縦隔リンパ節の可動性を確認する"},"answer":"c","explanation":"仰臥位における背側胸膜直下の淡い影は、重力依存性の無気肺（荷重部無気肺）であることが多いため、腹臥位撮影を行って重力の影響を反転させることで、真の肺病変（浸潤影など）との鑑別を行う。","tags":"腹臥位;無気肺;荷重部;アーチファクト鑑別"},{"id":"CC-15","category":"胸部・心血管領域CT","subcategory":"画像処理","question":"胸部CTにおけるMIP表示が特に有用な対象はどれか。","choices":{"a":"気道内腔や肺気腫の低吸収域","b":"肺血管や微小結節の高吸収域","c":"横隔膜近傍の呼吸性位置ずれ","d":"金属周囲のビーム硬化領域"},"answer":"b","explanation":"MIP（Maximum Intensity Projection：最大値投影）は、設定した範囲内の最高値のボクセルを抽出するため、肺動静脈などの血管構造や細かな結節（高吸収域）の描出に非常に有用である。","tags":"MIP;最大値投影;肺血管;微小結節"},{"id":"CC-16","category":"胸部・心血管領域CT","subcategory":"画像処理","question":"胸部CTにおけるMinIP表示が特に有用な対象はどれか。","choices":{"a":"石灰化結節や造影血管の高吸収域","b":"胸膜肥厚や縦隔腫瘤の軟部組織","c":"骨皮質や金属周囲の高吸収領域","d":"気道内腔や肺気腫の低吸収域"},"answer":"d","explanation":"MinIP（Minimum Intensity Projection：最小値投影）は、設定範囲内の最低値のボクセルを強調表示するため、気管支内腔の狭窄やモザイクパーフェュージョン、肺気腫による低吸収域の評価に有効である。","tags":"MinIP;最小値投影;気道内腔;肺気腫"},{"id":"CC-17","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"高分解能胸部CTの再構成として適切なものはどれか。","choices":{"a":"厚いスライスと平滑化関数を用いる","b":"厚いスライスと高周波関数を用いる","c":"薄いスライスと高周波関数を用いる","d":"薄いスライスと強い平滑化関数を用いる"},"answer":"c","explanation":"HRCT（高分解能CT）では、空間分解能を最大化するために、薄いスライス厚（通常1mm以下）と、高周波再構成関数（シャープなカーネル）の組合せを用いる。","tags":"HRCT;高分解能;薄いスライス;高周波関数"},{"id":"CC-18","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"胸部の呼気相CTを追加する主な目的はどれか。","choices":{"a":"肺結節の造影増強を評価する","b":"胸膜病変の石灰化を評価する","c":"縦隔腫瘤の脂肪成分を評価する","d":"末梢気道のair trappingを評価する"},"answer":"d","explanation":"呼気相CTを追加する最大の臨床的意義は、小気道病変やびまん性汎 bronchiolitisなどによる空気の閉じ込め（air trapping）によるモザイク状の低吸収域を明瞭にすることである。","tags":"呼気相CT;末梢気道;air trapping;評価目的"},{"id":"CC-19","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"通常の胸部CTで両上肢を挙上して撮影する主な理由はどれか。","choices":{"a":"肩周囲からのアーチファクトを減らす","b":"肺血管内の造影剤濃度を高める","c":"横隔膜付近の呼吸運動を抑える","d":"心拍変動による位置ずれを減らす"},"answer":"a","explanation":"両上肢を挙上することで、肩関節周辺の骨や筋肉などの高吸収物質がX線ビーム経路から外れ、肩周辺に起因するビーム硬化アーチファクトやストリークアーチファクトを大幅に軽減できる。","tags":"上肢挙上;アーチファクト低減;肩関節;撮影体位"},{"id":"CC-20","category":"胸部・心血管領域CT","subcategory":"造影技術","question":"造影胸部CTで生理食塩水による後押しを行う主な効果はどれか。","choices":{"a":"肺野の吸気保持時間を延長する","b":"上大静脈内の高濃度造影剤を減らす","c":"縦隔脂肪のCT値を均一にする","d":"肺動脈内の血流速度を低下させる"},"answer":"b","explanation":"造影剤注入後に生理食塩水で押し出す手法（サラインチェイサー）により、上大静脈や右心系に残存する高濃度造影剤によるビーム硬化・ストリークアーチファクトを軽減できる。","tags":"生理食塩水;後押し;サラインチェイサー;アーチファクト低減"},{"id":"CC-21","category":"胸部・心血管領域CT","subcategory":"線量管理","question":"CTDIvolについて適切な説明はどれか。","choices":{"a":"患者体格で補正した臓器吸収線量を示す","b":"標準ファントムに基づく平均出力指標を示す","c":"検査全体の撮影長を含む線量積を示す","d":"組織加重係数を用いた実効線量を示す"},"answer":"b","explanation":"CTDIvol（体積CT線量指数）は、標準的なアクリルファントム（頭部用または体幹部用）を用いて測定された、1回転あたりの平均的なX線出力を示す放射線量指標である。","tags":"CTDIvol;線量指標;標準ファントム;CT検査"},{"id":"CC-22","category":"胸部・心血管領域CT","subcategory":"線量管理","question":"DLPについて適切な説明はどれか。","choices":{"a":"CTDIvolに撮影長を乗じた線量指標である","b":"患者直径で補正した局所線量指標である","c":"臟器感受性で補正した実効線量指標である","d":"心電図位相で補正した出力線量指標である"},"answer":"a","explanation":"DLP（Dose Length Product：線量長積）は、CTDIvolに実際の撮影長（Scan length）を乗算したものであり、1回の検査全体で患者が受けた総放射線エネルギーの目安となる。","tags":"DLP;線量長積;CTDIvol;撮影長"},{"id":"CC-23","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"肺がん検診の低線量CTで基本となる撮影方法はどれか。","choices":{"a":"造影早期相を高線量で撮影する","b":"非造影呼気相を標準線量で撮影する","c":"造影遅延相を低線量で撮影する","d":"非造影吸気相を低線量で撮影する"},"answer":"d","explanation":"肺がん検診における低線量CT（LDCT）では、被ばくを最小限に抑えるため造影剤を用いない「非造影」かつ、肺実質が十分に拡大した「吸気相」を低線量条件で撮影する。","tags":"肺がん検診;低線量CT;非造影;吸気相"},{"id":"CC-24","category":"胸部・心血管領域CT","subcategory":"線量管理","question":"逐次近似再構成を低線量胸部CTに用いる主な目的はどれか。","choices":{"a":"撮影範囲を広げて検査時間を延ばす","b":"造影剤量を増やして血管濃度を上げる","c":"画像ノイズを抑えて線量低減を支援する","d":"心拍同期を行って冠動脈静止像を得る"},"answer":"c","explanation":"逐次近似再構成（Iterative Reconstruction）およびディープラーニング再構成技術は、低線量撮影で問題となる量子ノイズやアーチファクトを効果的に低減させ、高画質を維持したまま線量低減を可能にする。","tags":"逐次近似再構成;画質改善;ノイズ抑制;線量低減"},{"id":"CC-25","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"CTの自動露出制御が行う動作はどれか。","choices":{"a":"心拍数に応じて造影剤量を調整する","b":"撮影長に応じてスライス厚を調整する","c":"呼吸相に応じて再構成関数を調整する","d":"被写体減弱に応じて管電流を調整する"},"answer":"d","explanation":"AEC（Automatic Exposure Control：自動露出制御）は、患者の体格や投射方向によるX線減弱の変化（厚みや骨格の違い）をリアルタイムに検知し、適切な管電流を自動変調させるシステムである。","tags":"AEC;自動露出制御;管電流;被写体減弱"},{"id":"CC-26","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"造影CTで管電圧を低くした場合に生じる一般的な変化はどれか。","choices":{"a":"ヨード造影効果が低下してノイズも低下する","b":"ヨード造影効果が低下してノイズが増加する","c":"ヨード造影効果が上昇してノイズが増加する","d":"ヨード造影効果が上昇してノイズも低下する"},"answer":"c","explanation":"管電圧を低下（低管電圧化）させると、ヨードのK吸収端（約33.2keV）に近づくため、ヨード造影剤のコントラスト（造影効果）が大きく上昇する反面、透過X線量が減るため画像ノイズは増加する傾向にある。","tags":"低管電圧;ヨード造影効果;画像ノイズ;コントラスト"},{"id":"CC-27","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"肺小結節の評価で薄いスライスを用いる主な利点はどれか。","choices":{"a":"ビーム硬化を増やして輪郭を強調する","b":"部分容積効果を減らして形状を示す","c":"呼吸運動を増やして可動性を示す","d":"散乱線量を増やして濃度を安定させる"},"answer":"b","explanation":"薄いスライス（薄切像）を用いることで、スライス方向の部分容積効果（Partial Volume Effect）が低減され、小結節の正確な大きさ、境界、内部構造（充実成分や石灰化）の評価が可能になる。","tags":"肺小結節;薄いスライス;部分容積効果;高分解能"},{"id":"CC-28","category":"胸部・心血管領域CT","subcategory":"撮影技術","question":"低線量肺がん検診CTで精査を要する異常を認めた場合の対応はどれか。","choices":{"a":"必要に応じて診断目的の追加精査を行う","b":"検診画像だけで病理診断まで確定する","c":"線量を理由に以後の画像検査を中止する","d":"必ず同日に造影全身CTまで追加する"},"answer":"a","explanation":"肺がん検診のスクリーニングで要精査と判定された場合は、病変の良悪性を明確にするために、薄切高分解能CTや必要に応じた精密検査（造影CTやPET-CT等）を実施する。","tags":"肺がん検診;要精査;追加検査;スクリーニング"},{"id":"CC-29","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CTの前向き心電図同期撮影の特徴はどれか。","choices":{"a":"選択した心位相を中心にX線を照射する","b":"全心位相で管電流を一定に維持する","c":"選択した呼吸位相だけにX線を照射する","d":"造影前後で管電圧を一定に維持する"},"answer":"a","explanation":"前向き心電図同期（Prospective ECG-gating / シーケンシャル撮影）は、心電図の特定の拡張中期などの目的とする心位相でのみX線を照射するため、大幅な被ばく低減が可能になる。","tags":"前向き心電図同期;スキャン;心位相;X線照射"},{"id":"CC-30","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CTの後ろ向き心電図同期撮影の特徴はどれか。","choices":{"a":"選択した一心位相だけを逐次撮影する","b":"心電図を記録しながら連続的に撮影する","c":"呼吸波形を記録しながら間欠撮影する","d":"造影波形を記録しながら単純撮影する"},"answer":"b","explanation":"後ろ向き心電図同期（Retrospective ECG-gating / ヘリカル撮影）は、心電図の記録と同時にヘリカルスキャンを連続的に行い、全心位相の画像データを再構成可能にする方式である。","tags":"後ろ向き心電図同期;ヘリカル;心電図記録;連続撮影"},{"id":"CC-31","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"単管球CTのハーフ再構成における時間分解能は、ガントリ回転時間に対しておよそどの程度か。","choices":{"a":"回転時間の約4分の1である","b":"回転時間とほぼ同じである","c":"回転時間の約2分の1である","d":"回転時間の約2倍である"},"answer":"c","explanation":"ハーフスキャン（ハーフ再構成）法では、投影データ収集に最低限必要なガントリの回転角が「180度＋ファン角」であるため、時間分解能はおおむねガントリ回転時間の約1/2となる。","tags":"ハーフ再構成;時間分解能;ガントリ回転時間;単管球CT"},{"id":"CC-32","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CTで大きな心拍変動により生じやすい画質低下はどれか。","choices":{"a":"肩部から生じるビーム硬化","b":"造影剤から生じる金属アーチファクト","c":"視野外から生じる切断アーチファクト","d":"位相ずれによる段差状アーチファクト"},"answer":"d","explanation":"心拍が不規則に変動すると、異なる心拍間でのデータ収集タイミングにズレが生じ、再構成画像上で血管が途切れたり二重に見えたりする「ステップ・アーチファクト（段差状アーチファクト）」が発生しやすくなる。","tags":"心拍変動;冠動脈CT;段差状アーチファクト;位相ずれ"},{"id":"CC-33","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CT前にベータ遮断薬を使用する主な目的はどれか。","choices":{"a":"冠動脈内の石灰化を減少させる","b":"心拍数を下げて静止時間を延長する","c":"造影剤による腎負担を軽減する","d":"大動脈弁輪の収縮を抑制する"},"answer":"b","explanation":"冠動脈CT（CTA）では、心拍数を低下させ、かつ拡張中期などの動かない静止期間（心静止時間）を長く確保するために、必要に応じてβ遮断薬などの前処置を行う。","tags":"ベータ遮断薬;心拍数低下;前処置;冠動脈CT"},{"id":"CC-34","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CT前に硝酸薬を使用する主な目的はどれか。","choices":{"a":"心筋収縮を増強して拍出量を上げる","b":"冠動脈石灰化を溶解して内腔を広げる","c":"房室伝導を抑制して心拍数を下げる","d":"冠動脈を拡張して内腔描出を改善する"},"answer":"d","explanation":"ニトログリセリン（硝酸薬）を舌下投与することにより、冠動脈を強力に拡張させ、抹消の細かな血管まで明瞭に描出できるようにする。","tags":"硝酸薬;ニトログリセリン;冠動脈拡張;前処置"},{"id":"CC-35","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈石灰化スコア検査の基本的な撮影方法はどれか。","choices":{"a":"非造影心電図同期で冠動脈石灰化を測る","b":"造影非同期撮影で冠動脈狭窄率を測る","c":"非造影非同期撮影で心筋血流量を測る","d":"造影心電図同期で心筋線維化を測る"},"answer":"a","explanation":"冠動脈石灰化スコア（CACスコア / Agatstonスコア）の測定には、造影剤を用いず、心電図同期をかけて心臓の動きを止めた非造影CTスキャンが用いられる。","tags":"冠動脈石灰化スコア;非造影;心電図同期;Agatston"},{"id":"CC-36","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈CTAの造影法として適切なものはどれか。","choices":{"a":"低いヨード注入率で長い遅延時間を設ける","b":"造影剤を緩徐注入して呼気相だけ撮影する","c":"高いヨード注入率で生理食塩水を後押しする","d":"造影剤を分割注入して単純相だけ撮影する"},"answer":"c","explanation":"冠動脈CTAでは、高濃度の造影剤を高いヨード注入率（例: 4〜5 mL/s以上）で短時間に注入し、さらに生理食塩水で後押しすることで、左室・冠動脈内を高濃度の造影剤で満たして撮影する。","tags":"冠動脈CTA;造影法;ヨード注入率;生理食塩水"},{"id":"CC-37","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"右冠動脈が通常起始する部位はどれか。","choices":{"a":"左冠動脈洞から起始する","b":"無冠動脈洞から起始する","c":"右冠動脈洞から起始する","d":"主肺動脈洞から起始する"},"answer":"c","explanation":"大動脈弁のバルサルバ洞において、右冠動脈（RCA）は通常「右冠動脈洞（Right coronary sinus）」から起始し、左冠動脈は左冠動脈洞から起始する。","tags":"右冠動脈;バルサルバ洞;起始部;解剖"},{"id":"CC-38","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"左前下行枝が主に走行する部位はどれか。","choices":{"a":"前室間溝を心尖部方向へ走行する","b":"後室間溝を心基部方向へ走行する","c":"右房室間溝を下壁方向へ走行する","d":"左房室間溝を後壁方向へ走行する"},"answer":"a","explanation":"左冠動脈の枝である左前下行枝（LAD：Left Anterior Descending artery）は、前室間溝に沿って心尖部方向に向かって走行する。","tags":"左前下行枝;LAD;前室間溝;心尖部"},{"id":"CC-39","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"左回旋枝が主に走行する部位はどれか。","choices":{"a":"前室間溝を心尖部方向へ走行する","b":"左房室間溝を後方へ走行する","c":"後室間溝を心尖部方向へ走行する","d":"右房室間溝を前方へ走行する"},"answer":"b","explanation":"左回旋枝（LCX：Left Circumflex artery）は、左房室間溝に沿って左側方から後方（冠状溝）へ向かって走行する。","tags":"左回旋枝;LCX;左房室間溝;走行"},{"id":"CC-40","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈の右優位型と左優位型を決める基準はどれか。","choices":{"a":"洞結節枝が起始する冠動脈","b":"房室結節枝が起始する冠動脈","c":"円錐枝が起始する冠動脈","d":"後下行枝が起始する冠動脈"},"answer":"d","explanation":"冠動脈の優位型（ドミナンス）は、後下行枝（Posterior Descending Artery: PDA）がどちらの冠動脈から分岐しているかによって決定される（右冠動脈優位型が約85〜90%を占める）。","tags":"冠動脈優位型;右優位型;左優位型;後下行枝"},{"id":"CC-41","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈の高度石灰化が狭窄評価に及ぼす影響はどれか。","choices":{"a":"部分容積効果により血管径を過大表示する","b":"モーション効果により血管径を過大表示する","c":"光子不足により石灰化を完全に消去する","d":"ブルーミングにより狭窄を過大評価する"},"answer":"d","explanation":"冠動脈に高度な石灰化が存在すると、周囲に高吸収が広がって見える「ブルーミング（blooming）アーチファクト」が生じ、実際の血管内腔よりも狭窄が強く（狭く）見える過大評価を引き起こす。","tags":"高度石灰化;ブルーミングアーチファクト;狭窄評価;過大評価"},{"id":"CC-42","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈ステント内腔の評価が難しくなりやすい条件はどれか。","choices":{"a":"大径で薄いストラットのステントである","b":"小径で厚いストラットのステントである","c":"低心拍で静止時間が長い撮影である","d":"高分解能の再構成を用いた撮影である"},"answer":"b","explanation":"金属製の冠動脈ステントでは、小径で厚いストラット（支柱）をもつものほどメタルアーチファクト（ビーム硬化や光子不足）が強く生じ、内腔のステント内再狭窄評価が極めて困難になる。","tags":"冠動脈ステント;内腔評価;ストラット;アーチファクト"},{"id":"CC-43","category":"胸部・心血管領域CT","subcategory":"心臓CT","question":"冠動脈バイパス術後CTの撮影範囲として適切なものはどれか。","choices":{"a":"冠動脈起始部から近位冠動脈までに限定する","b":"大動脈弓部から肺動脈分岐部までに限定する","c":"グラフト起始部から末梢吻合部までを含める","d":"左室心尖部から下行大動脈だけまでを含める"},"answer":"c","explanation":"冠動脈バイパス術（CABG）後CTでは、上行大動脈などからのグラフト起始部（VIMA、橈骨動脈、大伏在静脈など）から、吻合部を経て末梢の冠動脈に至るまで全体を網羅する必要がある。","tags":"冠動脈バイパス術;CABG;グラフト;撮影範囲"},{"id":"CC-44","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"下肢動脈CTAで末梢動脈の造影を安定させる方法はどれか。","choices":{"a":"血流に合わせて撮影開始と走査速度を調整する","b":"心拍に合わせて全区間を心電図同期撮影する","c":"呼吸に合わせて全区間を間欠的に撮影する","d":"静脈相に合わせて撮影範囲を胸部に限定する"},"answer":"a","explanation":"下肢動脈CTAでは、造影剤の血流スピードや下肢の循環動態、および血流遅延（狭窄などによる影響）に合わせて、ガントリの移動速度（テーブルスピード）や撮影開始遅延時間を最適にコントロールする。","tags":"下肢動脈CTA;末梢動脈;追従撮影;テーブル移動"},{"id":"CC-45","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"急性大動脈症候群が疑われる場合に単純CTを追加する主な目的はどれか。","choices":{"a":"壁内血腫の高吸収域を検出する","b":"大動脈弁逆流の流速を測定する","c":"冠動脈内の血流予備量を測定する","d":"肺動脈内の造影欠損を検出する"},"answer":"a","explanation":"急性大動脈症候群（大動脈解離、壁内血腫、穿通性大動脈潰瘍など）の評価において、造影前の単純CTは、壁内血腫内にある新鮮血の血腫による高吸収域（ハーフムーンサインなど）を明瞭に検出するために不可欠である。","tags":"急性大動脈症候群;単純CT;壁内血腫;高吸収"},{"id":"CC-46","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"大動脈解離に対する造影早期相の主な目的はどれか。","choices":{"a":"大動脈壁の慢性石灰化量だけを測定する","b":"心筋内の遅延造影分布だけを測定する","c":"内膜フラップと各腔の造影状態を評価する","d":"肺実質内の気腫性変化だけを評価する"},"answer":"c","explanation":"大動脈解離の造影早期相（インジェクション直後〜アーリー相）では、真腔と偽腔の位置関係、内膜フラップの形態、およびそれぞれの血流や造影状態を正確に評価することができる。","tags":"大動脈解離;造影早期相;内膜フラップ;真腔偽腔"},{"id":"CC-47","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"大動脈ステントグラフト術後に遅延相を撮影する主な目的はどれか。","choices":{"a":"ステント金属の材質を判定する","b":"大動脈壁の石灰化量を測定する","c":"冠動脈の最大拡張時相を選択する","d":"低流速のエンドリークを検出する"},"answer":"d","explanation":"ステントグラフト内挿術（EVAR / TEVAR）後のフォロアップでは、グラフト周囲の血流流入（エンドリーク）のうち、特に流入速度が遅いタイプ（II型など）を確実に描出するために遅延相の撮影が必須となる。","tags":"ステントグラフト;EVAR;遅延相;エンドリーク"},{"id":"CC-48","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"経カテーテル大動脈弁留置術の術前CTで重要な計測対象はどれか。","choices":{"a":"肺動脈弁輪と肺静脈径を計測する","b":"大動脈弁輪と腸骨動脈径を計測する","c":"僧帽弁輪と冠静脈洞径を計測する","d":"三尖弁輪と上大静脈径を計測する"},"answer":"b","explanation":"TAVI（経カテーテル大動脈弁留置術）の術前計画CTでは、留置する人工弁のサイズ選定のための「大動脈弁輪径・面積」の計測と、カテーテルアプローチ経路となる「腸骨動脈・大腿動脈の径や蛇行・石灰化」の評価が極めて重要となる。","tags":"TAVI;TAVR;術前CT;大動脈弁輪;腸骨動脈"},{"id":"CC-49","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"肺動脈CTAのボーラストラッキングで通常ROIを設定する部位はどれか。","choices":{"a":"上行大動脈内に設定する","b":"主肺動脈内に設定する","c":"左心房内に設定する","d":"下大静脈内に設定する"},"answer":"b","explanation":"肺動脈血栓塞栓症などを評価する肺動脈CTAでは、造影剤の到達を正確にモニタリングするため、「主肺動脈（Main pulmonary artery）」内にROI（関心領域）を設定してボーラストラッキングを行う。","tags":"肺動脈CTA;ボーラストラッキング;ROI;主肺動脈"},{"id":"CC-50","category":"胸部・心血管領域CT","subcategory":"血管CT","question":"肺動脈CTA後の間接CT venographyで深部静脈血栓を評価する方法はどれか。","choices":{"a":"肺動脈相の数分後に下肢静脈を撮影する","b":"肺動脈相の直前に下肢静脈を撮影する","c":"大動脈相の直後に冠静脈を撮影する","d":"門脈相の直前に上肢動脈を撮影する"},"answer":"a","explanation":"肺動脈CTAに続けて下肢の深部静脈血栓症（DVT）を評価する間接CTVでは、肺動脈相の撮影から数分後（約2〜3分後）に下肢領域を追加撮影し、静脈内の造影不良域（血栓）を評価する。","tags":"間接CT venography;DVT;深部静脈血栓;下肢静脈"},{"id":"AM-01","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"Couinaud分類による肝区域の基本的な区分について正しいのはどれか。","choices":{"a":"門脈枝の分布を基準に区分する","b":"肝動脈枝の分布だけで区分する","c":"胆管枝の走行だけで区分する","d":"肝静脈枝の分布を基準に区分する"},"answer":"a","explanation":"Couinaud分類は、肝内の門脈枝（およびそれに伴う肝動脈・胆管）の分布を基準にして肝臓を8つの区域に区分する。肝静脈は区域の境界（肝間隙）として利用される。","tags":"Couinaud分類;肝区域;門脈枝"},{"id":"AM-02","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"多血性肝細胞癌の腫瘍濃染を検出するために重要な撮影相はどれか。","choices":{"a":"単純相だけで腫瘍濃染を評価する","b":"肝動脈相で腫瘍濃染を評価する","c":"門脈相だけで腫瘍濃染を評価する","d":"平衡相だけで腫瘍濃染を評価する"},"answer":"b","explanation":"多血性の肝細胞癌は肝動脈からの血流が豊富であるため、造影剤投与後早期の肝動脈相において周囲の肝実質よりも強く濃染（ハイパーバスクラー）する。","tags":"肝細胞癌;多血性;肝動脈相"},{"id":"AM-03","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"典型的な肝細胞癌におけるwashoutの所見はどれか。","choices":{"a":"単純相だけで周囲肝より高吸収となる","b":"動脈相だけで周囲肝より低吸収となる","c":"門脈相以降で周囲肝より低吸収となる","d":"遅延相では周囲肝と必ず等吸収となる"},"answer":"c","explanation":"肝細胞癌は動脈相で早期に濃染された後、門脈相や平衡相（遅延相）にかけて造影剤が急速に流出し、周囲の肝実質と比較して低吸収（washout）を示すのが典型的な所見である。","tags":"肝細胞癌;washout;門脈相"},{"id":"AM-04","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"門脈内の腫瘍栓を単純な血栓から鑑別するうえで有用な所見はどれか。","choices":{"a":"血栓が単純CTで均一低吸収を示す","b":"血栓が門脈本幹内だけに限局する","c":"血栓が造影後も均一低吸収を示す","d":"血栓内に明らかな造影効果を認める"},"answer":"d","explanation":"腫瘍栓はそれ自体が腫瘍組織であるため、造影剤によって内部が染まる（造影効果を示す）ことが多い。一方、単なる血栓には造影効果がない。","tags":"門脈腫瘍栓;血栓鑑別;造影効果"},{"id":"AM-05","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"低血流性肝転移の検出を目的とした造影CTで重要な評価方法はどれか。","choices":{"a":"門脈相で肝実質との濃度差を評価する","b":"動脈相だけで病変の全個数を確定する","c":"単純相だけで病変の全個数を確定する","d":"排泄相で肝実質との濃度差を評価する"},"answer":"a","explanation":"低血流性（血流が乏しい）肝転移は、造影剤が十分にいきわたった肝実質が強く造影される門脈相（約60〜70秒後）において、周囲の正常肝実質とのコントラスト（濃度差）が最も大きくなり検出しやすくなる。","tags":"低血流性肝転移;造影CT;門脈相"},{"id":"AM-06","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"脂肪肝を単純CTで評価した場合の典型的な所見はどれか。","choices":{"a":"単純CTで肝が脾より高吸収を示す","b":"単純CTで肝が脾より低吸収を示す","c":"造影CTで肝が腎皮質より高吸収を示す","d":"造影CTで肝が膵より必ず高吸収を示す"},"answer":"b","explanation":"脂肪肝では肝実質内に脂肪が蓄積するため、X線吸収値が低下する。そのため、正常では肝臓より低吸収である脾臓と比較して、肝臓の方が低吸収を示すようになる。","tags":"脂肪肝;単純CT;脾"},{"id":"AM-07","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"典型的な肝海綿状血管腫の造影パターンはどれか。","choices":{"a":"中心から均一に染まり早期に消失する","b":"全体が乏血性で遅延相まで変化しない","c":"辺縁から結節状に染まり中心へ広がる","d":"被膜だけが染まり内部は常に無造影となる"},"answer":"c","explanation":"肝海綿状血管腫は動脈相の辺縁に結節状（グロブラー）の造影効果が現れ、平衡相や遅延相にかけて徐々に中心部へ向かって染まりが広がっていく（filling-in）特徴的な造影パターンを示す。","tags":"肝海綿状血管腫;造影パターン;辺縁染まり"},{"id":"AM-08","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"肝臓","question":"腫瘤形成型肝内胆管癌にみられやすい造影所見はどれか。","choices":{"a":"早期に均一濃染し遅延相で消失する","b":"単純CTで脂肪濃度を主体として示す","c":"動脈相だけで完全な嚢胞濃度を示す","d":"遅延相で線維性間質の造影が増強する"},"answer":"d","explanation":"腫瘤形成型肝内胆管癌は豊富な線維性間質（間質が豊富で緻密）を持つため、動脈相では不均一な軽度造影にとどまり、時間経過とともに造影剤が遷延性に貯留し、遅延相で造影効果が増強する傾向がある。","tags":"肝内胆管癌;腫瘤形成型;遅延相"},{"id":"AM-09","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"胆道","question":"胆囊結石がCTで明瞭に描出されない場合がある主な理由はどれか。","choices":{"a":"結石が胆汁と近い吸収値を示すため","b":"結石が呼吸で胆嚢外へ移動するため","c":"結石が造影剤で常に溶解するため","d":"結石が腸管ガスへ完全に変化するため"},"answer":"a","explanation":"コレステロールを多く含む純な胆嚢結石などは、周囲を満たす胆汁とX線吸収値（CT値）が近いため、CT画像上でコントラストが不明瞭となり描出されないことがある（エコー検査の方が検出に優れる）。","tags":"胆嚢結石;吸収値;描出不良"},{"id":"AM-10","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"胆道","question":"急性胆嚢炎を示唆する代表的なCT所見はどれか。","choices":{"a":"胆囊壁の菲薄化と周囲脂肪の濃度低下","b":"胆囊壁の肥厚と周囲脂肪の濃度上昇","c":"胆嚢内ガスと周囲脂肪の濃度低下","d":"胆嚢萎縮と周囲脂肪の濃度低下"},"answer":"b","explanation":"急性胆嚢炎では炎症により、胆嚢壁の肥厚（浮腫性変化）や、胆嚢周囲の脂肪織の濃度上昇（炎症による濁り・ストリーク状変化）がみられる。","tags":"急性胆嚢炎;胆嚢壁肥厚;周囲脂肪"},{"id":"AM-11","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"胆道","question":"胆管閉塞の位置をCTで推定する際に基本となる所見はどれか。","choices":{"a":"肝内胆管が均一に細くなる所見","b":"胆嚢内だけに液面が生じる所見","c":"閉塞部より上流の胆管が拡張する所見","d":"閉塞部より下流の胆管が拡張する所見"},"answer":"c","explanation":"胆管が何らかの原因（結石や腫瘍など）で閉塞すると、胆汁の流出が阻害されるため、閉塞部位よりも上流側（肝内および閉塞部より末梢側）の胆管が拡張する。この移行部を探すことで閉塞位置を特定できる。","tags":"胆管閉塞;上流拡張;閉塞部位"},{"id":"AM-12","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"膵臓","question":"膵管癌を周囲の正常膵実質から識別しやすい造影所見はどれか。","choices":{"a":"単純相で脂肪より低い濃度を示す","b":"動脈相で大動脈と同じ強い濃染を示す","c":"排泄相で尿路と同じ濃染を示す","d":"膵実質相で周囲膵より低濃度を示す"},"answer":"d","explanation":"膵管癌は少血性で線維化を伴うことが多いため、造影剤が十分にゆきわたった膵実質相（約40〜50秒後）において、周囲の正常な血流豊富な膵実質と比較して相対的に低濃度（血流・造影不良域）として描出されやすい。","tags":"膵管癌;膵実質相;低濃度"},{"id":"AM-13","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"膵臓","question":"典型的な膵神経内分泌腫瘍の造影所見はどれか。","choices":{"a":"膵実質相で強い造影効果を示す","b":"膵実質相で水と同じ低吸収を示す","c":"遅延相だけで脂肪濃度を示す","d":"単純相だけで粗大石灰化を必ず示す"},"answer":"a","explanation":"膵神経内分泌腫瘍（PanNET）は多血性の腫瘍であることが多く、血流がピークを迎える膵実質相において周囲の正常膵実質よりも強い造影効果（濃染）を示す。","tags":"膵神経内分泌腫瘍;膵実質相;造影効果"},{"id":"AM-14","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"膵臓","question":"急性膵炎に伴う膵実質壊死を評価する方法はどれか。","choices":{"a":"単純CTで膵実質の広い濃度上昇を確認する","b":"造影CTで膵実質の造影欠損を確認する","c":"超遅延相で膵管の造影排泄を確認する","d":"排泄相で膵周囲液体の消失を確認する"},"answer":"b","explanation":"急性重症膵炎における膵実質壊死（血流が途絶え壊死に陥った領域）の評価には、造影剤を投与したダイナミックCT（造影CT）を行い、造影効果が得られない部分（造影欠損域）を確認することが最も有効である。","tags":"急性膵炎;膵実質壊死;造影欠損"},{"id":"AM-15","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"膵臓","question":"膵管内乳頭粘液性腫瘍の画像評価で重要な確認事項はどれか。","choices":{"a":"胆囊管との交通をMPRで評価する","b":"総胆管との交通をMPRで評価する","c":"主膵管との交通をMPRで評価する","d":"門脈枝との交通をMPRで評価する"},"answer":"c","explanation":"膵管内乳頭粘液性腫瘍（IPMN）は粘液を産生して主膵管を拡張させる特徴があるため、腫瘍（分枝型や混合型など）と主膵管との間に交通性があるかをMPR（多断面再構成像）やMRCPなどで詳細に評価することが極めて重要である。","tags":"IPMN;主膵管交通;MPR"},{"id":"AM-16","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"食道癌に対する胸腹部造影CTの主な役割はどれか。","choices":{"a":"内視鏡なしで粘膜内浸潤を確定する","b":"生検なしで腫瘍の組織型を確定する","c":"超音波なしで壁深達度を詳細に確定する","d":"周囲臓器への浸潤と遠隔転移を評価する"},"answer":"d","explanation":"胸腹部造影CTは、食道癌自体の周囲の組織や大動脈・気管など隣接臓器への直接浸潤、およびリンパ節転移や肝・肺などの遠隔転移の有無を一挙に評価するために不可欠な役割を果たす。","tags":"食道癌;胸腹部造影CT;遠隔転移"},{"id":"AM-17","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"消化管CTで水などの中性経口造影剤を用いる利点はどれか。","choices":{"a":"消化管壁の造影効果を観察しやすくする","b":"消化管壁の微細石灰化だけを観察しやすくする","c":"消化管内の金属異物だけを観察しやすくする","d":"消化管内の空気量だけを観察しやすくする"},"answer":"a","explanation":"水などの陰性～中性経口造影剤で消化管内を適切に拡張させつつ満たすことで、静脈性造影剤を用いた際の消化管壁の血流変化や造影効果（壁肥厚や粘膜の染まり方）を明瞭に観察できるようになる。","tags":"消化管CT;中性経口造影剤;造影効果"},{"id":"AM-18","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"胃癌のCT検査で胃を十分に拡張させる主な目的はどれか。","choices":{"a":"胃粘膜のCT値をゼロにするため","b":"胃壁の偽性肥厚を減らすため","c":"胃内容物を造影剤へ変えるため","d":"胃周囲脂肪を均一に消すため"},"answer":"b","explanation":"胃が十分に虚脱した状態だと、正常な胃壁が厚く見えてしまう「偽性肥厚」が生じて病変と区別がつきにくくなる。炭酸ガスや水などで十分に拡張させることで、実際の壁の肥厚や小さな胃癌を正確に評価できる。","tags":"胃癌;胃拡張;偽性肥厚"},{"id":"AM-19","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"小腸閉塞の移行部を検索するために有用な画像表示はどれか。","choices":{"a":"横断像一断面だけで腸管走行を連続評価する","b":"単純X線だけで腸管走行を連続評価する","c":"冠状断MPRで腸管走行を連続評価する","d":"骨条件画像だけで腸管走行を連続評価する"},"answer":"c","explanation":"複雑に入り組む小腸の閉塞機転（移行部）を効率よく同定するには、三次元的なつながりを把握しやすい冠状断（コロナル）などのMPR画像が極めて有用である。","tags":"小腸閉塞;移行部;冠状断MPR"},{"id":"AM-20","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"閉鎖係蹄性腸閉塞を示唆する特徴的なCT所見はどれか。","choices":{"a":"離れた一か所だけに明瞭な移行点を認める","b":"腸管全体に均一な拡張だけを認める","c":"結腸内に散在する液面だけを認める","d":"近接する二か所の移行点を認める"},"answer":"d","explanation":"閉鎖係蹄性（クローズドロープ型）腸閉塞では、一つの腸管ループの閉塞した両端が同一の障害部位に固定されるため、CTの同一断面上や連続像で「近接する二か所の移行点」が認められるのが特徴である。","tags":"閉鎖係蹄性腸閉塞;二か所の移行点;クローズドロープ"},{"id":"AM-21","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"造影CTで腸管虚血を強く疑う所見はどれか。","choices":{"a":"造影後の腸管壁増強が低下する","b":"造影後の腸管壁増強が必ず均一化する","c":"単純CTで腸間膜脂肪が完全に消失する","d":"排泄相で腸管内造影剤が必ず増加する"},"answer":"a","explanation":"血流障害（虚血）に陥った腸管壁は血流が途絶えるため、造影剤を投与しても正常な腸管壁のようにしっかりとした造影増強効果が示されず、増強効果の低下（あるいは欠損）を認める。","tags":"腸管虚血;造影増強低下;造影CT"},{"id":"AM-22","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"急性虫垂炎の典型的なCT所見はどれか。","choices":{"a":"虫垂縮小と周囲脂肪濃度低下を認める","b":"虫垂腫大と周囲脂肪濃度上昇を認める","c":"虫垂内ガスだけで炎症の否定ができる","d":"虫垂石だけで重症度の確定ができる"},"answer":"b","explanation":"急性虫垂炎では、炎症による浮腫や分泌物の貯留により虫垂自体が太く腫大し（径6mm以上）、さらにその周囲の脂肪組織が炎症反応によって浸潤をきたしモヤモヤと濃度上昇（不透過性亢進）する。","tags":"急性虫垂炎;虫垂腫大;周囲脂肪濃度上昇"},{"id":"AM-23","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"急性大腸憩室炎でみられやすいCT所見はどれか。","choices":{"a":"憩室内腔の空気量増加を主体に認める","b":"腸管壁の一様な菲薄化を主体に認める","c":"憩室周囲の脂肪濃度上昇を主体に認める","d":"腸間膜血管の著明な完全消失を認める"},"answer":"c","explanation":"大腸憩室に炎症が波及する急性大腸憩室炎では、原因となる大腸憩室の描出に加え、その周囲の脂肪織が炎症によりモヤモヤと濃度上昇（脂肪織の炎症性変化）を来す所見が主体となる。","tags":"急性大腸憩室炎;憩室周囲脂肪;濃度上昇"},{"id":"AM-24","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"CTコロノグラフィで大腸内腔を評価するために必要な処置はどれか。","choices":{"a":"静脈造影剤だけで大腸を拡張させる","b":"陽性経口造影剤だけで大腸を収縮させる","c":"鎮静薬だけで大腸のひだを消失させる","d":"前処置と送気で大腸内腔を拡張させる"},"answer":"d","explanation":"CTコロノグラフィ（CTによる大腸検査）では、便をきれいに排出する腸管前処置を行った上で、炭酸ガスや空気を用いて大腸内腔を十分に膨らませて（送気）撮影する必要がある。","tags":"CTコロノグラフィ;前処置;送気"},{"id":"AM-25","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"消化管","question":"活動性消化管出血の多相CTで造影前像を撮影する意義はどれか。","choices":{"a":"造影前像で既存高吸収物を区別する","b":"造影前像で腸管運動の方向だけを測定する","c":"造影前像で粘膜深達度だけを確定する","d":"造影前像で腫瘍組織型だけを判定する"},"answer":"a","explanation":"出血点を探すダイナミックCTにおいて、造影前像（単純CT）を撮影しておくことで、もともと腸管内にある高吸収なもの（消化管内の結石、血腫、あるいは内服薬や造影剤の残渣など）と、造影剤の血管外漏出（出血）を的確に区別できる。","tags":"活動性消化管出血;造影前像;既存高吸収物"},{"id":"AM-26","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"腎臓の皮髄相で主に評価される造影所見はどれか。","choices":{"a":"腎髄質と尿路の排泄を主に評価する","b":"腎皮質と髄質の造影差を評価する","c":"腎盂と尿管の充満像だけを評価する","d":"膀胱と尿道の排泄像だけを評価する"},"answer":"b","explanation":"腎臓の皮髄相（約30〜40秒後）では、造影剤が主に血流の豊富な腎皮質に強く行きわたり、まだ髄質には十分に到達していないため、腎皮質と髄質のコントラスト（造影差）が最も明瞭に描出される。","tags":"腎臓;皮髄相;造影差"},{"id":"AM-27","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"腎実質相が特に適している評価対象はどれか。","choices":{"a":"腎動脈狭窄の瞬時評価に適する","b":"尿管全長の充満像評価に適する","c":"小さな腎実質腫瘤の検出に適する","d":"膀胱結石の成分確定に適する"},"answer":"c","explanation":"腎実質相（ネフログラム相：約80〜100秒後）では、腎皮質および髄質の両方が均一かつ十分に造影されるため、正常組織とわずかな密度差しかないような小さな腎実質腫瘤（小腎がんなど）の検出に最も適している。","tags":"腎実質相;腎実質腫瘤;検出"},{"id":"AM-28","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"CT尿路造影における排泄相の主な目的はどれか。","choices":{"a":"腎皮質と髄質の初期濃染を主に評価する","b":"腎静脈の早期還流だけを主に評価する","c":"腎周囲脂肪の濃度変化だけを評価する","d":"腎盂尿管内の造影剤充満を評価する"},"answer":"d","explanation":"排泄相（遅延相）は、血液中の造影剤が糸球体から尿路へ排泄される時期を利用し、腎盂、尿管、膀胱といった尿路システムの中に造影剤を満たしてその形態や異常（充満欠損など）を評価することを主目的とする。","tags":"CT尿路造影;排泄相;造影剤充満"},{"id":"AM-29","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"通常の腎血管解剖について正しいのはどれか。","choices":{"a":"左腎静脈は大動脈の前方を通過する","b":"左腎静脈は下大静脈の後方を通過する","c":"右腎静脈は大動脈の後方を通過する","d":"右腎静脈は上腸間膜動脈内を通過する"},"answer":"a","explanation":"解剖学的に左腎静脈は腹部大動脈の前方を横切って下大静脈に注ぐ（上腸間膜動脈と腹部大動脈の間を通過することでも知られる）。右腎静脈は短い。","tags":"腎血管解剖;左腎静脈;大動脈前方"},{"id":"AM-30","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"淡明細胞型腎細胞癌の典型的な造影特性はどれか。","choices":{"a":"皮髄相で周囲腎皮質より造影が乏しい","b":"皮髄相で豊富な造影効果を示しやすい","c":"排泄相で尿路と同じ形に造影される","d":"単純相で水と同じ濃度を必ず示す"},"answer":"b","explanation":"淡明細胞型腎細胞癌は非常に血流が豊富な（多血性）腫瘍であるため、造影剤投与後の皮髄相において周囲の腎皮質に匹敵する、あるいはそれに類する豊富な造影効果（強い濃染）を示すのが典型的である。","tags":"淡明細胞型腎細胞癌;皮髄相;造影効果"},{"id":"AM-31","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"乳頭状腎細胞癌にみられやすい造影特性はどれか。","choices":{"a":"各造影相で強い造影効果を示しやすい","b":"全撮影相で脂肪濃度を示しやすい","c":"各造影相で淡い造影効果を示しやすい","d":"排泄相で尿管内へ移動しやすい"},"answer":"c","explanation":"乳頭状腎細胞癌は淡明細胞型とは異なり、血流が乏しい（少血性）腫瘍であることが多いため、ダイナミックCTの各造影相を通じて全体的に淡い（緩徐で弱い）造影効果を示すことが多い。","tags":"乳頭状腎細胞癌;造影特性;淡い造影効果"},{"id":"AM-32","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"典型的な腎血管筋脂肪腫の診断に有用なCT所見はどれか。","choices":{"a":"腫瘤内の液体成分の存在が診断根拠となる","b":"腫瘤内の空気成分の存在が診断根拠となる","c":"腫瘤内の造影欠損の存在が診断根拠となる","d":"腫瘤内の肉眼的脂肪が診断根拠となる"},"answer":"d","explanation":"腎血管筋脂肪腫（AML）は平滑筋や血管のほかに成熟した脂肪組織を豊富に含むため、CT上でCT値がマイナスを示す「肉眼的脂肪成分（脂肪の存在）」が確認できることが決定的・特異的な診断根拠となる。","tags":"腎血管筋脂肪腫;肉眼的脂肪;診断所見"},{"id":"AM-33","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"単純性腎嚢胞に合致するCT所見はどれか。","choices":{"a":"薄く平滑な壁で内部に造影効果を認めない","b":"厚く不整な壁で内部に造影効果を認める","c":"多数の壁在結節に造影効果を認める","d":"充実性成分内に強い造影効果を認める"},"answer":"a","explanation":"単純性腎嚢胞は良性の水様内容物を持った袋であるため、CTでは境界が明瞭で、壁が極めて薄く平滑であり、造影剤を投与しても内部や壁に一切の造影効果を認めない。","tags":"単純性腎嚢胞;薄く平滑な壁;造影効果なし"},{"id":"AM-34","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory":"泌尿器","question":"急性腎盂腎炎でみられることがある造影CT所見はどれか。","choices":{"a":"腎実質に均一な脂肪置換を認める","b":"腎実質に線状の造影むらを認める","c":"腎盂内に必ず大きな石灰化を認める","d":"尿管内に必ず空気貯留を認める"},"answer":"b","explanation":"急性腎盂腎炎では、炎症による血流動態の乱れや浮腫を反映して、造影CT（特に皮髄相や実質相）において病変部に条状・線状あるいは楔状の造影不良域（造影むら・ストリーク状の染まりの低下）が認められることがある。","tags":"急性腎盂腎炎;造影むら;線状"},{"id":"AM-35","category":"腹部・消化管・泌尿器・整形外科領域CT","subcategory
